<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venta rápida · ACEII</title>
<link rel="stylesheet" href="estilos.css">
<script src="comun.js"></script>
<style>
  /* Botones rápidos */
  #zonaRapidos {
    max-width: 480px;
    margin: 12px auto 0;
    padding: 0 12px;
  }
  #zonaRapidos .titulo-fila {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  #zonaRapidos .titulo-fila h4 {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--texto);
  }
  #zonaRapidos .titulo-fila button {
    padding: 6px 10px;
    margin: 0;
    font-size: 13px;
  }

  #botonesRapidos {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .btn-rapido {
    background: #fff;
    border: 2px solid var(--azul-suave);
    border-radius: var(--radio);
    padding: 10px 6px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
    color: var(--texto);
    font-family: var(--fuente);
    min-height: 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 4px;
  }
  .btn-rapido:active {
    transform: scale(0.95);
    background: var(--azul-suave);
  }
  .btn-rapido .emoji {
    font-size: 24px;
    line-height: 1;
  }
  .btn-rapido .nom {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.15;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .btn-rapido .pre {
    font-size: 11px;
    color: var(--azul);
    font-weight: 700;
  }
  .btn-rapido.grupo {
    border-color: var(--naranja);
    background: #FFF8E8;
  }

  /* Panel de variantes */
  #panelVariantes {
    display: none;
    max-width: 480px;
    margin: 10px auto 0;
    padding: 12px;
    background: var(--superficie-2);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
  }
  #panelVariantes.abierto { display: block; }
  #panelVariantes .titulo-var {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-weight: 700;
    color: var(--texto);
  }
  #panelVariantes .titulo-var button {
    background: transparent;
    color: var(--texto-suave);
    font-size: 14px;
    padding: 4px 8px;
    margin: 0;
  }
  #listaVariantes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .btn-variante {
    background: #fff;
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 10px;
    text-align: left;
    cursor: pointer;
    font-family: var(--fuente);
    font-size: 13px;
    font-weight: 600;
    color: var(--texto);
    transition: transform 0.1s;
  }
  .btn-variante:active { transform: scale(0.95); }
  .btn-variante .nom-v { display: block; font-size: 13px; }
  .btn-variante .pre-v { display: block; font-size: 12px; color: var(--azul); font-weight: 700; margin-top: 2px; }

  /* Buscador */
  #resultados {
    max-height: 200px;
    overflow-y: auto;
  }
  .resultado {
    padding: 12px;
    border-bottom: 1px solid #E8ECF4;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .resultado:last-child { border-bottom: none; }
  .resultado:hover { background: var(--superficie-2); }
  .resultado .info { flex: 1; min-width: 0; }
  .resultado .nombre { font-size: 14px; font-weight: 600; color: var(--texto); }
  .resultado .meta { font-size: 12px; color: var(--texto-suave); }
  .resultado .precio { color: var(--azul); font-weight: 700; }

  /* Carrito */
  #total {
    font-size: 26px;
    color: var(--azul);
    font-weight: 700;
    text-align: center;
    margin: 10px 0;
  }
  .item-carrito {
    padding: 10px 0;
    border-bottom: 1px solid #E8ECF4;
  }
  .item-carrito:last-child { border-bottom: none; }
  .item-fila {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-nombre { font-size: 14px; font-weight: 600; color: var(--texto); }
  .item-precio { font-size: 12px; color: var(--texto-suave); margin-top: 2px; }
  .item-controles {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .item-controles button {
    padding: 6px 12px;
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    background: var(--superficie-2);
    color: var(--azul);
    border-radius: 8px;
    min-width: 34px;
  }
  .item-controles button.quitar {
    background: #FFE5E5;
    color: var(--alerta);
  }
  .item-controles .cant {
    min-width: 28px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
  }

  /* Botones de cobro */
  .cobro-fila {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .cobro-fila button {
    flex: 1;
    margin: 0;
    padding: 18px 10px;
    font-size: 15px;
    font-weight: 700;
    border-radius: var(--radio);
    color: #fff;
    border: none;
  }
  #btnEfectivo { background: var(--exito); }
  #btnTransferencia { background: var(--azul); }
  .cobro-fila button:disabled { opacity: 0.4; }
  .cobro-fila button:active { transform: scale(0.98); }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-contenido">
    <img src="logo_ACEII.png" alt="ACEII" class="app-header-logo">
    <div class="app-header-texto">
      <div class="app-header-titulo">⚡ Venta rápida</div>
      <div class="app-header-sub">
        <a href="index.html" style="color:rgba(255,255,255,0.9); text-decoration:underline;">← Volver al menú</a>
      </div>
    </div>
  </div>
</header>

<div id="estado">Cargando...</div>

<!-- Botones rápidos -->
<div id="zonaRapidos">
  <div class="titulo-fila">
    <h4>⚡ Rápidos</h4>
    <button id="btnConfigurar" type="button">⚙️</button>
  </div>
  <div id="botonesRapidos"></div>
</div>

<!-- Panel de variantes -->
<div id="panelVariantes">
  <div class="titulo-var">
    <span id="tituloVariantes">Elige una opción</span>
    <button id="btnCerrarVariantes" type="button">✕</button>
  </div>
  <div id="listaVariantes"></div>
</div>

<!-- Buscador -->
<div class="caja">
  <input type="text" id="buscar" placeholder="🔍 Buscar otros productos..." autocomplete="off">
  <div id="resultados"></div>
</div>

<!-- Carrito -->
<div class="caja">
  <h4 style="margin:0 0 12px; font-size:15px; font-weight:700;">Carrito</h4>
  <div id="carrito" style="color:var(--texto-suave); font-size:14px;">(vacío)</div>
  <div id="total">Total: $0</div>

  <div class="cobro-fila">
    <button id="btnEfectivo" disabled>💵 EFECTIVO</button>
    <button id="btnTransferencia" disabled>📱 TRANSFERENCIA</button>
  </div>

  <button id="btnVaciar" style="width:100%; margin-top:10px;">🗑️ Vaciar carrito</button>
</div>

<!-- Modal de configuración -->
<div id="modalConfig" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:200; padding:20px; box-sizing:border-box; overflow-y:auto;">
  <div style="max-width:480px; margin:20px auto; background:#fff; border-radius:16px; padding:20px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <strong style="font-size:16px;">Configurar botones rápidos</strong>
      <button id="btnCerrarConfig" style="padding:6px 10px; margin:0;">✕</button>
    </div>
    <p style="font-size:13px; color:var(--texto-suave); margin-bottom:12px;">Elige hasta 6 productos o grupos. Los botones se muestran siempre arriba.</p>
    <input type="text" id="buscarConfig" placeholder="Buscar producto..." style="width:100%; padding:10px; border-radius:8px; border:1.5px solid #E8ECF4; font-size:14px; margin-bottom:8px;">
    <div id="listaConfig" style="max-height:400px; overflow-y:auto;"></div>
    <button class="main" id="btnGuardarConfig" style="width:100%; margin-top:12px;">Guardar configuración</button>
  </div>
</div>

<script>
exigirSesion();
pintarUsuarioTurno();

const RAPIDOS_KEY = 'caf_rapidos';
const CARRITO_KEY = 'caf_carrito_rapido';

let productos = [];
let carrito = [];
let rapidos = []; // array de IDs seleccionados por el usuario
let seleccionConfig = []; // IDs mientras configuras

function fmt(n) { return '$' + Number(n || 0).toLocaleString('es-CO'); }

// ---------- Arranque ----------
(async function () {
  const ok = await exigirTurnoCajaAbierto();
  if (!ok) return;
  await cargarProductos();
  cargarRapidosGuardados();
  cargarCarritoGuardado();
  pintarRapidos();
  pintarCarrito();
})();

async function cargarProductos() {
  mostrar('Cargando productos...', 'aviso');
  try {
    const r = await jsonp({ accion: 'productos_venta' }, 25000);
    if (r && r.error === 'Token inválido') { borrarToken(); location.href = 'index.html'; return; }
    if (!r || !r.ok) throw new Error(r && r.error ? r.error : 'respuesta vacía');
    productos = r.items;
    mostrar('Listo para vender');
  } catch (err) {
    mostrar('No se pudieron cargar los productos: ' + err.message, 'error');
  }
}

// ---------- Botones rápidos ----------
function cargarRapidosGuardados() {
  try {
    const arr = JSON.parse(localStorage.getItem(RAPIDOS_KEY) || 'null');
    if (Array.isArray(arr) && arr.length > 0) {
      rapidos = arr;
    } else {
      // Por defecto: buscar las 6 empanadas y algunos productos típicos
      const defaults = [];
      // Buscar grupo "Empanadas"
      const empanadas = productos.filter(function (p) {
        return norm(p.categoria).indexOf('empanada') >= 0;
      });
      if (empanadas.length > 0) defaults.push('GRUPO_Empanadas');

      // Buscar productos específicos por nombre
      ['chocoramo', 'gansito', 'jugo hit', 'agua pequeña'].forEach(function (nombre) {
        const p = productos.find(function (x) { return norm(x.nombre).indexOf(nombre) >= 0; });
        if (p) defaults.push(p.id);
      });

      rapidos = defaults.slice(0, 6);
    }
  } catch (e) { rapidos = []; }
}

function guardarRapidos() {
  try { localStorage.setItem(RAPIDOS_KEY, JSON.stringify(rapidos)); } catch (e) {}
}

function pintarRapidos() {
  const cont = $('botonesRapidos');
  cont.innerHTML = '';

  if (rapidos.length === 0) {
    cont.innerHTML = '<div style="grid-column: span 3; text-align:center; color:var(--texto-suave); font-size:13px; padding:20px;">Sin botones rápidos. Toca ⚙️ para configurarlos.</div>';
    return;
  }

  rapidos.forEach(function (rid) {
    if (rid.startsWith('GRUPO_')) {
      // Es un grupo (por ejemplo, Empanadas)
      const nombreGrupo = rid.replace('GRUPO_', '');
      const itemsGrupo = productos.filter(function (p) {
        return norm(p.categoria) === norm(nombreGrupo);
      });
      if (itemsGrupo.length === 0) return;

      const btn = document.createElement('button');
      btn.className = 'btn-rapido grupo';
      btn.innerHTML =
        '<span class="emoji">🥟</span>' +
        '<span class="nom">' + nombreGrupo + '</span>' +
        '<span class="pre">' + itemsGrupo.length + ' tipos</span>';
      btn.addEventListener('click', function () { mostrarVariantes(nombreGrupo, itemsGrupo); });
      cont.appendChild(btn);
    } else {
      // Es un producto individual
      const p = productos.find(function (x) { return x.id === rid; });
      if (!p) return;

      const btn = document.createElement('button');
      btn.className = 'btn-rapido';
      btn.innerHTML =
        '<span class="emoji">📦</span>' +
        '<span class="nom">' + p.nombre + '</span>' +
        '<span class="pre">' + fmt(p.precio) + '</span>';
      btn.addEventListener('click', function () { agregarAlCarrito(p); });
      cont.appendChild(btn);
    }
  });
}

// ---------- Variantes (panel desplegable) ----------
function mostrarVariantes(nombre, items) {
  $('tituloVariantes').textContent = nombre;
  const cont = $('listaVariantes');
  cont.innerHTML = '';
  items.forEach(function (p) {
    const btn = document.createElement('button');
    btn.className = 'btn-variante';
    btn.innerHTML =
      '<span class="nom-v">' + p.nombre + '</span>' +
      '<span class="pre-v">' + fmt(p.precio) + '</span>';
    btn.addEventListener('click', function () {
      agregarAlCarrito(p);
      $('panelVariantes').classList.remove('abierto');
    });
    cont.appendChild(btn);
  });
  $('panelVariantes').classList.add('abierto');
  // Scroll al panel
  $('panelVariantes').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

$('btnCerrarVariantes').addEventListener('click', function () {
  $('panelVariantes').classList.remove('abierto');
});

// ---------- Agregar al carrito ----------
function agregarAlCarrito(p) {
  const existente = carrito.find(function (x) { return x.id === p.id; });
  if (existente) {
    existente.cantidad++;
  } else {
    carrito.push({
      id: p.id,
      nombre: p.nombre,
      precio: p.precio,
      cantidad: 1
    });
  }
  if (navigator.vibrate) navigator.vibrate(40);
  pintarCarrito();
  guardarCarrito();
}

// ---------- Carrito ----------
function pintarCarrito() {
  const c = $('carrito');
  if (!carrito.length) {
    c.textContent = '(vacío)';
    c.style.color = 'var(--texto-suave)';
    $('total').textContent = 'Total: $0';
    $('btnEfectivo').disabled = true;
    $('btnTransferencia').disabled = true;
    return;
  }
  c.innerHTML = '';
  c.style.color = 'var(--texto)';
  let total = 0;
  carrito.forEach(function (it, i) {
    total += it.precio * it.cantidad;
    const d = document.createElement('div');
    d.className = 'item-carrito';

    const fila = document.createElement('div');
    fila.className = 'item-fila';

    const info = document.createElement('div');
    info.className = 'item-info';
    info.innerHTML = '<div class="item-nombre">' + it.nombre + '</div>' +
                     '<div class="item-precio">' + fmt(it.precio) + ' c/u</div>';

    const controles = document.createElement('div');
    controles.className = 'item-controles';

    const menos = document.createElement('button');
    menos.textContent = '−';
    menos.addEventListener('click', function () {
      if (it.cantidad > 1) {
        it.cantidad--;
      } else {
        carrito.splice(i, 1);
      }
      pintarCarrito();
      guardarCarrito();
    });

    const cant = document.createElement('span');
    cant.className = 'cant';
    cant.textContent = it.cantidad;

    const mas = document.createElement('button');
    mas.textContent = '+';
    mas.addEventListener('click', function () {
      it.cantidad++;
      pintarCarrito();
      guardarCarrito();
    });

    const quitar = document.createElement('button');
    quitar.className = 'quitar';
    quitar.textContent = '✕';
    quitar.addEventListener('click', function () {
      carrito.splice(i, 1);
      pintarCarrito();
      guardarCarrito();
    });

    controles.appendChild(menos);
    controles.appendChild(cant);
    controles.appendChild(mas);
    controles.appendChild(quitar);

    fila.appendChild(info);
    fila.appendChild(controles);
    d.appendChild(fila);
    c.appendChild(d);
  });
  $('total').textContent = 'Total: ' + fmt(total);
  $('btnEfectivo').disabled = false;
  $('btnTransferencia').disabled = false;
}

function guardarCarrito() {
  try { localStorage.setItem(CARRITO_KEY, JSON.stringify(carrito)); } catch (e) {}
}
function cargarCarritoGuardado() {
  try {
    const arr = JSON.parse(localStorage.getItem(CARRITO_KEY) || '[]');
    if (Array.isArray(arr)) carrito = arr;
  } catch (e) { carrito = []; }
}

$('btnVaciar').addEventListener('click', function () {
  if (carrito.length && !confirm('¿Vaciar el carrito?')) return;
  carrito = [];
  pintarCarrito();
  guardarCarrito();
});

// ---------- Buscador ----------
function pintarResultados() {
  const q = norm($('buscar').value);
  const cont = $('resultados');
  cont.innerHTML = '';
  if (q.length < 2) return;
  let n = 0;
  productos.forEach(function (p) {
    if (n >= 8) return;
    if (norm(p.id + ' ' + p.nombre).indexOf(q) < 0) return;
    n++;
    const d = document.createElement('div');
    d.className = 'resultado';
    d.innerHTML =
      '<div class="info">' +
        '<div class="nombre">' + p.nombre + '</div>' +
        '<div class="meta">' + p.id + '</div>' +
      '</div>' +
      '<div class="precio">' + fmt(p.precio) + '</div>';
    d.addEventListener('click', function () {
      agregarAlCarrito(p);
      $('buscar').value = '';
      cont.innerHTML = '';
      $('buscar').focus();
    });
    cont.appendChild(d);
  });
  if (!n) {
    cont.innerHTML = '<div style="padding:14px; text-align:center; color:var(--texto-suave); font-size:13px;">Sin resultados.</div>';
  }
}

$('buscar').addEventListener('input', pintarResultados);

// ---------- Cobrar ----------
function nuevoIdVenta() {
  const d = new Date();
  const p = function (n) { return ('0' + n).slice(-2); };
  return 'VEN-' + String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
}

async function cobrar(medio) {
  if (!carrito.length) return;
  const u = getUsuarioTurno();
  if (!u) { mostrar('No hay turno iniciado', 'error'); return; }

  // Si es efectivo, preguntar cuánto pagó el cliente (opcional)
  let cambio = null;
  let recibido = null;
  if (medio === 'Efectivo') {
    const total = carrito.reduce(function (s, it) { return s + it.precio * it.cantidad; }, 0);
    const resp = prompt('Cliente paga con efectivo.\nTotal: ' + fmt(total) + '\n\n¿Con cuánto paga? (opcional, deja vacío para omitir):', '');
    if (resp !== null && resp.trim() !== '') {
      recibido = Number(resp.trim());
      if (!isNaN(recibido) && recibido >= total) {
        cambio = recibido - total;
      }
    }
  }

  const idVenta = nuevoIdVenta();
  $('btnEfectivo').disabled = true;
  $('btnTransferencia').disabled = true;
  mostrar('Guardando venta...', 'aviso');

  try {
    const r = await post({
      accion: 'venta',
      id_venta: idVenta,
      id_usuario: u.id,
      id_turno: (getTurnoActual() ? getTurnoActual().id : ''),
      medio_pago: medio,
      observaciones: '',
      items: carrito.map(function (it) { return { id_producto: it.id, cantidad: it.cantidad }; })
    });
    if (r.ok) {
      let msj = '✓ ' + medio + ' · ' + r.lineas + ' línea(s)';
      if (cambio !== null) msj += ' · Cambio: ' + fmt(cambio);
      mostrar(msj, 'ok');
      if (navigator.vibrate) navigator.vibrate(200);
      if (cambio !== null && cambio > 0) {
        alert('Cambio: ' + fmt(cambio));
      }
      carrito = [];
      pintarCarrito();
      guardarCarrito();
    } else if (r.error === 'Token inválido') {
      borrarToken(); location.href = 'index.html';
    } else {
      mostrar(r.error || 'Error desconocido', 'error');
      $('btnEfectivo').disabled = false;
      $('btnTransferencia').disabled = false;
    }
  } catch (err) {
    mostrar('Sin conexión. Revisa internet.', 'error');
    $('btnEfectivo').disabled = false;
    $('btnTransferencia').disabled = false;
  }
}

$('btnEfectivo').addEventListener('click', function () { cobrar('Efectivo'); });
$('btnTransferencia').addEventListener('click', function () { cobrar('Transferencia'); });

// ---------- Configuración de botones rápidos ----------
$('btnConfigurar').addEventListener('click', function () {
  seleccionConfig = rapidos.slice();
  $('modalConfig').style.display = 'block';
  pintarListaConfig();
});

$('btnCerrarConfig').addEventListener('click', function () {
  $('modalConfig').style.display = 'none';
});

function pintarListaConfig() {
  const cont = $('listaConfig');
  const q = norm($('buscarConfig').value);
  cont.innerHTML = '';

  // Opción: grupo Empanadas
  if (!q || 'empanadas'.indexOf(q) >= 0) {
    const empanadasCount = productos.filter(function (p) { return norm(p.categoria).indexOf('empanada') >= 0; }).length;
    if (empanadasCount > 0) {
      const d = document.createElement('div');
      const sel = seleccionConfig.indexOf('GRUPO_Empanadas') >= 0;
      d.style.cssText = 'padding:10px; border-bottom:1px solid #E8ECF4; cursor:pointer; display:flex; justify-content:space-between; align-items:center;' + (sel ? ' background:#E3ECFF;' : '');
      d.innerHTML = '<div><strong>🥟 Empanadas</strong><br><small style="color:var(--texto-suave);">' + empanadasCount + ' tipos</small></div>' + (sel ? '✓' : '○');
      d.addEventListener('click', function () {
        const idx = seleccionConfig.indexOf('GRUPO_Empanadas');
        if (idx >= 0) seleccionConfig.splice(idx, 1);
        else if (seleccionConfig.length < 6) seleccionConfig.push('GRUPO_Empanadas');
        else alert('Máximo 6 botones');
        pintarListaConfig();
      });
      cont.appendChild(d);
    }
  }

  // Productos individuales
  const filtrados = productos.filter(function (p) {
    if (q && norm(p.id + ' ' + p.nombre).indexOf(q) < 0) return false;
    return true;
  }).sort(function (a, b) { return a.nombre.localeCompare(b.nombre); });

  filtrados.slice(0, 50).forEach(function (p) {
    const d = document.createElement('div');
    const sel = seleccionConfig.indexOf(p.id) >= 0;
    d.style.cssText = 'padding:10px; border-bottom:1px solid #E8ECF4; cursor:pointer; display:flex; justify-content:space-between; align-items:center;' + (sel ? ' background:#E3ECFF;' : '');
    d.innerHTML = '<div><strong>' + p.nombre + '</strong><br><small style="color:var(--texto-suave);">' + p.id + ' · ' + fmt(p.precio) + '</small></div>' + (sel ? '✓' : '○');
    d.addEventListener('click', function () {
      const idx = seleccionConfig.indexOf(p.id);
      if (idx >= 0) seleccionConfig.splice(idx, 1);
      else if (seleccionConfig.length < 6) seleccionConfig.push(p.id);
      else alert('Máximo 6 botones');
      pintarListaConfig();
    });
    cont.appendChild(d);
  });
}

$('buscarConfig').addEventListener('input', pintarListaConfig);

$('btnGuardarConfig').addEventListener('click', function () {
  rapidos = seleccionConfig.slice(0, 6);
  guardarRapidos();
  pintarRapidos();
  $('modalConfig').style.display = 'none';
  mostrar('Botones rápidos actualizados ✓', 'ok');
});
</script>
</body>
</html>
