<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recepción · ACEII</title>
<link rel="stylesheet" href="estilos.css">
<script src="comun.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<style>
  #lista { max-height: 240px; }
  .linea {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #E8ECF4;
    font-size: 14px;
  }
  .linea:last-child { border-bottom: none; }
  .linea button {
    padding: 4px 10px;
    margin: 0;
    background: #FFE5E5;
    color: var(--alerta);
    font-weight: 700;
    border-radius: 8px;
  }
  #panel {
    background: var(--superficie-2);
    padding: 14px;
    border-radius: var(--radio-sm);
    margin-top: 12px;
  }
  #total {
    font-size: 18px;
    color: var(--azul);
    font-weight: 700;
    margin: 10px 0;
    text-align: center;
  }
  #pend {
    color: var(--aviso);
    font-size: 13px;
    margin-top: 8px;
    text-align: center;
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-contenido">
    <img src="logo_ACEII.png" alt="ACEII" class="app-header-logo">
    <div class="app-header-texto">
      <div class="app-header-titulo">Recepción</div>
      <div class="app-header-sub">
        <a href="index.html" style="color:rgba(255,255,255,0.9); text-decoration:underline;">← Volver al menú</a>
      </div>
    </div>
  </div>
</header>

<div id="estado">Cargando...</div>

<div class="caja">
  <label>Proveedor</label>
  <select id="proveedor"></select>
  <label>Recibido por</label>
  <select id="recibido"></select>
  <label>¿Trae factura?</label>
  <select id="factura"><option value="Sí">Sí</option><option value="No">No</option></select>
</div>

<div class="caja">
  <label>Producto</label>
  <button class="main" id="btnCam" style="width:100%; margin-bottom:8px;">📷 Escanear código de barras</button>
  <input type="text" id="buscar" placeholder="O escribe parte del nombre o del ID">
  <label><input type="checkbox" id="soloProv"> Solo productos de este proveedor</label>
  <select id="lista" size="6"></select>
  <div id="elegido" style="font-size:13px; color:var(--texto-suave); margin-top:6px;">Ningún producto elegido</div>

  <div id="panel" style="display:none;">
    <div class="fila">
      <button id="btnUnd" class="tog on">Unidades</button>
      <button id="btnPaq" class="tog">Paquetes</button>
    </div>
    <label>Cantidad</label>
    <input type="number" id="cantidad" min="1" step="1" value="1" inputmode="numeric">
    <div id="bloquePaq" style="display:none;">
      <label>Unidades por paquete (verifícalo)</label>
      <input type="number" id="upp" min="1" step="1" inputmode="numeric">
      <label id="lblRecordar" style="display:none;"><input type="checkbox" id="recordar" checked> Recordar este tamaño para este producto</label>
    </div>
    <div id="total">Total: —</div>
    <button class="main" id="btnAgregar" style="width:100%;">Agregar a la lista</button>
  </div>
</div>

<div class="caja">
  <label>Lista de esta recepción</label>
  <div id="listaItems" style="color:var(--texto-suave); font-size:14px;">(vacía)</div>
  <label>Observaciones (opcional)</label>
  <input type="text" id="obs" maxlength="300">
  <button class="main" id="btnConfirmar" disabled style="width:100%; margin-top:8px;">Confirmar recepción</button>
  <div id="pend"></div>
</div>

<!-- Modal de cámara -->
<div id="modalCam" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:100;">
  <button id="btnCerrarCam" style="position:absolute; top:12px; right:12px; padding:10px 14px; background:var(--alerta); color:#fff; border:none; border-radius:10px; font-weight:600; z-index:2;">Cerrar</button>
  <video id="video" playsinline muted autoplay style="width:100%; height:100%; object-fit:cover;"></video>
  <div id="marco" style="position:absolute; left:5%; top:27.5%; width:90%; height:45%; border:3px solid #00e676; border-radius:10px; box-sizing:border-box; pointer-events:none;"></div>
  <div id="infoCam" style="position:absolute; bottom:20px; left:20px; right:20px; background:rgba(0,0,0,0.7); padding:12px; border-radius:10px; text-align:center; color:#fff; font-size:14px;">Apunta al código de barras</div>
</div>

<script>
exigirSesion();

const COLA_KEY = 'caf_cola_recepciones';
const BORRADOR_KEY = 'caf_borrador_recepcion';
let productos = [];
let elegido = null;
let modoUnidad = 'Unidades';
let carrito = [];
let cola = [];
let enviando = false;

function idRecepcion() {
  const d = new Date();
  const p = function (n) { return ('0' + n).slice(-2); };
  return 'REC-' + String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()) +
    '-' + p(d.getHours()) + p(d.getMinutes()) + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
}

function llenarSelect(sel, items, vacio) {
  sel.innerHTML = '';
  sel.appendChild(new Option(vacio, ''));
  items.forEach(function (it) { sel.appendChild(new Option(it.t, it.v)); });
}

function leerCola() {
  try {
    const a = JSON.parse(localStorage.getItem(COLA_KEY) || '[]');
    return Array.isArray(a) ? a : [];
  } catch (e) { return []; }
}
function pintarPend() {
  $('pend').textContent = cola.length ? 'Pendientes de enviar: ' + cola.length : '';
}
function guardarCola() {
  try { localStorage.setItem(COLA_KEY, JSON.stringify(cola)); } catch (e) {}
  pintarPend();
}

async function procesarCola() {
  if (enviando || !cola.length) return;
  enviando = true;
  try {
    while (cola.length) {
      let r = null;
      try { r = await post(Object.assign({ accion: 'recepcion' }, cola[0])); } catch (err) { r = null; }
      if (!r) {
        mostrar('Sin conexión · ' + cola.length + ' recepción(es) pendiente(s).', 'aviso');
        setTimeout(procesarCola, 5000);
        return;
      }
      if (r.error === 'Token inválido') { borrarToken(); location.href = 'index.html'; return; }
      if (r.ok) {
        cola.shift();
        guardarCola();
        mostrar('Recepción ' + r.id + ' guardada ✓' + (r.repetido ? ' (ya estaba registrada)' : ' · ' + r.lineas + ' línea(s), ' + r.unidades + ' unidades'), 'ok');
        if (navigator.vibrate) navigator.vibrate(200);
      } else if (r.bloqueo) {
        cola.shift();
        guardarCola();
        mostrar('Recepción rechazada: ' + r.error, 'error');
      } else {
        mostrar('Error del servidor: ' + (r.error || 'desconocido'), 'aviso');
        setTimeout(procesarCola, 5000);
        return;
      }
    }
  } finally {
    enviando = false;
  }
}

function validar() {
  $('btnConfirmar').disabled = !(carrito.length && $('proveedor').value && $('recibido').value);
}
function guardarBorrador() {
  try {
    localStorage.setItem(BORRADOR_KEY, JSON.stringify({
      carrito: carrito,
      proveedor: $('proveedor').value,
      recibido: $('recibido').value,
      factura: $('factura').value,
      obs: $('obs').value
    }));
  } catch (e) {}
  validar();
}
function restaurarBorrador() {
  try {
    const b = JSON.parse(localStorage.getItem(BORRADOR_KEY) || 'null');
    if (!b) return;
    carrito = Array.isArray(b.carrito) ? b.carrito : [];
    $('proveedor').value = b.proveedor || '';
    $('recibido').value = b.recibido || '';
    $('factura').value = b.factura || 'Sí';
    $('obs').value = b.obs || '';
  } catch (e) {}
}

async function cargarDatos() {
  mostrar('Cargando datos...', 'aviso');
  try {
    const r = await Promise.all([
      jsonp({ accion: 'productos' }, 20000),
      jsonp({ accion: 'proveedores' }, 20000),
      jsonp({ accion: 'usuarios' }, 20000)
    ]);
    if (r.some(function (x) { return x && x.error === 'Token inválido'; })) {
      borrarToken();
      location.href = 'index.html';
      return;
    }
    const mala = r.find(function (x) { return !x || !x.ok; });
    if (mala) throw new Error(mala && mala.error ? mala.error : 'respuesta vacía');
    productos = r[0].items.filter(function (p) { return norm(p.modo) !== 'servicio'; });
    llenarSelect($('proveedor'), r[1].items.map(function (n) { return { v: n, t: n }; }), 'Elige el proveedor...');
    llenarSelect($('recibido'), r[2].items.map(function (u) { return { v: u.nombre, t: u.nombre }; }), 'Elige quién recibe...');
    restaurarBorrador();
    pintarLista();
    pintarCarrito();
    mostrar('Elige un producto o escanea el código');
  } catch (err) {
    mostrar('No se pudieron cargar los datos: ' + err.message, 'error');
  }
}

function pintarLista() {
  const q = norm($('buscar').value);
  const prov = $('proveedor').value;
  const soloProv = $('soloProv').checked && prov;
  const sel = $('lista');
  sel.innerHTML = '';
  let n = 0;
  productos.forEach(function (p) {
    if (soloProv && p.proveedor !== prov) return;
    if (q && norm(p.id + ' ' + p.nombre).indexOf(q) < 0) return;
    n++;
    sel.appendChild(new Option(p.id + ' · ' + p.nombre, p.id));
  });
  if (!n) sel.appendChild(new Option('(sin resultados)', ''));
  if (elegido) sel.value = elegido.id;
}

function leerNum(id) {
  const n = Number($(id).value);
  return (n > 0 && Math.floor(n) === n) ? n : 0;
}

function recalcular() {
  const c = leerNum('cantidad');
  const esPaq = modoUnidad === 'Paquetes';
  const u = esPaq ? leerNum('upp') : 1;
  $('total').textContent = (c && u) ? 'Total: ' + (c * u) + ' unidades' : 'Total: —';
  $('lblRecordar').style.display = (esPaq && elegido && u && u !== elegido.upp) ? 'block' : 'none';
}

function fijarModo(m) {
  modoUnidad = m;
  $('btnUnd').className = 'tog' + (m === 'Unidades' ? ' on' : '');
  $('btnPaq').className = 'tog' + (m === 'Paquetes' ? ' on' : '');
  $('bloquePaq').style.display = (m === 'Paquetes') ? 'block' : 'none';
  recalcular();
}

function pintarPanel() {
  $('panel').style.display = elegido ? 'block' : 'none';
  $('elegido').textContent = elegido ? 'Elegido: ' + elegido.id + ' · ' + elegido.nombre : 'Ningún producto elegido';
  if (!elegido) return;
  $('cantidad').value = 1;
  $('upp').value = elegido.upp > 0 ? elegido.upp : '';
  $('recordar').checked = true;
  fijarModo('Unidades');
}

$('lista').addEventListener('change', function () {
  elegido = productos.find(function (p) { return p.id === $('lista').value; }) || null;
  pintarPanel();
});
$('buscar').addEventListener('input', pintarLista);
$('soloProv').addEventListener('change', pintarLista);
$('btnUnd').addEventListener('click', function () { fijarModo('Unidades'); });
$('btnPaq').addEventListener('click', function () { fijarModo('Paquetes'); });
$('cantidad').addEventListener('input', recalcular);
$('upp').addEventListener('input', recalcular);

$('proveedor').addEventListener('change', function () { pintarLista(); guardarBorrador(); });
$('recibido').addEventListener('change', guardarBorrador);
$('factura').addEventListener('change', guardarBorrador);
$('obs').addEventListener('input', guardarBorrador);

$('btnAgregar').addEventListener('click', function () {
  if (!elegido) return;
  const c = leerNum('cantidad');
  const esPaq = modoUnidad === 'Paquetes';
  const u = esPaq ? leerNum('upp') : 1;
  if (!c) { mostrar('Escribe una cantidad entera mayor que 0', 'error'); return; }
  if (!u) { mostrar('Escribe cuántas unidades trae cada paquete', 'error'); return; }
  carrito.push({
    id: elegido.id,
    nombre: elegido.nombre,
    cantidad: c,
    unidad: modoUnidad,
    upp: u,
    recordar: esPaq && u !== elegido.upp && $('recordar').checked
  });
  mostrar('Agregado: ' + elegido.nombre, 'ok');
  elegido = null;
  $('lista').value = '';
  pintarPanel();
  pintarCarrito();
  guardarBorrador();
});

function pintarCarrito() {
  const cont = $('listaItems');
  if (!carrito.length) {
    cont.textContent = '(vacía)';
    cont.style.color = 'var(--texto-suave)';
  } else {
    cont.innerHTML = '';
    cont.style.color = 'var(--texto)';
    carrito.forEach(function (it, i) {
      const d = document.createElement('div');
      d.className = 'linea';
      const t = document.createElement('span');
      t.textContent = it.nombre + ' — ' + (it.unidad === 'Paquetes'
        ? it.cantidad + ' paq × ' + it.upp + ' = ' + (it.cantidad * it.upp) + ' und'
        : it.cantidad + ' und');
      const b = document.createElement('button');
      b.textContent = '✕';
      b.addEventListener('click', function () { carrito.splice(i, 1); pintarCarrito(); guardarBorrador(); });
      d.appendChild(t);
      d.appendChild(b);
      cont.appendChild(d);
    });
  }
  validar();
}

$('btnConfirmar').addEventListener('click', function () {
  cola.push({
    id: idRecepcion(),
    ts: Date.now(),
    proveedor: $('proveedor').value,
    recibido_por: $('recibido').value,
    con_factura: $('factura').value,
    observaciones: $('obs').value.trim(),
    lineas: carrito.map(function (it) {
      return { id_producto: it.id, cantidad: it.cantidad, unidad: it.unidad, upp: it.upp, recordar: it.recordar };
    })
  });
  guardarCola();
  carrito = [];
  $('obs').value = '';
  pintarCarrito();
  guardarBorrador();
  mostrar('Recepción guardada en el celular · enviando...', 'aviso');
  procesarCola();
});

// ---------- Arranque ----------
window.addEventListener('online', procesarCola);
cola = leerCola();
pintarPend();

(async function () {
  const ok = await exigirTurnoCajaAbierto();
  if (!ok) return;
  cargarDatos().then(procesarCola);
})();

// ---------- Cámara para escanear ----------
let lectorZxing = null;
let stream = null;
let cicloActivo = false;
let ocupado = false;
let ultimoIntento = 0;
let numFrame = 0;
let detector = null;
let pausaLectura = false;
const canvasCam = document.createElement('canvas');
const ctxCam = canvasCam.getContext('2d', { willReadFrequently: true });
const INTERVALO_MS = 40;
const FORMATOS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'];

if ('BarcodeDetector' in window) {
  BarcodeDetector.getSupportedFormats().then(function (f) {
    const ok = FORMATOS.filter(function (x) { return f.indexOf(x) >= 0; });
    if (ok.length) detector = new BarcodeDetector({ formats: ok });
  }).catch(function () {});
}

$('btnCam').addEventListener('click', async function () {
  $('modalCam').style.display = 'block';
  await iniciarCamara();
});

$('btnCerrarCam').addEventListener('click', function () {
  $('modalCam').style.display = 'none';
  detenerCamara();
  cicloActivo = false;
  pausaLectura = false;
});

function decodificarZxing() {
  if (typeof ZXing === 'undefined') return null;
  try {
    if (!lectorZxing) {
      const h = new Map();
      h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.CODE_128
      ]);
      h.set(ZXing.DecodeHintType.TRY_HARDER, true);
      lectorZxing = new ZXing.MultiFormatReader();
      lectorZxing.setHints(h);
    }
    const fuente = new ZXing.HTMLCanvasElementLuminanceSource(canvasCam);
    return lectorZxing.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(fuente))).getText();
  } catch (e) { return null; }
}

async function procesarFrame() {
  ocupado = true;
  try {
    const video = $('video');
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) { ocupado = false; return; }
    const cw = Math.floor(vw * 0.9), ch = Math.floor(vh * 0.45);
    const sx = Math.floor((vw - cw) / 2), sy = Math.floor((vh - ch) / 2);
    const w = Math.min(cw, 960), h = Math.round(ch * w / cw);
    if (canvasCam.width !== w || canvasCam.height !== h) { canvasCam.width = w; canvasCam.height = h; }
    numFrame++;
    ctxCam.filter = (numFrame % 2 === 0) ? 'grayscale(1) contrast(1.5)' : 'none';
    ctxCam.drawImage(video, sx, sy, cw, ch, 0, 0, w, h);
    ctxCam.filter = 'none';

    let texto = null;
    if (detector) {
      try {
        const r = await detector.detect(canvasCam);
        if (r.length) texto = r[0].rawValue;
      } catch (e) { detector = null; }
    } else {
      texto = decodificarZxing();
    }
    if (texto && !pausaLectura) procesarCodigoEscaneado(texto);
  } catch (e) {}
  ocupado = false;
}

function ciclo(ts) {
  requestAnimationFrame(ciclo);
  if (ocupado || pausaLectura || ts - ultimoIntento < INTERVALO_MS) return;
  const video = $('video');
  if (!(video.readyState >= 2 && video.videoWidth)) return;
  ultimoIntento = ts;
  procesarFrame();
}

function procesarCodigoEscaneado(texto) {
  const code = String(texto).trim();
  const p = productos.find(function (x) { return String(x.codigo || '').trim() === code; });
  if (!p) {
    $('infoCam').textContent = 'Código no reconocido: ' + code;
    pausaLectura = true;
    setTimeout(function () {
      pausaLectura = false;
      $('infoCam').textContent = 'Apunta al código de barras';
    }, 1500);
    return;
  }

  const existente = carrito.find(function (it) {
    return it.id === p.id && it.unidad === 'Unidades';
  });

  if (existente) {
    existente.cantidad++;
  } else {
    carrito.push({
      id: p.id,
      nombre: p.nombre,
      cantidad: 1,
      unidad: 'Unidades',
      upp: 1,
      recordar: false
    });
  }

  if (navigator.vibrate) navigator.vibrate(80);
  $('marco').style.borderColor = '#40c4ff';
  $('infoCam').textContent = '✓ ' + p.nombre + ' agregado (' + (existente ? existente.cantidad : 1) + ')';
  pintarCarrito();
  guardarBorrador();

  pausaLectura = true;
  setTimeout(function () {
    pausaLectura = false;
    $('marco').style.borderColor = '#00e676';
    $('infoCam').textContent = 'Apunta al código de barras';
  }, 800);
}

async function iniciarCamara() {
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('Este navegador no permite usar la cámara.');
    $('modalCam').style.display = 'none';
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    const video = $('video');
    video.srcObject = stream;
    video.play().catch(function () {});
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) {
      track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
    }
    if (!cicloActivo) { cicloActivo = true; requestAnimationFrame(ciclo); }
  } catch (err) {
    alert('No se pudo abrir la cámara: ' + (err.name || 'Error'));
    $('modalCam').style.display = 'none';
  }
}

function detenerCamara() {
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
}
</script>
</body>
</html>
