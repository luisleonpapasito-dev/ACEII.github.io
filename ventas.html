<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ventas · ACEII</title>
<link rel="stylesheet" href="estilos.css">
<script src="comun.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<style>
  #total {
    font-size: 28px;
    color: var(--azul);
    font-weight: 700;
    margin: 12px 0;
    text-align: center;
    letter-spacing: -0.5px;
  }

  #resultados { max-height: 260px; overflow-y: auto; margin-top: 8px; }
  .resultado {
    padding: 12px;
    border-bottom: 1px solid #E8ECF4;
    cursor: pointer;
    transition: background 0.15s;
  }
  .resultado:last-child { border-bottom: none; }
  .resultado:hover { background: var(--superficie-2); }
  .resultado.agotado { opacity: 0.5; cursor: not-allowed; }
  .resultado b { font-size: 15px; color: var(--texto); }
  .resultado small { color: var(--texto-suave); display: block; font-size: 12px; margin-top: 2px; }

  .item-carrito {
    border-bottom: 1px solid #E8ECF4;
    padding: 10px 0;
  }
  .item-carrito:last-child { border-bottom: none; }
  .item-fila {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .item-fila button {
    padding: 6px 12px;
    margin: 0;
    font-size: 14px;
    border-radius: 8px;
  }
  .item-fila .flecha {
    padding: 6px 10px;
    background: var(--azul-suave);
    color: var(--azul);
    font-weight: 700;
    min-width: 36px;
  }
  .item-detalle { display: none; padding: 8px 0 0 12px; }
  .item-detalle.abierto { display: block; }
  .unidad {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 14px;
    color: var(--texto-suave);
  }
  .unidad button {
    padding: 4px 10px;
    margin: 0;
    font-size: 13px;
    background: var(--superficie-2);
    border-radius: 8px;
  }

  /* Panel de escaneo */
  #modalCam {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 100;
  }
  #modalCam.abierto { display: block; }
  #modalCam video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #modalCam .cerrar {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 10px 14px;
    background: var(--alerta);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    z-index: 2;
  }
  #modalCam .marco {
    position: absolute;
    left: 5%;
    top: 27.5%;
    width: 90%;
    height: 45%;
    border: 3px solid #00e676;
    border-radius: 10px;
    box-sizing: border-box;
    pointer-events: none;
  }
  #modalCam .marco.ok { border-color: #40c4ff; }
  #modalCam .info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
    background: rgba(0, 0, 0, 0.7);
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    color: #fff;
    font-size: 14px;
  }
  #modalCam #zoomBox {
    position: absolute;
    bottom: 80px;
    left: 20px;
    right: 20px;
    background: rgba(0, 0, 0, 0.6);
    padding: 8px;
    border-radius: 10px;
    display: none;
  }
  #modalCam #zoomBox label { color: #fff; font-size: 12px; display: block; margin-bottom: 4px; }
  #modalCam #btnReiniciarCam {
    position: absolute;
    bottom: 20px;
    left: 20px;
    padding: 10px 14px;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
  }

  /* Panel de escaneo (confirmación) */
  #panelEscaneo {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    z-index: 3;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
  }
  #panelEscaneo .caja-conf {
    max-width: 480px;
    margin: 40px auto 0;
    background: #fff;
    border-radius: var(--radio);
    padding: 20px;
  }
  #panelEscaneo .label-chico {
    color: var(--texto-suave);
    font-size: 12px;
    margin-bottom: 4px;
  }
  #panelEscaneo #codigoDetectado {
    color: var(--azul);
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    word-break: break-all;
  }
  #panelEscaneo #nombreDetectado {
    color: var(--texto);
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  /* Botones de pago */
  .pago-fila {
    display: flex;
    gap: 8px;
    margin: 10px 0;
  }
  .pago-fila button {
    flex: 1;
    margin: 0;
    background: var(--superficie-2);
    color: var(--texto-suave);
    border: 2px solid transparent;
    font-weight: 600;
  }
  .pago-fila button.on {
    background: var(--azul);
    color: #fff;
    border-color: var(--azul-claro);
  }

  /* Botón COBRAR */
  #btnCobrar {
    width: 100%;
    padding: 18px;
    font-size: 18px;
    font-weight: 700;
    border-radius: var(--radio-sm);
    letter-spacing: 0.5px;
  }

  /* Panel de cantidad */
  #panelCantidad {
    margin-top: 10px;
    padding: 14px;
    background: var(--superficie-2);
    border-radius: var(--radio-sm);
    display: none;
  }
  #panelCantidad .acciones {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  #panelCantidad .acciones button {
    padding: 10px 16px;
    font-size: 18px;
    font-weight: 700;
    background: #fff;
    color: var(--azul);
    border-radius: 10px;
  }
  #panelCantidad input {
    width: 80px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    background: #fff;
  }
</style>
</head>
<body>

<!-- Header -->
<header class="app-header">
  <div class="app-header-contenido">
    <img src="logo_ACEII.png" alt="ACEII" class="app-header-logo">
    <div class="app-header-texto">
      <div class="app-header-titulo">Ventas</div>
      <div class="app-header-sub">
        <a href="index.html" style="color:rgba(255,255,255,0.9); text-decoration:underline;">← Volver al menú</a>
      </div>
    </div>
  </div>
</header>

<div id="estado">Cargando...</div>

<!-- Búsqueda -->
<div class="caja">
  <label>Buscar producto</label>
  <input type="text" id="buscar" placeholder="Escribe 2 letras o más..." autocomplete="off">
  <button class="main" id="btnCam" style="width:100%; margin-top:8px;">📷 Escanear con cámara</button>
  <div id="resultados"></div>

  <div id="panelCantidad">
    <div id="panelNombre" style="font-weight:700; margin-bottom:10px; color:var(--texto);"></div>
    <div class="acciones">
      <button id="cantMenos">−</button>
      <input type="number" id="cantidadVenta" value="1" min="1" step="1">
      <button id="cantMas">+</button>
      <span id="cantStock" style="color:var(--texto-suave); font-size:12px;"></span>
    </div>
    <button class="main" id="btnAgregarCantidad" style="width:100%;">Agregar al carrito</button>
    <button id="btnCancelarCantidad" style="width:100%; margin-top:6px;">Cancelar</button>
  </div>
</div>

<!-- Carrito -->
<div class="caja">
  <h4 style="margin:0 0 12px; font-size:15px; font-weight:700;">Carrito</h4>
  <div id="carrito" style="color:var(--texto-suave); font-size:14px;">(vacío)</div>
  <div id="total">Total: $0</div>

  <label>Medio de pago</label>
  <div class="pago-fila">
    <button id="pagoEfectivo" class="on">💵 Efectivo</button>
    <button id="pagoTransfer">📱 Transferencia</button>
  </div>

  <label>Observaciones (opcional)</label>
  <input type="text" id="obs" maxlength="200">

  <button class="main" id="btnCobrar" disabled>COBRAR</button>
  <button id="btnVaciar" style="width:100%; margin-top:6px;">Vaciar carrito</button>
</div>

<!-- Modal de cámara -->
<div id="modalCam">
  <button class="cerrar" id="btnCerrarCam">Cerrar</button>
  <video id="video" playsinline muted autoplay></video>
  <div class="marco" id="marco"></div>
  <div class="info" id="infoCam">Apunta al código de barras</div>
  <div id="zoomBox">
    <label>Zoom</label>
    <input type="range" id="zoom" style="width:100%">
  </div>
  <button id="btnReiniciarCam">Reiniciar cámara</button>

  <!-- Panel de confirmación -->
  <div id="panelEscaneo">
    <div class="caja-conf">
      <div class="label-chico">Código detectado</div>
      <div id="codigoDetectado"></div>

      <div class="label-chico">Producto</div>
      <div id="nombreDetectado"></div>

      <label>Cantidad</label>
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
        <button id="escMenos" style="padding:10px 16px; font-size:20px;">−</button>
        <input type="number" id="escCantidad" value="1" min="1" step="1" style="width:90px; text-align:center; font-size:20px;">
        <button id="escMas" style="padding:10px 16px; font-size:20px;">+</button>
        <span id="escStock" style="color:var(--texto-suave); font-size:12px;"></span>
      </div>

      <button class="main" id="escAgregar" style="width:100%; padding:14px; font-size:16px; margin-top:8px;">Agregar al carrito</button>
      <button id="escCancelar" style="width:100%; padding:12px; margin-top:6px;">Cancelar</button>
    </div>
  </div>
</div>

<script>
exigirSesion();
pintarUsuarioTurno();

let productos = [];
let carrito = [];
let usuarioActual = null;
let medioPago = 'Efectivo';
let lectorZxing = null;
let stream = null;
let cicloActivo = false;
let ocupado = false;
let ultimoIntento = 0;
let numFrame = 0;
let detector = null;
let productoPendiente = null;
let pausaLectura = false;
let productoEscaneado = null;
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const INTERVALO_MS = 40;
const FORMATOS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'];

if ('BarcodeDetector' in window) {
  BarcodeDetector.getSupportedFormats().then(function (f) {
    const ok = FORMATOS.filter(function (x) { return f.indexOf(x) >= 0; });
    if (ok.length) detector = new BarcodeDetector({ formats: ok });
  }).catch(function () {});
}

(async function () {
  const ok = await exigirTurnoCajaAbierto();
  if (!ok) return;
  cargarProductos();
})();

async function cargarProductos() {
  mostrar('Cargando productos...', 'aviso');
  try {
    const r = await jsonp({ accion: 'productos_venta' }, 25000);
    if (r && r.error === 'Token inválido') { borrarToken(); location.href = 'index.html'; return; }
    if (!r || !r.ok) throw new Error(r && r.error ? r.error : 'respuesta vacía');
    productos = r.items;
    mostrar('Listo para vender');
  } catch (err) {
    mostrar('No se pudieron cargar los productos: ' + err.message, 'error');
  }
}

// ---------- Buscador ----------
function pintarResultados() {
  const q = norm($('buscar').value);
  const cont = $('resultados');
  cont.innerHTML = '';
  $('panelCantidad').style.display = 'none';
  if (q.length < 2) return;
  let n = 0;
  productos.forEach(function (p) {
    if (n >= 6) return;
    if (norm(p.id + ' ' + p.nombre).indexOf(q) < 0) return;
    n++;
    const d = document.createElement('div');
    d.className = 'resultado' + (p.stock <= 0 ? ' agotado' : '');
    const enCarrito = carrito.find(function (x) { return x.id === p.id; });
    const cantEnCarrito = enCarrito ? enCarrito.cantidad : 0;
    d.innerHTML = '<b>' + p.nombre + '</b><small>' + p.id + ' · $' + p.precio.toLocaleString('es-CO') +
      ' · Stock: ' + p.stock + (cantEnCarrito ? ' · En carrito: ' + cantEnCarrito : '') + '</small>';
    if (p.stock <= 0) {
      d.innerHTML += '<small style="color:var(--alerta); font-weight:600;">Sin stock</small>';
    } else {
      d.addEventListener('click', function () { mostrarPanelCantidad(p); });
    }
    cont.appendChild(d);
  });
  if (!n) {
    const d = document.createElement('div');
    d.className = 'resultado';
    d.style.color = 'var(--texto-suave)';
    d.textContent = 'Sin resultados. Prueba con otra palabra.';
    cont.appendChild(d);
  }
}

function mostrarPanelCantidad(p) {
  productoPendiente = p;
  const enCarrito = carrito.find(function (x) { return x.id === p.id; });
  const yaEnCarrito = enCarrito ? enCarrito.cantidad : 0;
  const maxPosible = p.stock - yaEnCarrito;
  $('panelNombre').textContent = p.nombre + ' — $' + p.precio.toLocaleString('es-CO');
  $('cantidadVenta').value = 1;
  $('cantidadVenta').max = maxPosible;
  $('cantStock').textContent = 'Disponible: ' + maxPosible + ' (stock ' + p.stock + ', en carrito ' + yaEnCarrito + ')';
  $('panelCantidad').style.display = 'block';
  $('cantidadVenta').focus();
}

$('cantMenos').addEventListener('click', function () {
  let v = Number($('cantidadVenta').value) || 1;
  if (v > 1) $('cantidadVenta').value = v - 1;
});
$('cantMas').addEventListener('click', function () {
  let v = Number($('cantidadVenta').value) || 1;
  const max = Number($('cantidadVenta').max) || 999;
  if (v < max) $('cantidadVenta').value = v + 1;
});
$('btnCancelarCantidad').addEventListener('click', function () {
  $('panelCantidad').style.display = 'none';
  productoPendiente = null;
});
$('btnAgregarCantidad').addEventListener('click', function () {
  if (!productoPendiente) return;
  const cant = Number($('cantidadVenta').value) || 0;
  if (cant <= 0) { mostrar('Cantidad inválida', 'error'); return; }
  const p = productoPendiente;
  const enCarrito = carrito.find(function (x) { return x.id === p.id; });
  const yaEnCarrito = enCarrito ? enCarrito.cantidad : 0;
  if (yaEnCarrito + cant > p.stock) {
    mostrar('Solo hay ' + (p.stock - yaEnCarrito) + ' disponibles', 'error');
    return;
  }
  if (enCarrito) {
    enCarrito.cantidad += cant;
  } else {
    carrito.push({ id: p.id, nombre: p.nombre, precio: p.precio, cantidad: cant, expandido: false, stock: p.stock });
  }
  if (navigator.vibrate) navigator.vibrate(60);
  pintarCarrito();
  $('panelCantidad').style.display = 'none';
  productoPendiente = null;
  $('buscar').value = '';
  $('resultados').innerHTML = '';
  $('buscar').focus();
});

$('buscar').addEventListener('input', pintarResultados);

// ---------- Carrito ----------
function pintarCarrito() {
  const c = $('carrito');
  if (!carrito.length) {
    c.textContent = '(vacío)';
    c.style.color = 'var(--texto-suave)';
    $('total').textContent = 'Total: $0';
    $('btnCobrar').disabled = true;
    return;
  }
  c.innerHTML = '';
  c.style.color = 'var(--texto)';
  let total = 0;
  carrito.forEach(function (it, i) {
    total += it.precio * it.cantidad;
    const cont = document.createElement('div');
    cont.className = 'item-carrito';

    const fila = document.createElement('div');
    fila.className = 'item-fila';

    const flecha = document.createElement('button');
    flecha.className = 'flecha';
    flecha.textContent = it.expandido ? '▼' : '▶';
    flecha.addEventListener('click', function () {
      it.expandido = !it.expandido;
      pintarCarrito();
    });

    const info = document.createElement('span');
    info.style.flex = '1';
    info.innerHTML = '<b>' + it.cantidad + '×</b> ' + it.nombre + '<br><small style="color:var(--texto-suave);">$' + (it.precio * it.cantidad).toLocaleString('es-CO') + '</small>';

    const quitar = document.createElement('button');
    quitar.textContent = '✕';
    quitar.style.background = '#FFE5E5';
    quitar.style.color = 'var(--alerta)';
    quitar.addEventListener('click', function () {
      carrito.splice(i, 1);
      pintarCarrito();
    });

    fila.appendChild(flecha);
    fila.appendChild(info);
    fila.appendChild(quitar);
    cont.appendChild(fila);

    if (it.expandido) {
      const det = document.createElement('div');
      det.className = 'item-detalle abierto';
      for (let u = 1; u <= it.cantidad; u++) {
        const fila2 = document.createElement('div');
        fila2.className = 'unidad';
        const etiqueta = document.createElement('span');
        etiqueta.textContent = 'Unidad ' + u;
        const menos = document.createElement('button');
        menos.textContent = '−';
        menos.addEventListener('click', function () {
          if (it.cantidad > 1) {
            it.cantidad--;
          } else {
            carrito.splice(i, 1);
          }
          pintarCarrito();
        });
        fila2.appendChild(etiqueta);
        fila2.appendChild(menos);
        det.appendChild(fila2);
      }
      cont.appendChild(det);
    }
    c.appendChild(cont);
  });
  $('total').textContent = 'Total: $' + total.toLocaleString('es-CO');
  $('btnCobrar').disabled = false;
}

$('btnVaciar').addEventListener('click', function () {
  if (carrito.length && !confirm('¿Vaciar el carrito?')) return;
  carrito = [];
  pintarCarrito();
});

$('pagoEfectivo').addEventListener('click', function () {
  medioPago = 'Efectivo';
  $('pagoEfectivo').className = 'on';
  $('pagoTransfer').className = '';
});
$('pagoTransfer').addEventListener('click', function () {
  medioPago = 'Transferencia';
  $('pagoTransfer').className = 'on';
  $('pagoEfectivo').className = '';
});

// ---------- Cobrar ----------
function nuevoIdVenta() {
  const d = new Date();
  const p = function (n) { return ('0' + n).slice(-2); };
  return 'VEN-' + String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
}

$('btnCobrar').addEventListener('click', async function () {
  if (!carrito.length) return;
  const u = getUsuarioTurno();
  if (!u) { mostrar('No hay turno iniciado', 'error'); return; }
  usuarioActual = { id: u.id };

  for (let i = 0; i < carrito.length; i++) {
    const it = carrito[i];
    const p = productos.find(function (x) { return x.id === it.id; });
    if (!p || p.stock < it.cantidad) {
      mostrar('Stock insuficiente de ' + it.nombre + ' (hay ' + (p ? p.stock : 0) + ')', 'error');
      return;
    }
  }

  const idVenta = nuevoIdVenta();
  $('btnCobrar').disabled = true;
  mostrar('Guardando venta...', 'aviso');
  try {
    const r = await post({
      accion: 'venta',
      id_venta: idVenta,
      id_usuario: usuarioActual.id,
      id_turno: (getTurnoActual() ? getTurnoActual().id : ''),
      medio_pago: medioPago,
      observaciones: $('obs').value.trim(),
      items: carrito.map(function (it) { return { id_producto: it.id, cantidad: it.cantidad }; })
    });
    if (r.ok) {
      mostrar('Venta guardada ✓ ' + r.lineas + ' línea(s) · ' + medioPago, 'ok');
      if (navigator.vibrate) navigator.vibrate(200);
      carrito.forEach(function (it) {
        const p = productos.find(function (x) { return x.id === it.id; });
        if (p) p.stock -= it.cantidad;
      });
      carrito = [];
      $('obs').value = '';
      pintarCarrito();
    } else if (r.error === 'Token inválido') {
      borrarToken(); location.href = 'index.html';
    } else {
      mostrar(r.error || 'Error desconocido', 'error');
    }
  } catch (err) {
    mostrar('Sin conexión. Revisa internet.', 'error');
  } finally {
    $('btnCobrar').disabled = false;
  }
});

// ---------- Cámara ----------
$('btnCam').addEventListener('click', async function () {
  $('modalCam').classList.add('abierto');
  await iniciarCamara();
});
$('btnCerrarCam').addEventListener('click', function () {
  $('modalCam').classList.remove('abierto');
  detenerCamara();
  cicloActivo = false;
  pausaLectura = false;
  productoEscaneado = null;
  $('panelEscaneo').style.display = 'none';
});
$('btnReiniciarCam').addEventListener('click', async function () {
  detenerCamara();
  cicloActivo = false;
  pausaLectura = false;
  productoEscaneado = null;
  $('panelEscaneo').style.display = 'none';
  await iniciarCamara();
});

function conTiempo(promesa, ms) {
  return new Promise(function (resolve, reject) {
    let terminado = false;
    const t = setTimeout(function () {
      if (terminado) return;
      terminado = true;
      reject(new Error('La cámara no respondió'));
    }, ms);
    promesa.then(function (v) {
      if (terminado) { v.getTracks().forEach(function (tr) { tr.stop(); }); return; }
      terminado = true;
      clearTimeout(t);
      resolve(v);
    }, function (e) {
      if (terminado) return;
      terminado = true;
      clearTimeout(t);
      reject(e);
    });
  });
}

function decodificarZxing() {
  if (typeof ZXing === 'undefined') return null;
  try {
    if (!lectorZxing) {
      const h = new Map();
      h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.CODE_128
      ]);
      h.set(ZXing.DecodeHintType.TRY_HARDER, true);
      lectorZxing = new ZXing.MultiFormatReader();
      lectorZxing.setHints(h);
    }
    const fuente = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
    return lectorZxing.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(fuente))).getText();
  } catch (e) { return null; }
}

async function procesarFrame() {
  ocupado = true;
  try {
    const video = $('video');
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) { ocupado = false; return; }
    const cw = Math.floor(vw * 0.9), ch = Math.floor(vh * 0.45);
    const sx = Math.floor((vw - cw) / 2), sy = Math.floor((vh - ch) / 2);
    const w = Math.min(cw, 960), h = Math.round(ch * w / cw);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    numFrame++;
    ctx.filter = (numFrame % 2 === 0) ? 'grayscale(1) contrast(1.5)' : 'none';
    ctx.drawImage(video, sx, sy, cw, ch, 0, 0, w, h);
    ctx.filter = 'none';

    let texto = null;
    if (detector) {
      try {
        const r = await detector.detect(canvas);
        if (r.length) texto = r[0].rawValue;
      } catch (e) { detector = null; }
    } else {
      texto = decodificarZxing();
    }

    if (texto && !pausaLectura) {
      const code = String(texto).trim();
      const p = productos.find(function (x) { return x.codigo === code; });
      if (p) {
        pausaLectura = true;
        productoEscaneado = p;
        if (navigator.vibrate) navigator.vibrate(80);
        $('codigoDetectado').textContent = code;
        $('nombreDetectado').textContent = p.nombre;
        const enCarrito = carrito.find(function (x) { return x.id === p.id; });
        const yaEnCarrito = enCarrito ? enCarrito.cantidad : 0;
        const maxPosible = p.stock - yaEnCarrito;
        $('escCantidad').value = 1;
        $('escCantidad').max = maxPosible;
        $('escStock').textContent = 'Disponible: ' + maxPosible;
        $('panelEscaneo').style.display = 'block';
        $('marco').className = 'marco ok';
      } else {
        $('infoCam').textContent = 'Código no reconocido: ' + code;
        pausaLectura = true;
        setTimeout(function () {
          pausaLectura = false;
          $('infoCam').textContent = 'Apunta al código de barras';
        }, 1500);
      }
    }
  } catch (e) {}
  ocupado = false;
}

function ciclo(ts) {
  requestAnimationFrame(ciclo);
  if (ocupado || ts - ultimoIntento < INTERVALO_MS) return;
  const video = $('video');
  if (!(video.readyState >= 2 && video.videoWidth)) return;
  ultimoIntento = ts;
  procesarFrame();
}

async function iniciarCamara() {
  if (stream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    mostrar('Este navegador no permite usar la cámara. Abre el link https en Chrome.', 'error');
    return;
  }
  const opciones = [
    { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
    { video: { facingMode: { ideal: 'environment' } }, audio: false },
    { video: true, audio: false }
  ];
  let ultimoError = null;
  for (let i = 0; i < opciones.length; i++) {
    try {
      stream = await conTiempo(navigator.mediaDevices.getUserMedia(opciones[i]), 10000);
      break;
    } catch (err) {
      ultimoError = err;
      if (err && err.name === 'NotAllowedError') break;
    }
  }
  if (!stream) {
    mostrar('No se pudo abrir la cámara: ' + (ultimoError && ultimoError.name ? ultimoError.name : 'Error'), 'error');
    $('modalCam').classList.remove('abierto');
    return;
  }
  const video = $('video');
  video.srcObject = stream;
  video.play().catch(function () {});
  const track = stream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) {
    track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
  }
  if (caps.zoom) {
    $('zoom').min = caps.zoom.min;
    $('zoom').max = caps.zoom.max;
    $('zoom').step = caps.zoom.step || 0.1;
    $('zoom').value = caps.zoom.min;
    $('zoomBox').style.display = 'block';
  } else {
    $('zoomBox').style.display = 'none';
  }
  if (!cicloActivo) { cicloActivo = true; requestAnimationFrame(ciclo); }
  if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {});
}

function detenerCamara() {
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
}

$('zoom').addEventListener('input', function () {
  if (stream) {
    const track = stream.getVideoTracks()[0];
    if (track) track.applyConstraints({ advanced: [{ zoom: Number($('zoom').value) }] }).catch(function () {});
  }
});

// ---------- Panel de escaneo ----------
$('escMenos').addEventListener('click', function () {
  let v = Number($('escCantidad').value) || 1;
  if (v > 1) $('escCantidad').value = v - 1;
});
$('escMas').addEventListener('click', function () {
  let v = Number($('escCantidad').value) || 1;
  const max = Number($('escCantidad').max) || 999;
  if (v < max) $('escCantidad').value = v + 1;
});
$('escCancelar').addEventListener('click', function () {
  $('panelEscaneo').style.display = 'none';
  $('marco').className = 'marco';
  productoEscaneado = null;
  setTimeout(function () { pausaLectura = false; }, 800);
});
$('escAgregar').addEventListener('click', function () {
  if (!productoEscaneado) return;
  const cant = Number($('escCantidad').value) || 0;
  if (cant <= 0) { mostrar('Cantidad inválida', 'error'); return; }
  const p = productoEscaneado;
  const enCarrito = carrito.find(function (x) { return x.id === p.id; });
  const yaEnCarrito = enCarrito ? enCarrito.cantidad : 0;
  if (yaEnCarrito + cant > p.stock) {
    mostrar('Solo hay ' + (p.stock - yaEnCarrito) + ' disponibles', 'error');
    return;
  }
  if (enCarrito) {
    enCarrito.cantidad += cant;
  } else {
    carrito.push({ id: p.id, nombre: p.nombre, precio: p.precio, cantidad: cant, expandido: false, stock: p.stock });
  }
  if (navigator.vibrate) navigator.vibrate(120);
  pintarCarrito();
  $('panelEscaneo').style.display = 'none';
  $('marco').className = 'marco';
  productoEscaneado = null;
  setTimeout(function () { pausaLectura = false; }, 800);
});
</script>
