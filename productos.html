<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos · ACEII</title>
<link rel="stylesheet" href="estilos.css">
<script src="comun.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<style>
  #listaProductos {
    max-height: 500px;
    overflow-y: auto;
    margin-top: 8px;
  }
  .prod-item {
    padding: 10px;
    border-bottom: 1px solid #E8ECF4;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .prod-item:hover { background: var(--superficie-2); }
  .prod-item:last-child { border-bottom: none; }
  .prod-item.inactivo { opacity: 0.55; }

  .prod-thumb {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    flex-shrink: 0;
    overflow: hidden;
    background: var(--superficie-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 22px;
    color: var(--azul);
  }
  .prod-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .prod-info { flex: 1; min-width: 0; }
  .prod-info .fila {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .prod-info .nombre {
    font-size: 15px;
    font-weight: 600;
    color: var(--texto);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .prod-info .meta {
    font-size: 12px;
    color: var(--texto-suave);
    margin-top: 2px;
  }
  .prod-info .precio {
    color: var(--azul);
    font-weight: 700;
    font-size: 14px;
  }
  .prod-info .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 4px;
  }
  .badge-activo { background: #E0F7EC; color: var(--exito); }
  .badge-inactivo { background: #FFE5E5; color: var(--alerta); }
  .badge-modo { background: var(--azul-suave); color: var(--azul); }

  .form-grupo {
    margin-top: 12px;
  }
  .form-grupo label {
    font-weight: 600;
    color: var(--texto);
    font-size: 13px;
    margin-top: 10px;
  }
  .form-grupo input,
  .form-grupo select,
  .form-grupo textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    margin-top: 4px;
    box-sizing: border-box;
  }
  .aviso-id {
    background: var(--azul-suave);
    color: var(--azul);
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    margin: 10px 0;
    text-align: center;
    font-weight: 700;
  }

  .codigo-fila {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 4px;
  }
  .codigo-fila input {
    flex: 1;
    margin: 0;
  }
  .codigo-fila button {
    margin: 0;
    padding: 10px 14px;
    white-space: nowrap;
    background: var(--azul);
    color: #fff;
    font-weight: 600;
    border-radius: 8px;
  }

  /* Bloque de imagen */
  .imagen-bloque {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-top: 6px;
    background: var(--superficie-2);
    padding: 10px;
    border-radius: 10px;
  }
  .imagen-preview {
    width: 80px;
    height: 80px;
    border-radius: 10px;
    flex-shrink: 0;
    overflow: hidden;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--texto-claro);
    font-size: 12px;
    text-align: center;
    border: 2px solid #E8ECF4;
  }
  .imagen-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .imagen-acciones {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .imagen-acciones button {
    margin: 0;
    padding: 8px 12px;
    font-size: 13px;
    border-radius: 8px;
  }

  /* Modal de cámara */
  #modalCam {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 100;
  }
  #modalCam.abierto { display: block; }
  #modalCam video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #modalCam .cerrar {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 10px 14px;
    background: var(--alerta);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    z-index: 2;
  }
  #modalCam .marco {
    position: absolute;
    left: 5%;
    top: 27.5%;
    width: 90%;
    height: 45%;
    border: 3px solid #00e676;
    border-radius: 10px;
    box-sizing: border-box;
    pointer-events: none;
  }
  #modalCam .marco.ok { border-color: #40c4ff; }
  #modalCam .info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
    background: rgba(0, 0, 0, 0.7);
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    color: #fff;
    font-size: 14px;
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-contenido">
    <img src="logo_ACEII.png" alt="ACEII" class="app-header-logo">
    <div class="app-header-texto">
      <div class="app-header-titulo">Productos</div>
      <div class="app-header-sub">
        <a href="index.html" style="color:rgba(255,255,255,0.9); text-decoration:underline;">← Volver al menú</a>
      </div>
    </div>
  </div>
</header>

<div id="estado">Cargando...</div>

<div class="caja">
  <div style="display:flex; gap:8px; margin-bottom:8px;">
    <button class="main" id="btnNuevo" style="flex:1;">➕ Nuevo producto</button>
    <button id="btnRecargar" style="flex:0 0 auto;">🔄</button>
  </div>
  <input type="text" id="buscar" placeholder="Buscar por nombre, ID o código..." autocomplete="off">
  <label><input type="checkbox" id="soloActivos" checked> Mostrar solo activos</label>
  <div id="listaProductos"></div>
</div>

<div class="caja" id="formPanel" style="display:none;">
  <div id="formTitulo" style="font-weight:700; font-size:16px; margin-bottom:8px;">Nuevo producto</div>

  <div class="aviso-id" id="avisoId" style="display:none;"></div>

  <div class="form-grupo">
    <label>Imagen del producto</label>
    <div class="imagen-bloque">
      <div class="imagen-preview" id="imagenPreview">Sin imagen</div>
      <div class="imagen-acciones">
        <button class="main" id="btnSubirFoto" type="button">📷 Subir foto</button>
        <input type="file" id="inputFoto" accept="image/*" capture="environment" style="display:none;">
        <button id="btnPegarUrl" type="button">🔗 Pegar URL</button>
        <button id="btnQuitarFoto" type="button" style="display:none;">🗑️ Quitar imagen</button>
      </div>
    </div>
    <input type="hidden" id="fImagenUrl">

    <label>Categoría *</label>
    <select id="fCategoria"></select>

    <label>Nombre del producto *</label>
    <input type="text" id="fNombre" maxlength="100" placeholder="Ej: Coca-Cola 1 litro">

    <label>Modo de registro *</label>
    <select id="fModo"></select>

    <label>Proveedor</label>
    <select id="fProveedor"></select>

    <label>Precio de venta *</label>
    <input type="number" id="fPrecio" min="0" step="50" inputmode="numeric" placeholder="Ej: 4000">

    <label>Costo unitario (opcional)</label>
    <input type="number" id="fCosto" min="0" step="50" inputmode="numeric" placeholder="Ej: 1850">

    <label>Unidades por paquete (opcional)</label>
    <input type="number" id="fUpp" min="0" step="1" inputmode="numeric" placeholder="Ej: 24">

    <label>Código de barras (opcional)</label>
    <div class="codigo-fila">
      <input type="text" id="fCodigo" maxlength="30" placeholder="Escanéalo o escríbelo">
      <button id="btnEscanearCodigo" type="button">📷</button>
    </div>

    <label>Nota (opcional)</label>
    <textarea id="fNota" maxlength="200" rows="2" placeholder="Observaciones internas"></textarea>

    <div style="display:flex; gap:8px; margin-top:14px;">
      <button class="main" id="btnGuardar" style="flex:1;">Guardar</button>
      <button id="btnCancelarForm" style="flex:0 0 auto;">Cancelar</button>
    </div>
    <div id="btnEliminarBox" style="display:none; margin-top:8px;">
      <button id="btnEliminar" style="width:100%; background:#FFE5E5; color:var(--alerta); font-weight:700;">🗑️ Eliminar producto</button>
    </div>
  </div>
</div>

<div id="modalCam">
  <button class="cerrar" id="btnCerrarCam">Cerrar</button>
  <video id="video" playsinline muted autoplay></video>
  <div class="marco" id="marco"></div>
  <div class="info" id="infoCam">Apunta al código de barras</div>
</div>

<script>
exigirSesion();
pintarUsuarioTurno();

let productos = [];
let categorias = [];
let proveedores = [];
let modos = [];
let modoForm = 'crear';
let productoEditando = null;
let imagenUrlActual = '';

(async function () {
  await cargarTodo();
})();

async function cargarTodo() {
  mostrar('Cargando datos...', 'aviso');
  try {
    const [rProd, rCat, rProv, rModos] = await Promise.all([
      jsonp({ accion: 'productos_admin' }, 25000),
      jsonp({ accion: 'categorias' }, 15000),
      jsonp({ accion: 'proveedores' }, 15000),
      jsonp({ accion: 'modos_registro' }, 15000)
    ]);
    if (rProd && rProd.error === 'Token inválido') { borrarToken(); location.href = 'index.html'; return; }
    if (!rProd || !rProd.ok) throw new Error('Error al cargar productos');
    productos = rProd.items;
    categorias = (rCat && rCat.ok) ? rCat.items : [];
    proveedores = (rProv && rProv.ok) ? rProv.items : [];
    modos = (rModos && rModos.ok) ? rModos.items : [];

    llenarSelectsForm();
    pintarLista();
    mostrar(productos.length + ' productos cargados');
  } catch (err) {
    mostrar('Error al cargar: ' + err.message, 'error');
  }
}

function llenarSelectsForm() {
  const selCat = $('fCategoria');
  selCat.innerHTML = '<option value="">Elige la categoría...</option>';
  categorias.forEach(function (c) {
    selCat.appendChild(new Option(c, c));
  });

  const selModo = $('fModo');
  selModo.innerHTML = '<option value="">Elige el modo...</option>';
  modos.forEach(function (m) {
    selModo.appendChild(new Option(m, m));
  });

  const selProv = $('fProveedor');
  selProv.innerHTML = '<option value="">(Sin proveedor)</option>';
  proveedores.forEach(function (p) {
    selProv.appendChild(new Option(p, p));
  });
}

// Placeholder con la inicial
function colorPorCategoria(cat) {
  const colores = {
    'Bebidas': '#E3ECFF',
    'Lácteos y avena': '#FFF4DC',
    'Dulces y confitería': '#FCE4EC',
    'Galletas y ponqués': '#EFE7FB',
    'Pasabocas salados': '#E0F7EC',
    'Preparados': '#FFE5E5',
    'Comida instantánea': '#D6F5FA',
    'Combos': '#EFE7FB',
    'Papelería e impresión': '#F0F4FF',
    'Higiene y salud': '#E0F7EC'
  };
  return colores[cat] || '#F0F4FF';
}

function pintarLista() {
  const q = norm($('buscar').value);
  const soloActivos = $('soloActivos').checked;
  const cont = $('listaProductos');
  cont.innerHTML = '';

  let items = productos.slice();
  if (soloActivos) items = items.filter(function (p) { return p.activo !== 'No'; });
  if (q) {
    items = items.filter(function (p) {
      return norm(p.id + ' ' + p.nombre + ' ' + p.codigo + ' ' + p.categoria).indexOf(q) >= 0;
    });
  }

  items.sort(function (a, b) { return a.nombre.localeCompare(b.nombre); });

  if (!items.length) {
    cont.innerHTML = '<div style="padding:20px; text-align:center; color:var(--texto-suave);">No se encontraron productos.</div>';
    return;
  }

  items.forEach(function (p) {
    const d = document.createElement('div');
    d.className = 'prod-item' + (p.activo === 'No' ? ' inactivo' : '');

    // Miniatura
    let thumbHTML = '';
    if (p.imagen_url) {
      thumbHTML = '<img src="' + p.imagen_url + '" alt="" loading="lazy">';
    } else {
      const inicial = p.nombre ? p.nombre.charAt(0).toUpperCase() : '?';
      const color = colorPorCategoria(p.categoria);
      thumbHTML = '<span style="color:var(--azul);">' + inicial + '</span>';
      d.style.setProperty('--thumb-bg', color);
    }

    d.innerHTML =
      '<div class="prod-thumb" style="background:' + (p.imagen_url ? '#fff' : colorPorCategoria(p.categoria)) + ';">' + thumbHTML + '</div>' +
      '<div class="prod-info">' +
        '<div class="fila">' +
          '<span class="nombre">' + p.nombre + '</span>' +
          '<span class="precio">$' + p.precio.toLocaleString('es-CO') + '</span>' +
        '</div>' +
        '<div class="meta">' +
          p.id + ' · ' + p.categoria +
          ' <span class="badge badge-modo">' + p.modo + '</span>' +
          ' <span class="badge ' + (p.activo === 'No' ? 'badge-inactivo' : 'badge-activo') + '">' +
            (p.activo === 'No' ? 'INACTIVO' : 'Activo') +
          '</span>' +
        '</div>' +
        '<div class="meta">' + (p.proveedor ? p.proveedor : '(sin proveedor)') + (p.codigo ? ' · ' + p.codigo : '') + '</div>' +
      '</div>';

    d.addEventListener('click', function () { abrirEditar(p); });
    cont.appendChild(d);
  });
}

$('buscar').addEventListener('input', pintarLista);
$('soloActivos').addEventListener('change', pintarLista);
$('btnRecargar').addEventListener('click', cargarTodo);

// ---------- Formulario: Nuevo producto ----------
$('btnNuevo').addEventListener('click', async function () {
  modoForm = 'crear';
  productoEditando = null;
  imagenUrlActual = '';
  $('formTitulo').textContent = 'Nuevo producto';
  $('fCategoria').value = '';
  $('fNombre').value = '';
  $('fModo').value = '';
  $('fProveedor').value = '';
  $('fPrecio').value = '';
  $('fCosto').value = '';
  $('fUpp').value = '';
  $('fCodigo').value = '';
  $('fNota').value = '';
  $('avisoId').style.display = 'none';
  $('btnEliminarBox').style.display = 'none';
  pintarImagen('');
  $('formPanel').style.display = 'block';
  $('formPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  mostrar('Completa los datos del nuevo producto');
});

// ---------- Formulario: Editar ----------
function abrirEditar(p) {
  modoForm = 'editar';
  productoEditando = p;
  imagenUrlActual = p.imagen_url || '';
  $('formTitulo').textContent = 'Editar: ' + p.nombre;
  $('avisoId').style.display = 'block';
  $('avisoId').textContent = 'ID: ' + p.id + ' (no editable)';
  $('fCategoria').value = p.categoria;
  $('fNombre').value = p.nombre;
  $('fModo').value = p.modo;
  $('fProveedor').value = p.proveedor || '';
  $('fPrecio').value = p.precio;
  $('fCosto').value = p.costo;
  $('fUpp').value = p.upp > 0 ? p.upp : '';
  $('fCodigo').value = p.codigo || '';
  $('fNota').value = p.nota || '';
  $('btnEliminarBox').style.display = 'block';
  pintarImagen(imagenUrlActual);
  $('formPanel').style.display = 'block';
  $('formPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  mostrar('Edita los datos y guarda');
}

// ---------- Pintar la imagen del formulario ----------
function pintarImagen(url) {
  imagenUrlActual = url || '';
  $('fImagenUrl').value = imagenUrlActual;
  const prev = $('imagenPreview');
  if (imagenUrlActual) {
    prev.innerHTML = '<img src="' + imagenUrlActual + '">';
    $('btnQuitarFoto').style.display = 'block';
  } else {
    prev.textContent = 'Sin imagen';
    $('btnQuitarFoto').style.display = 'none';
  }
}

// ---------- Subir foto ----------
$('btnSubirFoto').addEventListener('click', function () {
  $('inputFoto').click();
});

$('inputFoto').addEventListener('change', function (e) {
  const archivo = e.target.files[0];
  if (!archivo) return;
  mostrar('Subiendo imagen...', 'aviso');
  comprimirImagen(archivo, 800, 0.85, async function (base64, tipoMime) {
    const u = getUsuarioTurno();
    const idProd = (modoForm === 'editar' && productoEditando) ? productoEditando.id : 'TEMP';
    try {
      const r = await post({
        accion: 'subir_imagen_producto',
        id_usuario: u.id,
        id_producto: idProd,
        base64: base64,
        tipoMime: tipoMime
      });
      if (r && r.ok && r.url) {
        pintarImagen(r.url);
        mostrar('Imagen subida ✓', 'ok');
      } else {
        mostrar('Error al subir: ' + (r && r.error ? r.error : 'desconocido'), 'error');
      }
    } catch (err) {
      mostrar('Error: ' + err.message, 'error');
    }
    $('inputFoto').value = '';
  });
});

// ---------- Pegar URL ----------
$('btnPegarUrl').addEventListener('click', function () {
  const url = prompt('Pega la URL de la imagen:');
  if (url && url.trim()) {
    pintarImagen(url.trim());
    mostrar('URL cargada', 'ok');
  }
});

// ---------- Quitar imagen ----------
$('btnQuitarFoto').addEventListener('click', function () {
  if (!confirm('¿Quitar la imagen del producto?')) return;
  pintarImagen('');
  mostrar('Imagen quitada', 'aviso');
});

// ---------- Comprimir imagen ----------
function comprimirImagen(archivo, maxAncho, calidad, callback) {
  const reader = new FileReader();
  reader.onload = function (ev) {
    const img = new Image();
    img.onload = function () {
      let w = img.width;
      let h = img.height;
      if (w > maxAncho) {
        h = Math.round(h * maxAncho / w);
        w = maxAncho;
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', calidad);
      const base64 = dataUrl.split(',')[1];
      callback(base64, 'image/jpeg');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(archivo);
}

// ---------- Auto-generar ID al elegir categoría ----------
$('fCategoria').addEventListener('change', async function () {
  if (modoForm !== 'crear') return;
  const cat = $('fCategoria').value;
  if (!cat) { $('avisoId').style.display = 'none'; return; }
  try {
    const r = await jsonp({ accion: 'proximo_id', categoria: cat }, 15000);
    if (r && r.ok) {
      $('avisoId').style.display = 'block';
      $('avisoId').textContent = 'ID que se asignará: ' + r.id;
    }
  } catch (e) {}
});

// ---------- Guardar ----------
$('btnGuardar').addEventListener('click', async function () {
  const cat = $('fCategoria').value;
  const nombre = $('fNombre').value.trim();
  const modoReg = $('fModo').value;
  const proveedor = $('fProveedor').value.trim();
  const precio = Number($('fPrecio').value);
  const costo = Number($('fCosto').value || 0);
  const upp = Number($('fUpp').value || 0);
  const codigo = $('fCodigo').value.trim();
  const nota = $('fNota').value.trim();

  if (!cat) { mostrar('Elige una categoría', 'error'); return; }
  if (!nombre) { mostrar('Escribe el nombre del producto', 'error'); return; }
  if (!modoReg) { mostrar('Elige el modo de registro', 'error'); return; }
  if (isNaN(precio) || precio < 0) { mostrar('Precio inválido', 'error'); return; }

  const u = getUsuarioTurno();
  if (!u) { mostrar('No hay turno de usuario', 'error'); return; }

  $('btnGuardar').disabled = true;
  mostrar('Guardando...', 'aviso');

  try {
    let r;
    if (modoForm === 'crear') {
      const rid = await jsonp({ accion: 'proximo_id', categoria: cat }, 15000);
      if (!rid || !rid.ok) throw new Error('No se pudo generar el ID');
      r = await post({
        accion: 'crear_producto',
        id_usuario: u.id,
        id_producto: rid.id,
        nombre: nombre,
        categoria: cat,
        modo: modoReg,
        proveedor: proveedor,
        precio: precio,
        costo: costo,
        upp: upp,
        codigo: codigo,
        nota: nota,
        imagen_url: imagenUrlActual
      });
    } else {
      r = await post({
        accion: 'editar_producto',
        id_usuario: u.id,
        id_producto: productoEditando.id,
        nombre: nombre,
        categoria: cat,
        modo: modoReg,
        proveedor: proveedor,
        precio: precio,
        costo: costo,
        upp: upp,
        codigo: codigo,
        nota: nota,
        imagen_url: imagenUrlActual
      });
    }

    if (r.ok) {
      mostrar(modoForm === 'crear' ? 'Producto creado ✓ ' + r.id_producto : 'Producto actualizado ✓', 'ok');
      if (navigator.vibrate) navigator.vibrate(200);
      $('formPanel').style.display = 'none';
      await cargarTodo();
    } else if (r.error === 'Token inválido') {
      borrarToken(); location.href = 'index.html';
    } else {
      mostrar(r.error || 'Error desconocido', 'error');
    }
  } catch (err) {
    mostrar('Error: ' + err.message, 'error');
  } finally {
    $('btnGuardar').disabled = false;
  }
});

$('btnCancelarForm').addEventListener('click', function () {
  $('formPanel').style.display = 'none';
  productoEditando = null;
  imagenUrlActual = '';
  mostrar('Cancelado', 'aviso');
});

// ---------- Eliminar ----------
$('btnEliminar').addEventListener('click', async function () {
  if (!productoEditando) return;
  if (!confirm('¿Eliminar el producto "' + productoEditando.nombre + '"?\n\nSolo se puede eliminar si nunca ha tenido movimientos. Si ya tiene ventas, recepciones o ajustes, mejor desactívalo.')) return;

  const u = getUsuarioTurno();
  $('btnEliminar').disabled = true;
  mostrar('Eliminando...', 'aviso');
  try {
    const r = await post({
      accion: 'eliminar_producto',
      id_usuario: u.id,
      id_producto: productoEditando.id
    });
    if (r.ok) {
      mostrar('Producto eliminado ✓', 'ok');
      $('formPanel').style.display = 'none';
      productoEditando = null;
      await cargarTodo();
    } else {
      mostrar(r.error || 'Error desconocido', 'error');
    }
  } catch (err) {
    mostrar('Error: ' + err.message, 'error');
  } finally {
    $('btnEliminar').disabled = false;
  }
});

// ---------- Desactivar / Reactivar ----------
document.addEventListener('dblclick', async function (e) {
  if (!e.target.classList.contains('badge-activo') && !e.target.classList.contains('badge-inactivo')) return;
  const itemPadre = e.target.closest('.prod-item');
  if (!itemPadre) return;
  const nombre = itemPadre.querySelector('.nombre').textContent;
  const p = productos.find(function (x) { return x.nombre === nombre; });
  if (!p) return;
  const nuevoEstado = (p.activo === 'No') ? 'Sí' : 'No';
  if (!confirm('¿' + (nuevoEstado === 'No' ? 'Desactivar' : 'Reactivar') + ' "' + p.nombre + '"?')) return;
  const u = getUsuarioTurno();
  try {
    const r = await post({
      accion: 'activar_producto',
      id_usuario: u.id,
      id_producto: p.id,
      activo: nuevoEstado
    });
    if (r.ok) {
      mostrar('Producto ' + (nuevoEstado === 'No' ? 'desactivado' : 'reactivado') + ' ✓', 'ok');
      await cargarTodo();
    }
  } catch (err) {
    mostrar('Error: ' + err.message, 'error');
  }
});

// =====================================================================
// ESCÁNER DE CÓDIGO DE BARRAS
// =====================================================================
let lectorZxing = null;
let stream = null;
let cicloActivo = false;
let ocupado = false;
let ultimoIntento = 0;
let numFrame = 0;
let detector = null;
let pausaLectura = false;
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const INTERVALO_MS = 40;
const FORMATOS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'];

if ('BarcodeDetector' in window) {
  BarcodeDetector.getSupportedFormats().then(function (f) {
    const ok = FORMATOS.filter(function (x) { return f.indexOf(x) >= 0; });
    if (ok.length) detector = new BarcodeDetector({ formats: ok });
  }).catch(function () {});
}

$('btnEscanearCodigo').addEventListener('click', async function () {
  $('modalCam').classList.add('abierto');
  await iniciarCamara();
});

$('btnCerrarCam').addEventListener('click', function () {
  $('modalCam').classList.remove('abierto');
  detenerCamara();
  cicloActivo = false;
  pausaLectura = false;
});

function decodificarZxing() {
  if (typeof ZXing === 'undefined') return null;
  try {
    if (!lectorZxing) {
      const h = new Map();
      h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.CODE_128
      ]);
      h.set(ZXing.DecodeHintType.TRY_HARDER, true);
      lectorZxing = new ZXing.MultiFormatReader();
      lectorZxing.setHints(h);
    }
    const fuente = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
    return lectorZxing.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(fuente))).getText();
  } catch (e) { return null; }
}

async function procesarFrame() {
  ocupado = true;
  try {
    const video = $('video');
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) { ocupado = false; return; }
    const cw = Math.floor(vw * 0.9), ch = Math.floor(vh * 0.45);
    const sx = Math.floor((vw - cw) / 2), sy = Math.floor((vh - ch) / 2);
    const w = Math.min(cw, 960), h = Math.round(ch * w / cw);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    numFrame++;
    ctx.filter = (numFrame % 2 === 0) ? 'grayscale(1) contrast(1.5)' : 'none';
    ctx.drawImage(video, sx, sy, cw, ch, 0, 0, w, h);
    ctx.filter = 'none';

    let texto = null;
    if (detector) {
      try {
        const r = await detector.detect(canvas);
        if (r.length) texto = r[0].rawValue;
      } catch (e) { detector = null; }
    } else {
      texto = decodificarZxing();
    }

    if (texto && !pausaLectura) {
      const code = String(texto).trim();
      if (navigator.vibrate) navigator.vibrate(80);
      $('fCodigo').value = code;
      $('infoCam').textContent = '✓ Código detectado: ' + code;
      $('marco').className = 'marco ok';

      pausaLectura = true;
      setTimeout(function () {
        $('modalCam').classList.remove('abierto');
        detenerCamara();
        cicloActivo = false;
        pausaLectura = false;
        $('marco').className = 'marco';
        $('infoCam').textContent = 'Apunta al código de barras';
        mostrar('Código capturado ✓', 'ok');
      }, 700);
    }
  } catch (e) {}
  ocupado = false;
}

function ciclo(ts) {
  requestAnimationFrame(ciclo);
  if (ocupado || pausaLectura || ts - ultimoIntento < INTERVALO_MS) return;
  const video = $('video');
  if (!(video.readyState >= 2 && video.videoWidth)) return;
  ultimoIntento = ts;
  procesarFrame();
}

async function iniciarCamara() {
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('Este navegador no permite usar la cámara.');
    $('modalCam').classList.remove('abierto');
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    const video = $('video');
    video.srcObject = stream;
    video.play().catch(function () {});
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) {
      track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
    }
    if (!cicloActivo) { cicloActivo = true; requestAnimationFrame(ciclo); }
  } catch (err) {
    alert('No se pudo abrir la cámara: ' + (err.name || 'Error'));
    $('modalCam').classList.remove('abierto');
  }
}

function detenerCamara() {
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
}
</script>
