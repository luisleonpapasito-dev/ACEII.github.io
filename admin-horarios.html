<!DOCTYPE html>
<html lang="es" class="tema-claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horarios y turnos · ACEII</title>
<link rel="stylesheet" href="estilos.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A2540" media="(prefers-color-scheme: dark)">
<script src="comun.js"></script>
<style>
  :root {
    --ac-texto: #0F1B3D;
    --ac-texto-suave: #5B6785;
    --ac-borde: #E3E9F4;
    --superficie: #FFFFFF;
    --superficie-2: #EEF3FB;
    --ac-acento: #7C3AED;
    --ac-acento-bg: rgba(124, 58, 237, 0.10);
    --ok-bg: rgba(16, 185, 129, 0.12);
    --ok-txt: #059669;
    --warn-bg: rgba(217, 119, 6, 0.12);
    --warn-txt: #D97706;
    --err-bg: rgba(220, 38, 38, 0.12);
    --err-txt: #DC2626;
  }
  html.tema-oscuro {
    --ac-texto: #F1F5FF;
    --ac-texto-suave: #9AA8CC;
    --ac-borde: #223156;
    --superficie: #121D3A;
    --superficie-2: #1C2A4A;
    --ac-acento: #A78BFA;
    --ac-acento-bg: rgba(167, 139, 250, 0.14);
    --ok-bg: rgba(52, 211, 153, 0.18);
    --ok-txt: #6EE7B7;
    --warn-bg: rgba(251, 191, 36, 0.18);
    --warn-txt: #FCD34D;
    --err-bg: rgba(248, 113, 113, 0.18);
    --err-txt: #FCA5A5;
  }

  body {
    background: var(--fondo, #F4F7FC);
    color: var(--ac-texto);
  }

  .admin-wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 14px 14px calc(40px + env(safe-area-inset-bottom));
  }

  .link-volver {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ac-acento);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 12px;
  }

  .admin-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding: 16px;
    border-radius: 18px;
    background: linear-gradient(135deg, #8B5CF6, #6D28D9);
    color: #fff;
    box-shadow: 0 10px 28px rgba(109, 40, 217, 0.35);
  }
  .admin-header-icono {
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(255, 255, 255, 0.2);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .admin-header-icono svg { width: 24px; height: 24px; fill: #fff; }
  .admin-header-texto { flex: 1; }
  .admin-header-titulo { font-size: 18px; font-weight: 800; line-height: 1.2; }
  .admin-header-sub { font-size: 12.5px; font-weight: 500; opacity: 0.9; margin-top: 2px; }

  /* Pestañas */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    background: var(--superficie-2);
    padding: 4px;
    border-radius: 12px;
  }
  .tab {
    flex: 1; padding: 10px; border-radius: 8px; border: none;
    background: transparent; color: var(--ac-texto-suave); font-weight: 700; font-size: 14px;
    text-align: center; cursor: pointer; transition: all 0.2s;
  }
  .tab.activa {
    background: var(--superficie); color: var(--ac-acento);
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  html.tema-oscuro .tab.activa { box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

  /* Tarjetas de Turnos */
  .turno-card {
    background: var(--superficie); border: 1px solid var(--ac-borde);
    border-radius: 14px; padding: 16px; margin-bottom: 12px;
    position: relative; overflow: hidden;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  
  .turno-card.alerta { border-color: var(--err-txt); background: var(--err-bg); }

  .turno-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .turno-nombre { font-weight: 800; font-size: 16px; color: var(--ac-texto); }
  .turno-id { font-size: 11px; font-family: monospace; color: var(--ac-texto-suave); margin-top: 2px; }
  
  .badge { font-size: 10.5px; font-weight: 800; padding: 4px 10px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge-abierto { background: var(--ok-bg); color: var(--ok-txt); }
  .badge-alerta { background: #fff; color: var(--err-txt); }

  .turno-fila { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 6px; color: var(--ac-texto); }
  .turno-fila .lbl { color: var(--ac-texto-suave); font-weight: 500; }
  .turno-fila .val { font-weight: 700; font-family: monospace; }

  .btn-forzar {
    width: 100%; margin-top: 14px; padding: 12px; border-radius: 10px;
    background: var(--err-txt); color: #fff; border: none; font-weight: 700; font-size: 13px;
    cursor: pointer; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
  }
  .btn-forzar:active { transform: scale(0.98); }

  /* Tarjetas de Horarios */
  .horario-card {
    background: var(--superficie); border: 1px solid var(--ac-borde); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center;
    animation: fadeIn 0.3s ease;
  }
  .horario-info { flex: 1; }
  .horario-dia { font-weight: 800; font-size: 12px; color: var(--ac-acento); text-transform: uppercase; letter-spacing: 0.5px; }
  .horario-horas { font-size: 16px; font-weight: 800; margin-top: 2px; color: var(--ac-texto); font-family: monospace; }
  .horario-asignado { font-size: 13px; font-weight: 500; color: var(--ac-texto-suave); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
  
  .btn-eliminar-horario {
    width: 40px; height: 40px; border-radius: 12px; background: var(--err-bg); color: var(--err-txt);
    border: none; display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
  }
  .btn-eliminar-horario:active { transform: scale(0.9); }
  .btn-eliminar-horario svg { width: 20px; height: 20px; fill: currentColor; }

  .btn-flotante {
    position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(135deg, #8B5CF6, #6D28D9); color: #fff; font-size: 32px;
    border: none; box-shadow: 0 8px 24px rgba(109, 40, 217, 0.4); display: none;
    align-items: center; justify-content: center; z-index: 50; cursor: pointer;
    transition: transform 0.15s;
  }
  .btn-flotante:active { transform: scale(0.9); }

  /* Vacíos */
  .vacio {
    text-align: center; padding: 40px 20px; color: var(--ac-texto-suave); font-size: 14px;
    background: var(--superficie); border-radius: 14px; border: 1px dashed var(--ac-borde);
  }
  .vacio svg { width: 48px; height: 48px; fill: var(--ac-borde); margin-bottom: 12px; }

  /* Modal */
  .modal-fondo { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; padding: 20px; overflow-y: auto; }
  .modal-fondo.abierto { display: flex; align-items: flex-start; justify-content: center; padding-top: 40px; }
  .modal { background: var(--superficie); border-radius: 18px; padding: 22px; max-width: 440px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .modal-titulo { font-size: 18px; font-weight: 800; margin-bottom: 16px; color: var(--ac-texto); }
  .form-grupo { margin-bottom: 14px; }
  .form-grupo label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ac-texto-suave); margin-bottom: 6px; }
  .form-grupo input, .form-grupo select { width: 100%; padding: 12px; border-radius: 10px; background: var(--superficie-2); border: 1.5px solid var(--ac-borde); color: var(--ac-texto); font-size: 15px; box-sizing: border-box; font-family: inherit; }
  .form-grupo input:focus, .form-grupo select:focus { outline: none; border-color: var(--ac-acento); }
  .modal-acciones { display: flex; gap: 8px; margin-top: 18px; }
  .modal-acciones button { flex: 1; padding: 13px; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; font-size: 14px; }
  .btn-primario { background: var(--ac-acento); color: #fff; }
  .btn-secundario { background: var(--superficie-2); color: var(--ac-texto-suave); }
</style>
</head>
<body>

<div class="admin-wrap">
  <a href="index.html" class="link-volver">← Volver al menú</a>

  <div class="admin-header">
    <div class="admin-header-icono">
      <svg viewBox="0 -960 960 960"><path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-80q-25 0-42.5-17.5T420-300q0-25 17.5-42.5T480-360q25 0 42.5 17.5T540-300q0 25-17.5 42.5T480-240Zm-40-160v-320h80v320h-80Z"/></svg>
    </div>
    <div class="admin-header-texto">
      <div class="admin-header-titulo">Control de Turnos</div>
      <div class="admin-header-sub">Monitoreo y planificación</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab activa" data-tab="turnos">Turnos en curso</button>
    <button class="tab" data-tab="horarios">Horarios</button>
  </div>

  <!-- PESTAÑA TURNOS -->
  <div id="panelTurnos" style="display:block;">
    <div id="listaTurnos"></div>
  </div>

  <!-- PESTAÑA HORARIOS -->
  <div id="panelHorarios" style="display:none;">
    <div id="listaHorarios"></div>
  </div>

  <button class="btn-flotante" id="btnNuevoHorario">+</button>
</div>

<!-- Modal Agregar Horario -->
<div class="modal-fondo" id="modalHorario">
  <div class="modal">
    <div class="modal-titulo">Asignar horario</div>
    
    <div class="form-grupo">
      <label>Empleado (Nombre o ID)</label>
      <input type="text" id="hAsignado" placeholder="Ej: Juan Pérez (USR-01)">
    </div>
    <div class="form-grupo">
      <label>Día de la semana</label>
      <select id="hDia">
        <option>Lunes</option><option>Martes</option><option>Miércoles</option>
        <option>Jueves</option><option>Viernes</option><option>Sábado</option><option>Domingo</option>
      </select>
    </div>
    <div class="form-grupo">
      <label>Hora de inicio</label>
      <input type="time" id="hInicio" value="08:00">
    </div>
    <div class="form-grupo">
      <label>Hora de fin</label>
      <input type="time" id="hFin" value="16:00">
    </div>

    <div class="modal-acciones">
      <button class="btn-secundario" id="btnCancelarHorario">Cancelar</button>
      <button class="btn-primario" id="btnGuardarHorario">Asignar</button>
    </div>
  </div>
</div>

<script>
exigirSesion();
let turnosData = [];
let horariosData = [];

(async function init() {
  const u = getUsuarioTurno();
  if (!u || u.rol !== 'admin') { location.href = 'index.html'; return; }
  await cargarTurnos();
  await cargarHorarios();
})();

// ================== TURNOS ==================
async function cargarTurnos() {
  const u = getUsuarioTurno();
  try {
    const r = await jsonp({ accion: 'horarios_turnos', id_usuario: u.id });
    if (r && r.ok) {
      turnosData = r.items;
      pintarTurnos();
    }
  } catch (e) { console.error(e); }
}

function formatearFecha(f) {
  if (!f) return '—';
  const d = new Date(f.replace(' ', 'T'));
  const dia = d.getDate();
  const mes = d.getMonth() + 1;
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  return `${dia}/${mes} a las ${h}:${m}`;
}

function pintarTurnos() {
  const cont = document.getElementById('listaTurnos');
  // Solo mostrar los abiertos
  const abiertos = turnosData.filter(t => t.estado === 'abierto');
  
  if (abiertos.length === 0) {
    cont.innerHTML = '<div class="vacio"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg><br>No hay turnos abiertos ahora mismo</div>';
    return;
  }

  cont.innerHTML = '';
  abiertos.forEach(t => {
    // Si el turno lleva más de 10 horas abierto, es una alerta (se olvidaron de cerrar)
    const ahora = new Date();
    const apertura = new Date(t.fecha_apertura.replace(' ', 'T'));
    const horasAbierto = (ahora - apertura) / (1000 * 60 * 60);
    const esAlerta = horasAbierto > 10;

    const card = document.createElement('div');
    card.className = 'turno-card' + (esAlerta ? ' alerta' : '');
    card.innerHTML = `
      <div class="turno-top">
        <div>
          <div class="turno-nombre">${t.responsable}</div>
          <div class="turno-id">${t.id_turno}</div>
        </div>
        <span class="badge ${esAlerta ? 'badge-alerta' : 'badge-abierto'}">${esAlerta ? '⚠️ Alerta' : '● Abierto'}</span>
      </div>
      <div class="turno-fila"><span class="lbl">Apertura</span><span class="val">${formatearFecha(t.fecha_apertura)}</span></div>
      <div class="turno-fila"><span class="lbl">Base inicial</span><span class="val">$${t.base.toLocaleString('es-CO')}</span></div>
      ${esAlerta ? '<button class="btn-forzar" onclick="alert(\'El turno se cerrará automáticamente en la próxima actualización de la app.\')">⚠️ Forzar cierre urgente</button>' : ''}
    `;
    cont.appendChild(card);
  });
}

// ================== HORARIOS ==================
async function cargarHorarios() {
  const u = getUsuarioTurno();
  try {
    const r = await jsonp({ accion: 'horarios_admin', id_usuario: u.id });
    if (r && r.ok) {
      horariosData = r.items;
      pintarHorarios();
    }
  } catch (e) { console.error(e); }
}

function pintarHorarios() {
  const cont = document.getElementById('listaHorarios');
  if (horariosData.length === 0) {
    cont.innerHTML = '<div class="vacio"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h5v5H7z"/></svg><br>No hay horarios asignados</div>';
    return;
  }

  cont.innerHTML = '';
  horariosData.forEach(h => {
    const card = document.createElement('div');
    card.className = 'horario-card';
    card.innerHTML = `
      <div class="horario-info">
        <div class="horario-dia">${h.dia}</div>
        <div class="horario-horas">${h.inicio} - ${h.fin}</div>
        <div class="horario-asignado">👤 ${h.asignado}</div>
      </div>
      <button class="btn-eliminar-horario" onclick="eliminarHorario('${h.id}')">
        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      </button>
    `;
    cont.appendChild(card);
  });
}

async function eliminarHorario(id) {
  if (!confirm('¿Eliminar este horario?')) return;
  const u = getUsuarioTurno();
  try {
    const r = await post({ accion: 'eliminar_horario', id_usuario_solicitante: u.id, id_horario: id });
    if (r.ok) { mostrar('Eliminado ✓', 'ok'); await cargarHorarios(); }
    else { mostrar(r.error, 'error'); }
  } catch (e) { mostrar(e.message, 'error'); }
}

// ================== NAVEGACIÓN / UI ==================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('activa'));
    tab.classList.add('activa');
    const target = tab.getAttribute('data-tab');
    
    document.getElementById('panelTurnos').style.display = target === 'turnos' ? 'block' : 'none';
    document.getElementById('panelHorarios').style.display = target === 'horarios' ? 'block' : 'none';
    
    // Mostrar/ocultar botón flotante
    document.getElementById('btnNuevoHorario').style.display = target === 'horarios' ? 'flex' : 'none';
  });
});

document.getElementById('btnNuevoHorario').addEventListener('click', () => {
  document.getElementById('modalHorario').classList.add('abierto');
});

document.getElementById('btnCancelarHorario').addEventListener('click', () => {
  document.getElementById('modalHorario').classList.remove('abierto');
});

document.getElementById('btnGuardarHorario').addEventListener('click', async () => {
  const asignado = document.getElementById('hAsignado').value.trim();
  const dia = document.getElementById('hDia').value;
  const inicio = document.getElementById('hInicio').value;
  const fin = document.getElementById('hFin').value;
  const u = getUsuarioTurno();

  if (!asignado) { mostrar('Falta el nombre del empleado', 'error'); return; }

  document.getElementById('btnGuardarHorario').disabled = true;
  try {
    const r = await post({
      accion: 'guardar_horario',
      id_usuario_solicitante: u.id,
      asignado: asignado,
      dia: dia,
      inicio: inicio,
      fin: fin
    });
    if (r.ok) {
      mostrar('Horario asignado ✓', 'ok');
      document.getElementById('modalHorario').classList.remove('abierto');
      document.getElementById('hAsignado').value = '';
      await cargarHorarios();
    } else {
      mostrar(r.error || 'Error', 'error');
    }
  } catch (e) { mostrar(e.message, 'error'); }
  finally { document.getElementById('btnGuardarHorario').disabled = false; }
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function (e) {
      console.warn('SW no registrado:', e);
    });
  });
}
</script>
</body>
</html>
