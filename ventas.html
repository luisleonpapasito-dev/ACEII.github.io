<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ventas · ACEII</title>
<link rel="stylesheet" href="estilos.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B4DB1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A2540" media="(prefers-color-scheme: dark)">
<script src="comun.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<style>
  /* ===== Buscador ===== */
  #resultados { max-height: 340px; overflow-y: auto; margin-top: 8px; }

  .resultado {
    padding: 10px 12px;
    border-bottom: 1px solid #E8ECF4;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  html.tema-oscuro .resultado { border-bottom-color: #303b50; }
  .resultado:last-child { border-bottom: none; }
  .resultado:hover { background: var(--superficie-2); }
  .resultado.agotado { opacity: 0.5; cursor: not-allowed; }

  .resultado .icono-res {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 12px;
    background: var(--superficie-2);
  }
  .resultado .icono-res svg { width: 100%; height: 100%; }
  .resultado .icono-res img { width: 100%; height: 100%; object-fit: cover; }

  .resultado .info { flex: 1; min-width: 0; }
  .resultado .nombre {
    font-size: 15px;
    font-weight: 600;
    color: var(--texto);
    display: block;
    margin-bottom: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .resultado .meta {
    font-size: 12px;
    color: var(--texto-suave);
    display: block;
  }
  .resultado .meta .precio {
    color: var(--azul);
    font-weight: 700;
    font-size: 14px;
  }
  .resultado .stock {
    font-size: 12px;
    font-weight: 600;
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    margin-left: 4px;
  }
  .resultado .stock.stock-ok { background: #E0F7EC; color: var(--exito); }
  .resultado .stock.stock-bajo { background: #FFF4DC; color: var(--aviso); }
  .resultado .stock.stock-cero { background: #FFE5E5; color: var(--alerta); }
  html.tema-oscuro .resultado .stock.stock-ok { background: rgba(52, 211, 153, 0.18); }
  html.tema-oscuro .resultado .stock.stock-bajo { background: rgba(251, 191, 36, 0.18); }
  html.tema-oscuro .resultado .stock.stock-cero { background: rgba(248, 113, 113, 0.18); }

  .resultado .en-carrito {
    background: var(--azul);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 4px;
  }

  .sin-resultados {
    padding: 20px 12px;
    text-align: center;
    color: var(--texto-suave);
    font-size: 14px;
  }
  .sin-resultados button { margin-top: 10px; width: 100%; }

  /* ===== Pills de categorías ===== */
  #pillsCategorias {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 0 8px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  #pillsCategorias::-webkit-scrollbar { display: none; }

  .pill-cat {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 20px;
    background: var(--superficie-2);
    color: var(--texto-suave);
    font-weight: 600;
    font-size: 13px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    user-select: none;
    -webkit-user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .pill-cat:active { transform: scale(0.96); }
  .pill-cat.activa {
    background: var(--azul);
    color: #fff;
    border-color: var(--azul-claro);
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
  }
  .pill-cat .pill-icon {
    font-size: 14px;
    line-height: 1;
  }

  /* ===== Rápidos ===== */
  #zonaRapidos {
    max-width: 480px;
    margin: 12px auto 0;
    padding: 0;
  }
  #zonaRapidos .titulo-fila {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
    gap: 8px;
  }
  #zonaRapidos .titulo-fila h4 {
    margin: 0;
    font-size: 16px;
    font-weight: 800;
    color: var(--texto);
    letter-spacing: -0.3px;
  }
  #zonaRapidos .titulo-fila .subtitulo {
    margin: 2px 0 0;
    font-size: 11px;
    color: var(--texto-suave);
    font-weight: 500;
  }

  #botonesRapidos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (min-width: 600px) {
    #botonesRapidos { grid-template-columns: 1fr 1fr 1fr; }
  }

  .btn-rapido {
    position: relative;
    background: var(--superficie);
    border: 2px solid var(--azul-borde);
    border-radius: 18px;
    padding: 10px 10px 10px 14px;
    text-align: left;
    cursor: pointer;
    transition: transform 0.12s, border-color 0.15s, box-shadow 0.15s, background 0.2s;
    color: var(--texto);
    font-family: var(--fuente);
    min-height: 130px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(50, 72, 110, 0.04);
  }
  .btn-rapido:active {
    transform: scale(0.96);
    border-color: var(--azul);
  }

  /* Barra lateral izquierda (indica categoría) */
  .btn-rapido::before {
    content: '';
    position: absolute;
    left: 0;
    top: 14px;
    bottom: 14px;
    width: 4px;
    border-radius: 0 4px 4px 0;
    background: var(--azul);
    opacity: 0.7;
    transition: opacity 0.15s, width 0.15s;
  }
  .btn-rapido:active::before { width: 6px; opacity: 1; }

  /* Fondos pastel por categoría */
  .btn-rapido.cat-empanada   { background: linear-gradient(135deg, #FBF5FF 0%, #F5EFFF 100%); border-color: #D9C7FF; }
  .btn-rapido.cat-empanada::before { background: #A78BFA; }

  .btn-rapido.cat-bebida     { background: linear-gradient(135deg, #F5FAFF 0%, #EFF6FF 100%); border-color: #BFDBFE; }
  .btn-rapido.cat-bebida::before { background: #3B82F6; }

  .btn-rapido.cat-combo      { background: linear-gradient(135deg, #F2FDF5 0%, #F0FDF4 100%); border-color: #BBF7D0; }
  .btn-rapido.cat-combo::before { background: #22C55E; }

  .btn-rapido.cat-dulce      { background: linear-gradient(135deg, #FFFBF3 0%, #FFF7ED 100%); border-color: #FED7AA; }
  .btn-rapido.cat-dulce::before { background: #F59E0B; }

  .btn-rapido.cat-preparado  { background: linear-gradient(135deg, #FFF7F6 0%, #FEF3F2 100%); border-color: #FECACA; }
  .btn-rapido.cat-preparado::before { background: #EF4444; }

  .btn-rapido.cat-snack      { background: linear-gradient(135deg, #FFFEF0 0%, #FEFCE8 100%); border-color: #FEF08A; }
  .btn-rapido.cat-snack::before { background: #EAB308; }

  .btn-rapido.cat-lacteo     { background: linear-gradient(135deg, #F5FCFF 0%, #F0F9FF 100%); border-color: #BAE6FD; }
  .btn-rapido.cat-lacteo::before { background: #0EA5E9; }

  /* Animación de "agregado" */
  .btn-rapido.agregado {
    animation: pulsoAgregar 0.4s ease;
  }
  @keyframes pulsoAgregar {
    0%   { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4); }
    50%  { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
    100% { transform: scale(1);   box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
  }

  .btn-rapido .icono {
    width: 100%;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 12px;
    background: rgba(255,255,255,0.6);
    flex-shrink: 0;
  }
  .btn-rapido .icono svg { width: 80%; height: 80%; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.08)); }
  .btn-rapido .icono img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }

  .btn-rapido .nom {
    font-size: 12.5px;
    font-weight: 700;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    color: var(--texto);
    padding-right: 26px;
    text-align: left;
  }
  .btn-rapido .pre {
    font-size: 13.5px;
    color: var(--azul);
    font-weight: 800;
    text-align: left;
    padding-right: 26px;
    letter-spacing: -0.2px;
  }

  .btn-rapido .plus {
    position: absolute;
    bottom: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--azul);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    box-shadow: 0 3px 8px rgba(37, 99, 235, 0.35);
    pointer-events: none;
    transition: transform 0.15s ease;
  }
  .btn-rapido:active .plus { transform: scale(0.9); }

  .btn-rapido.grupo .plus {
    background: var(--azul);
    box-shadow: 0 3px 8px rgba(37, 99, 235, 0.35);
  }

  /* Estado presionado (mantener para cobro rápido) */
  .btn-rapido.presionado,
  .btn-variante.presionado {
    background: var(--exito) !important;
    color: #fff !important;
    border-color: var(--exito) !important;
    transform: scale(1.03);
  }
  .btn-rapido.presionado .nom,
  .btn-rapido.presionado .pre,
  .btn-variante.presionado .nom-v,
  .btn-variante.presionado .pre-v {
    color: #fff !important;
  }

  /* ===== Variantes ===== */
  #panelVariantes {
    display: none;
    margin: 10px 0;
    padding: 12px;
    background: var(--superficie-2);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
  }
  #panelVariantes.abierto { display: block; }
  #panelVariantes .titulo-var {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-weight: 700;
    color: var(--texto);
  }
  #panelVariantes .titulo-var button {
    background: transparent;
    color: var(--texto-suave);
    font-size: 14px;
    padding: 4px 8px;
    margin: 0;
  }
  #listaVariantes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .btn-variante {
    background: var(--superficie);
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 10px;
    text-align: left;
    cursor: pointer;
    font-family: var(--fuente);
    font-size: 13px;
    font-weight: 600;
    color: var(--texto);
    transition: transform 0.1s, background 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn-variante:active { transform: scale(0.96); border-color: var(--azul); }
  .btn-variante .icono-v {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 8px;
    background: var(--superficie-2);
  }
  .btn-variante .icono-v svg { width: 80%; height: 80%; }
  .btn-variante .icono-v img { width: 100%; height: 100%; object-fit: cover; }
  .btn-variante .texto-v { flex: 1; min-width: 0; }
  .btn-variante .nom-v { display: block; font-size: 13px; }
  .btn-variante .pre-v { display: block; font-size: 12px; color: var(--azul); font-weight: 700; margin-top: 2px; }

  /* ===== Panel cantidad ===== */
  #panelCantidad {
    margin-top: 10px;
    padding: 14px;
    background: var(--superficie-2);
    border-radius: var(--radio-sm);
    display: none;
  }
  #panelCantidad .acciones {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  #panelCantidad .acciones button {
    padding: 10px 16px;
    font-size: 18px;
    font-weight: 700;
    background: var(--superficie);
    color: var(--azul);
    border-radius: 10px;
  }
  #panelCantidad input {
    width: 90px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
  }

  /* ===== Modales ===== */
  #modalCam {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    z-index: 100;
  }
  #modalCam.abierto { display: block; }
  #modalCam video { width: 100%; height: 100%; object-fit: cover; }
  #modalCam .cerrar {
    position: absolute;
    top: 12px; right: 12px;
    padding: 10px 14px;
    background: var(--alerta);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    z-index: 2;
  }
  #modalCam .marco {
    position: absolute;
    left: 5%; top: 27.5%;
    width: 90%; height: 45%;
    border: 3px solid #00e676;
    border-radius: 10px;
    box-sizing: border-box;
    pointer-events: none;
  }
  #modalCam .marco.ok { border-color: #40c4ff; }
  #modalCam .info {
    position: absolute;
    bottom: 20px; left: 20px; right: 20px;
    background: rgba(0, 0, 0, 0.7);
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    color: #fff;
    font-size: 14px;
  }
  #modalCam #zoomBox {
    position: absolute;
    bottom: 80px; left: 20px; right: 20px;
    background: rgba(0, 0, 0, 0.6);
    padding: 8px;
    border-radius: 10px;
    display: none;
  }
  #modalCam #zoomBox label { color: #fff; font-size: 12px; display: block; margin-bottom: 4px; }
  #modalCam #btnReiniciarCam {
    position: absolute;
    bottom: 20px; left: 20px;
    padding: 10px 14px;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
  }

  #panelEscaneo {
    display: none;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85);
    z-index: 3;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
  }
  #panelEscaneo .caja-conf {
    max-width: 480px;
    margin: 40px auto 0;
    background: var(--superficie);
    color: var(--texto);
    border-radius: var(--radio);
    padding: 20px;
  }
  #panelEscaneo .label-chico { color: var(--texto-suave); font-size: 12px; margin-bottom: 4px; }
  #panelEscaneo #codigoDetectado { color: var(--azul); font-size: 16px; font-weight: 700; margin-bottom: 12px; word-break: break-all; }
  #panelEscaneo #nombreDetectado { color: var(--texto); font-size: 18px; font-weight: 700; margin-bottom: 16px; }

  #modalConfig {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
  }
  #modalConfig.abierto { display: block; }
  #modalConfig .contenido {
    max-width: 520px;
    margin: 20px auto;
    background: var(--superficie);
    color: var(--texto);
    border-radius: 16px;
    padding: 20px;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
  }

  .mc-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .mc-header strong { font-size: 17px; }
  .mc-contador {
    font-size: 13px;
    color: var(--texto-suave);
    margin-bottom: 12px;
  }
  .mc-contador b { color: var(--azul); font-weight: 700; }

  .mc-pills {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 4px 0 10px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .mc-pills::-webkit-scrollbar { display: none; }
  .mc-pill {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 16px;
    background: var(--superficie-2);
    color: var(--texto-suave);
    font-size: 12px;
    font-weight: 600;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    user-select: none;
  }
  .mc-pill.activa {
    background: var(--azul);
    color: #fff;
    border-color: var(--azul-claro);
  }

  #listaConfig {
    flex: 1;
    overflow-y: auto;
    margin: 0 -8px;
    padding: 0 8px;
    min-height: 200px;
    max-height: 55vh;
  }

  .mc-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 8px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 4px;
  }
  .mc-item:hover { background: var(--superficie-2); }
  .mc-item.seleccionado {
    background: rgba(37, 99, 235, 0.10);
  }
  html.tema-oscuro .mc-item.seleccionado {
    background: rgba(96, 165, 250, 0.15);
  }

  .mc-item .icono-mc-item {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border-radius: 10px;
    overflow: hidden;
    background: var(--superficie-2);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mc-item .icono-mc-item svg { width: 80%; height: 80%; }
  .mc-item .icono-mc-item img { width: 100%; height: 100%; object-fit: cover; }

  .mc-item .texto-mc-item {
    flex: 1;
    min-width: 0;
  }
  .mc-item .texto-mc-item strong {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--texto);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mc-item .texto-mc-item small {
    color: var(--texto-suave);
    font-size: 12px;
  }

  .mc-check {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--azul-borde);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s ease;
    background: transparent;
  }
  .mc-check svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; }
  .mc-item.seleccionado .mc-check {
    background: var(--exito);
    border-color: var(--exito);
    transform: scale(1.1);
  }
  .mc-item.seleccionado .mc-check svg { opacity: 1; }

  .mc-footer {
    padding-top: 12px;
    border-top: 1px solid #E8ECF4;
    margin-top: 8px;
  }
  html.tema-oscuro .mc-footer { border-top-color: #303b50; }
  .mc-footer button {
    width: 100%;
    margin: 0;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
  }

  #btnConfigurar {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 10px;
    background: var(--superficie-2);
    color: var(--azul);
    border: none;
    font-size: 13px;
    font-weight: 600;
    margin: 0;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  #btnConfigurar svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }
  #btnConfigurar:active { transform: scale(0.95); }

  /* ===== Modal cobro rápido (tap largo) ===== */
  #modalCobro {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 300;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
  }
  #modalCobro.abierto { display: block; }
  #modalCobro .contenido {
    max-width: 420px;
    margin: 40px auto 0;
    background: var(--superficie);
    color: var(--texto);
    border-radius: var(--radio);
    padding: 22px;
    box-shadow: var(--sombra-fuerte);
  }
  #modalCobro .titulo {
    font-size: 18px;
    font-weight: 700;
    color: var(--texto);
    text-align: center;
    margin-bottom: 6px;
  }
  #modalCobro .prod {
    font-size: 14px;
    color: var(--texto-suave);
    text-align: center;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  #modalCobro .prod .icono-mc {

function norm_(s) {
  return String(s === null || s === undefined ? '' : s).trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function svgPorCategoria(p) {
  const n = norm_(p.nombre || '');
  const c = norm_(p.categoria || '');

  if (c.indexOf('empanada') >= 0) return SVG_ICONOS.empanada;
  if (c.indexOf('combo') >= 0) return SVG_ICONOS.combo;
  if (c.indexOf('pasaboca') >= 0) return SVG_ICONOS.snack;
  if (c.indexOf('lacteo') >= 0 || c.indexOf('avena') >= 0) return SVG_ICONOS.lacteo;
  if (c.indexOf('dulce') >= 0 || c.indexOf('confiteria') >= 0) return SVG_ICONOS.dulce;
  if (c.indexOf('galleta') >= 0 || c.indexOf('ponque') >= 0) return SVG_ICONOS.dulce;
  if (c.indexOf('preparado') >= 0 || c.indexOf('instantanea') >= 0) return SVG_ICONOS.preparado;
  if (c.indexOf('bebida') >= 0) {
    if (n.indexOf('agua') >= 0) return SVG_ICONOS.agua;
    if (n.indexOf('jugo') >= 0 || n.indexOf('hit') >= 0 || n.indexOf('malta') >= 0) return SVG_ICONOS.jugo;
    return SVG_ICONOS.gaseosa;
  }
  if (c.indexOf('papeleria') >= 0 || c.indexOf('higiene') >= 0) return SVG_ICONOS.default;

  if (n.indexOf('empanada') >= 0) return SVG_ICONOS.empanada;
  if (n.indexOf('combo') >= 0) return SVG_ICONOS.combo;
  if (n.indexOf('agua') >= 0) return SVG_ICONOS.agua;
  if (n.indexOf('jugo') >= 0 || n.indexOf('hit') >= 0 || n.indexOf('malta') >= 0) return SVG_ICONOS.jugo;
  if (n.indexOf('gaseosa') >= 0 || n.indexOf('coca') >= 0 || n.indexOf('pepsi') >= 0 ||
      n.indexOf('cola') >= 0 || n.indexOf('sprite') >= 0 || n.indexOf('fanta') >= 0) return SVG_ICONOS.gaseosa;
  if (n.indexOf('papas') >= 0 || n.indexOf('snack') >= 0 || n.indexOf('detodito') >= 0 || n.indexOf('margarita') >= 0) return SVG_ICONOS.snack;
  if (n.indexOf('chocoramo') >= 0 || n.indexOf('gansito') >= 0 || n.indexOf('chocolatina') >= 0 ||
      n.indexOf('chocolat') >= 0 || n.indexOf('chokis') >= 0 || n.indexOf('glacitas') >= 0 ||
      n.indexOf('jet') >= 0 || n.indexOf('chocolores') >= 0) return SVG_ICONOS.dulce;
  if (n.indexOf('leche') >= 0 || n.indexOf('avena') >= 0 || n.indexOf('yogur') >= 0) return SVG_ICONOS.lacteo;

  return SVG_ICONOS.default;
}

function iconoParaProducto(p) {
  if (p && p.imagen_url) {
    const svg = svgPorCategoria(p);
    const svgB64 = btoa(unescape(encodeURIComponent(svg)));
    return '<img src="' + urlImagenOk(p.imagen_url) + '" alt="" loading="lazy" ' +
           'onerror="this.onerror=null; this.src=\'data:image/svg+xml;base64,' + svgB64 + '\';">';
  }
  return svgPorCategoria(p || {});
}

function iconoParaGrupo(nombreCategoria) {
  return svgPorCategoria({ nombre: '', categoria: nombreCategoria });
}

function iconoPill(cat) {
  const c = norm_(cat);
  if (c.indexOf('empanada') >= 0) return '🥟';
  if (c.indexOf('bebida') >= 0) return '🥤';
  if (c.indexOf('combo') >= 0) return '🍔';
  if (c.indexOf('dulce') >= 0 || c.indexOf('confiteria') >= 0) return '🍫';
  if (c.indexOf('galleta') >= 0 || c.indexOf('ponque') >= 0) return '🍪';
  if (c.indexOf('pasaboca') >= 0) return '🍟';
  if (c.indexOf('lacteo') >= 0 || c.indexOf('avena') >= 0) return '🥛';
  if (c.indexOf('preparado') >= 0 || c.indexOf('instantanea') >= 0) return '🍽';
  if (c.indexOf('comida') >= 0) return '🍽';
  if (c.indexOf('papeleria') >= 0) return '📄';
  if (c.indexOf('higiene') >= 0) return '🧼';
  return '📁';
}

function claseCategoria(cat) {
  const c = norm_(cat);
  if (c.indexOf('empanada') >= 0) return 'cat-empanada';
  if (c.indexOf('combo') >= 0) return 'cat-combo';
  if (c.indexOf('bebida') >= 0) return 'cat-bebida';
  if (c.indexOf('dulce') >= 0 || c.indexOf('confiteria') >= 0 || c.indexOf('galleta') >= 0 || c.indexOf('ponque') >= 0) return 'cat-dulce';
  if (c.indexOf('preparado') >= 0 || c.indexOf('instantanea') >= 0) return 'cat-preparado';
  if (c.indexOf('pasaboca') >= 0) return 'cat-snack';
  if (c.indexOf('lacteo') >= 0 || c.indexOf('avena') >= 0) return 'cat-lacteo';
  return '';
}

// ===== Detector tap / scroll =====
const TAP_THRESHOLD = 10;

function crearDetectorTap(elemento, onTap, onLongPress) {
  let startX = 0, startY = 0;
  let timer = null;
  let fueLargo = false;
  let touchActivo = false;
  let clickReciente = false;

  elemento.addEventListener('touchstart', function (e) {
    const touch = e.touches[0];
    startX = touch.clientX;
    startY = touch.clientY;
    touchActivo = true;
    fueLargo = false;
    if (onLongPress) {
      timer = setTimeout(function () {
        fueLargo = true;
        elemento.classList.add('presionado');
        if (navigator.vibrate) navigator.vibrate(50);
      }, 800);
    }
  }, { passive: true });

  elemento.addEventListener('touchmove', function (e) {
    const touch = e.touches[0];
    const dx = Math.abs(touch.clientX - startX);
    const dy = Math.abs(touch.clientY - startY);
    if (dx > TAP_THRESHOLD || dy > TAP_THRESHOLD) {
      clearTimeout(timer);
      fueLargo = false;
      touchActivo = false;
      elemento.classList.remove('presionado');
    }
  }, { passive: true });

  elemento.addEventListener('touchend', function (e) {
    clearTimeout(timer);
    elemento.classList.remove('presionado');
    if (!touchActivo) return;
    touchActivo = false;
    const touch = e.changedTouches[0];
    const dx = Math.abs(touch.clientX - startX);
    const dy = Math.abs(touch.clientY - startY);
    if (dx > TAP_THRESHOLD || dy > TAP_THRESHOLD) return;
    clickReciente = true;
    setTimeout(function () { clickReciente = false; }, 500);
    if (fueLargo && onLongPress) onLongPress();
    else onTap();
  });

  elemento.addEventListener('touchcancel', function () {
    clearTimeout(timer);
    touchActivo = false;
    fueLargo = false;
    elemento.classList.remove('presionado');
  });

  elemento.addEventListener('click', function () {
    if (clickReciente) return;
    onTap();
  });
}

async function cargarProductos() {
  mostrar('Cargando productos...', 'aviso');
  try {
    const r = await jsonp({ accion: 'productos_venta' }, 25000);
    if (r && r.error === 'Token inválido') { borrarToken(); location.href = 'index.html'; return; }
    if (!r || !r.ok) throw new Error(r && r.error ? r.error : 'respuesta vacía');
    productos = r.items;
    mostrar('Listo para vender');
  } catch (err) {
    mostrar('No se pudieron cargar los productos: ' + err.message, 'error');
  }
}

// ===== Pills de categorías =====
function pintarPillsCategorias() {
  const cont = $('pillsCategorias');
  cont.innerHTML = '';

  const cats = {};
  productos.forEach(function (p) {
    if (p.categoria) cats[p.categoria] = true;
  });

  const todas = document.createElement('div');
  todas.className = 'pill-cat' + (categoriaFiltro === '' ? ' activa' : '');
  todas.innerHTML = '<span class="pill-icon">📦</span> Todas';
  todas.addEventListener('click', function () {
    categoriaFiltro = '';
    pintarPillsCategorias();
    pintarRapidos();
  });
  cont.appendChild(todas);

  Object.keys(cats).sort().forEach(function (cat) {
    const d = document.createElement('div');
    d.className = 'pill-cat' + (categoriaFiltro === cat ? ' activa' : '');
    d.innerHTML = '<span class="pill-icon">' + iconoPill(cat) + '</span> ' + cat;
    d.addEventListener('click', function () {
      categoriaFiltro = (categoriaFiltro === cat) ? '' : cat;
      pintarPillsCategorias();
      pintarRapidos();
    });
    cont.appendChild(d);
  });
}

// ===== Buscador =====
function pintarResultados() {
  const q = norm_($('buscar').value);
  const cont = $('resultados');
  cont.innerHTML = '';
  $('panelCantidad').style.display = 'none';
  if (q.length < 2) return;

  let n = 0;
  const coincidencias = [];
  productos.forEach(function (p) {
    if (norm_(p.id + ' ' + p.nombre).indexOf(q) < 0) return;
    coincidencias.push(p);
  });

  coincidencias.slice(0, 8).forEach(function (p) {
    n++;
    const d = document.createElement('div');
    d.className = 'resultado' + (p.stock <= 0 ? ' agotado' : '');

    let stockClase = 'stock-ok';
    if (p.stock <= 0) stockClase = 'stock-cero';
    else if (p.stock <= 5) stockClase = 'stock-bajo';

    const enCarrito = carrito.find(function (x) { return x.id === p.id; });
    const cantEnCarrito = enCarrito ? enCarrito.cantidad : 0;

    d.innerHTML =
      '<div class="icono-res">' + iconoParaProducto(p) + '</div>' +
      '<div class="info">' +
        '<span class="nombre">' + p.nombre + '</span>' +
        '<span class="meta">' +
          '<span class="precio">' + fmt(p.precio) + '</span>' +
          ' · ' + p.id +
        '</span>' +
      '</div>' +
      '<div style="text-align:right;">' +
        '<span class="stock ' + stockClase + '">' +
          (p.stock <= 0 ? 'Agotado' : p.stock + ' disp.') +
        '</span>' +
        (cantEnCarrito ? '<br><span class="en-carrito">' + cantEnCarrito + ' en carrito</span>' : '') +
      '</div>';

    if (p.stock > 0) {
      crearDetectorTap(d, function () { mostrarPanelCantidad(p); }, null);
    }
    cont.appendChild(d);
  });

  if (!n) {
    const d = document.createElement('div');
    d.className = 'sin-resultados';
    d.innerHTML =
      'No encontramos "' + $('buscar').value + '".<br>' +
      'Prueba con otra palabra o escanea el código.<br>' +
      '<button class="main" id="btnCamDesdeSinResultados">📷 Escanear con cámara</button>';
    cont.appendChild(d);
    const btn = document.getElementById('btnCamDesdeSinResultados');
    if (btn) {
      btn.addEventListener('click', function () {
        $('modalCam').classList.add('abierto');
        iniciarCamara();
      });
    }
  }
}

function mostrarPanelCantidad(p) {
  productoPendiente = p;
  const enCarrito = carrito.find(function (x) { return x.id === p.id; });
  const yaEnCarrito = enCarrito ? enCarrito.cantidad : 0;
  const maxPosible = p.stock - yaEnCarrito;
  $('panelNombre').textContent = p.nombre + ' — ' + fmt(p.precio);
  $('cantidadVenta').value = 1;
  $('cantidadVenta').max = maxPosible;
  $('cantStock').textContent = 'Disponible: ' + maxPosible;
  $('panelCantidad').style.display = 'block';
  $('cantidadVenta').focus();
}

$('cantMenos').addEventListener('click', function () {
  let v = Number($('cantidadVenta').value) || 1;
  if (v > 1) $('cantidadVenta').value = v - 1;
});
$('cantMas').addEventListener('click', function () {
  let v = Number($('cantidadVenta').value) || 1;
  const max = Number($('cantidadVenta').max) || 999;
  if (v < max) $('cantidadVenta').value = v + 1;
});
$('btnCancelarCantidad').addEventListener('click', function () {
  $('panelCantidad').style.display = 'none';
  productoPendiente = null;
});
$('btnAgregarCantidad').addEventListener('click', function () {
  if (!productoPendiente) return;
  const cant = Number($('cantidadVenta').value) || 0;
  if (cant <= 0) { mostrar('Cantidad inválida', 'error'); return; }
  const p = productoPendiente;
  agregarProductoAlCarrito(p, cant);
  $('panelCantidad').style.display = 'none';
  productoPendiente = null;
  $('buscar').value = '';
  $('resultados').innerHTML = '';
  $('buscar').focus();
});

// ===== Rápidos por categoría =====
function cargarRapidosGuardados() {
  let data = null;
  try {
    data = JSON.parse(localStorage.getItem(RAPIDOS_KEY) || 'null');
  } catch (e) {}

  if (Array.isArray(data)) {
    rapidos = { 'GLOBAL': data.slice(0, 8) };
    guardarRapidos();
    return;
  }

  if (data && typeof data === 'object') {
    rapidos = data;
    Object.keys(rapidos).forEach(function (cat) {
      rapidos[cat] = (rapidos[cat] || []).filter(function (rid) {
        return idRapidoEsValido(rid);
      }).slice(0, 8);
    });
    return;
  }

  rapidos = { 'GLOBAL': [] };
  const defaults = [];
  const conteoCategorias = {};
  productos.forEach(function (p) {
    const cat = p.categoria || '';
    if (!cat) return;
    conteoCategorias[cat] = (conteoCategorias[cat] || 0) + 1;
  });

  ['Empanadas', 'Preparados', 'Combos'].forEach(function (cat) {
    if (conteoCategorias[cat] >= 2) defaults.push('GRUPO_' + cat);
  });

  ['chocoramo', 'gansito', 'jugo hit', 'agua pequeña'].forEach(function (nombre) {
    if (defaults.length >= 8) return;
    const p = productos.find(function (x) {
      return norm_(x.nombre).indexOf(nombre) >= 0 && defaults.indexOf(x.id) < 0;
    });
    if (p) defaults.push(p.id);
  });

  rapidos['GLOBAL'] = defaults.slice(0, 8);
  guardarRapidos();
}

function idRapidoEsValido(rid) {
  if (!rid) return false;
  if (rid.startsWith('GRUPO_')) {
    const cat = rid.replace('GRUPO_', '');
    return productos.some(function (p) { return norm_(p.categoria) === norm_(cat); });
  }
  return productos.some(function (p) { return p.id === rid; });
}

function guardarRapidos() {
  try { localStorage.setItem(RAPIDOS_KEY, JSON.stringify(rapidos)); } catch (e) {}
}

function getRapidosDeCategoria(cat) {
  const key = cat || 'GLOBAL';
  return rapidos[key] || [];
}

function setRapidosDeCategoria(cat, arr) {
  const key = cat || 'GLOBAL';
  rapidos[key] = arr.slice(0, 8);
}

function crearBotonRapido(p, esGrupo, itemsGrupo) {
  const btn = document.createElement('button');
  let clases = 'btn-rapido';
  if (esGrupo) clases += ' grupo';

  const catKey = esGrupo ? p : (p.categoria || '');
  const claseCat = claseCategoria(catKey);
  if (claseCat) clases += ' ' + claseCat;
  btn.className = clases;

  if (esGrupo) {
    btn.innerHTML =
      '<span class="icono">' + iconoParaGrupo(p) + '</span>' +
      '<span class="nom">' + p + '</span>' +
      '<span class="pre">' + itemsGrupo.length + ' opciones</span>' +
      '<span class="plus">›</span>';
  } else {
    btn.innerHTML =
      '<span class="icono">' + iconoParaProducto(p) + '</span>' +
      '<span class="nom">' + p.nombre + '</span>' +
      '<span class="pre">' + fmt(p.precio) + '</span>' +
      '<span class="plus">+</span>';
  }

  const onTap = function () {
    if (esGrupo) {
      mostrarVariantes(p, itemsGrupo);
    } else {
      agregarProductoAlCarrito(p, 1);
      btn.classList.add('agregado');
      setTimeout(function () { btn.classList.remove('agregado'); }, 400);
    }
  };

  const onLongPress = function () {
    if (esGrupo) {
      mostrarVariantes(p, itemsGrupo);
    } else {
      if (navigator.vibrate) navigator.vibrate(80);
      abrirCobroRapido(p, 1);
    }
  };

  crearDetectorTap(btn, onTap, onLongPress);
  return btn;
}

function pintarRapidos() {
  const cont = $('botonesRapidos');
  cont.innerHTML = '';

  const lista = getRapidosDeCategoria(categoriaFiltro);

  if (lista.length === 0) {
    cont.innerHTML =
      '<div style="grid-column: span 2; text-align:center; color:var(--texto-suave); font-size:13px; padding:20px;">' +
      (categoriaFiltro
        ? 'No hay rápidos en <b>' + categoriaFiltro + '</b>. Toca ⚙️ Configurar.'
        : 'Sin botones rápidos. Toca ⚙️ Configurar.') +
      '</div>';
    return;
  }

  lista.forEach(function (rid) {
    if (rid.startsWith('GRUPO_')) {
      const nombreGrupo = rid.replace('GRUPO_', '');
      const itemsGrupo = productos.filter(function (p) {
        return norm_(p.categoria) === norm_(nombreGrupo);
      });
      if (itemsGrupo.length === 0) return;
      cont.appendChild(crearBotonRapido(nombreGrupo, true, itemsGrupo));
      return;
    }

    const p = productos.find(function (x) { return x.id === rid; });
    if (!p) return;
    cont.appendChild(crearBotonRapido(p, false, null));
  });
}

function mostrarVariantes(nombre, items) {
  $('tituloVariantes').textContent = nombre;
  const cont = $('listaVariantes');

  items.forEach(function (p) {

// ===== Carrito =====
function agregarProductoAlCarrito(p, cant) {
  const enCarrito = carrito.find(function (x) { return x.id === p.id; });
  const yaEnCarrito = enCarrito ? enCarrito.cantidad : 0;
  if (yaEnCarrito + cant > p.stock) {
    mostrar('Solo hay ' + (p.stock - yaEnCarrito) + ' disponibles de ' + p.nombre, 'error');
    return;
  }
  if (enCarrito) {
    enCarrito.cantidad += cant;
  } else {
    carrito.push({ id: p.id, nombre: p.nombre, precio: p.precio, cantidad: cant, stock: p.stock });
  }
  if (navigator.vibrate) navigator.vibrate(40);
  pintarBarraFlotante();
  guardarCarrito();
}

function totalCarrito() {
  return carrito.reduce(function (s, it) { return s + it.precio * it.cantidad; }, 0);
}

function cantidadTotalCarrito() {
  return carrito.reduce(function (s, it) { return s + it.cantidad; }, 0);
}

function pintarBarraFlotante() {
  const barra = $('barraFlotante');
  const cant = cantidadTotalCarrito();
  const total = totalCarrito();

  if (cant === 0) {
    barra.classList.remove('visible', 'expandido');
    return;
  }

  $('bfLabel').textContent = cant + ' producto' + (cant === 1 ? '' : 's');
  $('bfTotal').textContent = fmt(total);

  const det = $('bfDetalle');
  det.innerHTML = '';
  carrito.forEach(function (it, i) {
    const row = document.createElement('div');
    row.className = 'bf-item';
    row.innerHTML =
      '<span class="bf-nom">' + it.nombre + '</span>' +
      '<span class="bf-cant">×' + it.cantidad + '</span>' +
      '<span class="bf-precio">' + fmt(it.precio * it.cantidad) + '</span>' +
      '<button class="bf-quitar">✕</button>';
    row.querySelector('.bf-quitar').addEventListener('click', function (e) {
      e.stopPropagation();
      carrito.splice(i, 1);
      pintarBarraFlotante();
      guardarCarrito();
    });
    det.appendChild(row);
  });

  barra.classList.add('visible');
}

$('bfResumen').addEventListener('click', function () {
  $('barraFlotante').classList.toggle('expandido');
});

// ===== Cobro =====
function nuevoIdVenta() {
  const d = new Date();
  const p = function (n) { return ('0' + n).slice(-2); };
  return 'VEN-' + String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
}

async function cobrar(medio) {
  if (!carrito.length) return;
  const u = getUsuarioTurno();
  if (!u) { mostrar('No hay turno iniciado', 'error'); return; }

  let cambio = null;
  if (medio === 'Efectivo') {
    const total = totalCarrito();
    const resp = prompt('Cliente paga con efectivo.\nTotal: ' + fmt(total) + '\n\n¿Con cuánto paga? (deja vacío o escribe "exacto"):', '');
    if (resp === null) return;
    if (resp.trim() !== '' && norm_(resp.trim()) !== 'exacto') {
      const recibido = Number(resp.trim());
      if (!isNaN(recibido) && recibido >= total) cambio = recibido - total;
    }
  }

  const idVenta = nuevoIdVenta();
  $('bfEfectivo').disabled = true;
  $('bfTransferencia').disabled = true;
  mostrar('Guardando venta...', 'aviso');

  try {
    const r = await post({
      accion: 'venta',
      id_venta: idVenta,
      id_usuario: u.id,
      id_turno: (getTurnoActual() ? getTurnoActual().id : ''),
      medio_pago: medio,
      observaciones: '',
      items: carrito.map(function (it) { return { id_producto: it.id, cantidad: it.cantidad }; })
    });
    if (r.ok) {
      let msj = '✓ ' + medio + ' · ' + r.lineas + ' línea(s)';
      if (cambio !== null) msj += ' · Cambio: ' + fmt(cambio);
      mostrar(msj, 'ok');
      if (navigator.vibrate) navigator.vibrate(200);
      if (cambio !== null && cambio > 0) alert('Cambio: ' + fmt(cambio));
      carrito = [];
      pintarBarraFlotante();
      guardarCarrito();
    } else if (r.error === 'Token inválido') {
      borrarToken(); location.href = 'index.html';
    } else {
      mostrar(r.error || 'Error desconocido', 'error');
      $('bfEfectivo').disabled = false;
      $('bfTransferencia').disabled = false;
    }
  } catch (err) {
    mostrar('Sin conexión. Revisa internet.', 'error');
    $('bfEfectivo').disabled = false;
    $('bfTransferencia').disabled = false;
  }
}

let mcProducto = null;
let mcCantidad = 1;
let mcMedio = null;
let mcTotal = 0;

function abrirCobroRapido(p, cant) {
  mcProducto = p;
  mcCantidad = cant;
  mcMedio = null;
  mcTotal = p.precio * cant;

  $('mcProducto').innerHTML =
    '<span class="icono-mc">' + iconoParaProducto(p) + '</span>' +
    '<span>' + cant + '× ' + p.nombre + '</span>';
  $('mcTotal').textContent = fmt(mcTotal);
  $('mcPago').value = '';
  $('mcCambioCalc').textContent = '';
  $('mcSeccionCambio').classList.remove('visible');
  $('mcConfirmar').disabled = true;
  $('mcConfirmar').textContent = 'Confirmar cobro';
  $('mcEfectivo').style.opacity = '1';
  $('mcTransferencia').style.opacity = '1';

  $('modalCobro').classList.add('abierto');
}

$('mcEfectivo').addEventListener('click', function () {

  $('mcTransferencia').style.opacity = '0.4';

});

  $('mcEfectivo').style.opacity = '0.4';

  $('mcConfirmar').disabled = false;

});

$('mcExacto').addEventListener('click', function () {
  $('mcPago').value = mcTotal;
  recalcularCambioMC();
});

$('mcPago').addEventListener('input', recalcularCambioMC);

function recalcularCambioMC() {
  const pago = Number($('mcPago').value) || 0;
  if (pago <= 0) { $('mcCambioCalc').textContent = ''; return; }
  if (pago < mcTotal) {
    $('mcCambioCalc').style.color = 'var(--alerta)';
    $('mcCambioCalc').textContent = '⚠️ Falta ' + fmt(mcTotal - pago);
  } else {
    const cambio = pago - mcTotal;
    $('mcCambioCalc').style.color = 'var(--exito)';
    $('mcCambioCalc').textContent = 'Cambio: ' + fmt(cambio);
  }
}

$('mcCancelar').addEventListener('click', function () {
  $('modalCobro').classList.remove('abierto');
});

$('mcConfirmar').addEventListener('click', async function () {
  if (!mcProducto || !mcMedio) return;

  const idVenta = nuevoIdVenta();
  $('mcConfirmar').disabled = true;
  $('mcConfirmar').textContent = 'Guardando...';

  try {
    const r = await post({
      accion: 'venta',
      id_venta: idVenta,
      id_usuario: getUsuarioTurno().id,
      id_turno: (getTurnoActual() ? getTurnoActual().id : ''),
      medio_pago: mcMedio,
      observaciones: '',
      items: [{ id_producto: mcProducto.id, cantidad: mcCantidad }]
    });
    if (r.ok) {
      let msj = '✓ Cobrado ' + mcCantidad + '× ' + mcProducto.nombre + ' · ' + fmt(mcTotal);
      if (mcMedio === 'Efectivo' && Number($('mcPago').value) > 0) {
        const cambio = Number($('mcPago').value) - mcTotal;
        if (cambio > 0) msj += ' · Cambio: ' + fmt(cambio);
      }
      mostrar(msj, 'ok');
      if (navigator.vibrate) navigator.vibrate(200);
      const p = productos.find(function (x) { return x.id === mcProducto.id; });
      if (p) p.stock -= mcCantidad;
      $('modalCobro').classList.remove('abierto');
      mcProducto = null;
    } else if (r.error === 'Token inválido') {
      borrarToken(); location.href = 'index.html';
    } else {
      mostrar(r.error || 'Error desconocido', 'error');
      $('mcConfirmar').disabled = false;
      $('mcConfirmar').textContent = 'Confirmar cobro';
    }
  } catch (err) {
    mostrar('Sin conexión. Revisa internet.', 'error');
    $('mcConfirmar').disabled = false;
    $('mcConfirmar').textContent = 'Confirmar cobro';
  }
});

  const cont = $('listaConfig');
  const q = norm_($('buscarConfig').value);

  pintarPillsConfig();

  const conteoCategorias = {};
  productos.forEach(function (p) {
    const cat = p.categoria || '';
    if (!cat) return;
    conteoCategorias[cat] = (conteoCategorias[cat] || 0) + 1;
  });

  Object.keys(conteoCategorias).sort().forEach(function (cat) {
    if (conteoCategorias[cat] < 2) return;
    if (categoriaConfigFiltro && norm_(cat) !== norm_(categoriaConfigFiltro)) return;
    if (q && norm_(cat).indexOf(q) < 0) return;

    const grupoId = 'GRUPO_' + cat;

      '</div>' +
      '<div class="mc-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>';

    d.addEventListener('click', function () {
      const idx = seleccionConfig.indexOf(grupoId);
      if (idx >= 0) seleccionConfig.splice(idx, 1);
      else if (seleccionConfig.length < 8) seleccionConfig.push(grupoId);
      else alert('Máximo 8 botones');
      pintarListaConfig();
    });
    cont.appendChild(d);
  });

  const filtrados = productos.filter(function (p) {
    if (categoriaConfigFiltro && norm_(p.categoria) !== norm_(categoriaConfigFiltro)) return false;
    if (q && norm_(p.id + ' ' + p.nombre).indexOf(q) < 0) return false;
    return true;
  }).sort(function (a, b) { return a.nombre.localeCompare(b.nombre); });

  filtrados.slice(0, 80).forEach(function (p) {
    const sel = seleccionConfig.indexOf(p.id) >= 0;
    const d = document.createElement('div');
    d.className = 'mc-item' + (sel ? ' seleccionado' : '');
    d.innerHTML =
      '<div class="icono-mc-item">' + iconoParaProducto(p) + '</div>' +
      '<div class="texto-mc-item">' +
        '<strong>' + p.nombre + '</strong>' +
        '<small>' + p.id + ' · ' + fmt(p.precio) + '</small>' +
      '</div>' +
      '<div class="mc-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>';

    d.addEventListener('click', function () {
      const idx = seleccionConfig.indexOf(p.id);
      if (idx >= 0) seleccionConfig.splice(idx, 1);
      else if (seleccionConfig.length < 8) seleccionConfig.push(p.id);
      else alert('Máximo 8 botones');
      pintarListaConfig();
    });
    cont.appendChild(d);
  });

  if (!cont.children.length) {
    cont.innerHTML = '<div style="padding:20px; text-align:center; color:var(--texto-suave); font-size:13px;">No se encontraron productos.</div>';
  }
}

function conTiempo(promesa, ms) {
  return new Promise(function (resolve, reject) {
    let terminado = false;
    const t = setTimeout(function () {
      if (terminado) return;
      terminado = true;
      reject(new Error('La cámara no respondió'));
    }, ms);
    promesa.then(function (v) {
      if (terminado) { v.getTracks().forEach(function (tr) { tr.stop(); }); return; }
      terminado = true;
      clearTimeout(t);
      resolve(v);
    }, function (e) {
      if (terminado) return;
      terminado = true;
      clearTimeout(t);
      reject(e);
    });
  });
}

function decodificarZxing() {
  if (typeof ZXing === 'undefined') return null;
  try {
    if (!lectorZxing) {
      const h = new Map();
      h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.CODE_128
      ]);
      h.set(ZXing.DecodeHintType.TRY_HARDER, true);
      lectorZxing = new ZXing.MultiFormatReader();
      lectorZxing.setHints(h);
    }
    const fuente = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
    return lectorZxing.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(fuente))).getText();
  } catch (e) { return null; }
}

async function procesarFrame() {
  ocupado = true;
  try {
    const video = $('video');
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) { ocupado = false; return; }
    const cw = Math.floor(vw * 0.9), ch = Math.floor(vh * 0.45);
    const sx = Math.floor((vw - cw) / 2), sy = Math.floor((vh - ch) / 2);
    const w = Math.min(cw, 960), h = Math.round(ch * w / cw);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    numFrame++;
    ctx.filter = (numFrame % 2 === 0) ? 'grayscale(1) contrast(1.5)' : 'none';
    ctx.drawImage(video, sx, sy, cw, ch, 0, 0, w, h);
    ctx.filter = 'none';

    let texto = null;
    if (detector) {
      try {
        const r = await detector.detect(canvas);
        if (r.length) texto = r[0].rawValue;
      } catch (e) { detector = null; }
    } else {
      texto = decodificarZxing();
    }

    if (texto && !pausaLectura) {
      const code = String(texto).trim();
      const p = productos.find(function (x) { return x.codigo === code; });
      if (p) {
        pausaLectura = true;
        productoEscaneado = p;
        if (navigator.vibrate) navigator.vibrate(80);
        $('codigoDetectado').textContent = code;
        $('nombreDetectado').textContent = p.nombre;
        const enCarrito = carrito.find(function (x) { return x.id === p.id; });
        const yaEnCarrito = enCarrito ? enCarrito.cantidad : 0;
        const maxPosible = p.stock - yaEnCarrito;
        $('escCantidad').value = 1;
        $('escCantidad').max = maxPosible;
        $('escStock').textContent = 'Disponible: ' + maxPosible;
        $('panelEscaneo').style.display = 'block';
        $('marco').className = 'marco ok';
      } else {
        $('infoCam').textContent = 'Código no reconocido: ' + code;
        pausaLectura = true;
        setTimeout(function () {
          pausaLectura = false;
          $('infoCam').textContent = 'Apunta al código de barras';
        }, 1500);
      }
    }
  } catch (e) {}
  ocupado = false;
}

function ciclo(ts) {
  requestAnimationFrame(ciclo);
  if (ocupado || ts - ultimoIntento < INTERVALO_MS) return;
  const video = $('video');
  if (!(video.readyState >= 2 && video.videoWidth)) return;
  ultimoIntento = ts;
  procesarFrame();
}

async function iniciarCamara() {
  if (stream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    mostrar('Este navegador no permite usar la cámara.', 'error');
    return;
  }
  const opciones = [
    { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
    { video: { facingMode: { ideal: 'environment' } }, audio: false },
    { video: true, audio: false }
  ];
  let ultimoError = null;
  for (let i = 0; i < opciones.length; i++) {
    try {
      stream = await conTiempo(navigator.mediaDevices.getUserMedia(opciones[i]), 10000);
      break;
    } catch (err) {
      ultimoError = err;
      if (err && err.name === 'NotAllowedError') break;
    }
  }
  if (!stream) {
    mostrar('No se pudo abrir la cámara: ' + (ultimoError && ultimoError.name ? ultimoError.name : 'Error'), 'error');
    $('modalCam').classList.remove('abierto');
    return;
  }
  const video = $('video');
  video.srcObject = stream;
  video.play().catch(function () {});
  const track = stream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) {
    track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
  }
  if (caps.zoom) {
    $('zoom').min = caps.zoom.min;
    $('zoom').max = caps.zoom.max;
    $('zoom').step = caps.zoom.step || 0.1;
    $('zoom').value = caps.zoom.min;
    $('zoomBox').style.display = 'block';
  } else {
    $('zoomBox').style.display = 'none';
  }
  if (!cicloActivo) { cicloActivo = true; requestAnimationFrame(ciclo); }
  if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {});
}

function detenerCamara() {
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
}

$('zoom').addEventListener('input', function () {
  if (stream) {
    const track = stream.getVideoTracks()[0];
    if (track) track.applyConstraints({ advanced: [{ zoom: Number($('zoom').value) }] }).catch(function () {});
  }
});

$('escMenos').addEventListener('click', function () {
  let v = Number($('escCantidad').value) || 1;
  if (v > 1) $('escCantidad').value = v - 1;
});
$('escMas').addEventListener('click', function () {
  let v = Number($('escCantidad').value) || 1;
  const max = Number($('escCantidad').max) || 999;
  if (v < max) $('escCantidad').value = v + 1;
});
$('escCancelar').addEventListener('click', function () {
  $('panelEscaneo').style.display = 'none';
  $('marco').className = 'marco';
  productoEscaneado = null;
  setTimeout(function () { pausaLectura = false; }, 800);
});
$('escAgregar').addEventListener('click', function () {
  if (!productoEscaneado) return;
  const cant = Number($('escCantidad').value) || 0;
  if (cant <= 0) { mostrar('Cantidad inválida', 'error'); return; }
  const p = productoEscaneado;
  agregarProductoAlCarrito(p, cant);
  $('panelEscaneo').style.display = 'none';
  $('marco').className = 'marco';
  productoEscaneado = null;
  setTimeout(function () { pausaLectura = false; }, 800);
});

function hayCarrito() { return carrito && carrito.length > 0; }

$('linkMenu').addEventListener('click', function (e) {
  e.preventDefault();
  if (hayCarrito()) {
    if (!confirm('⚠️ Tienes productos en el carrito sin cobrar.\n\nSi sales, se perderán.\n\n¿Seguro quieres salir?')) return;
  }
  location.href = 'index.html';
});

window.addEventListener('beforeunload', function (e) {
  if (hayCarrito()) {
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});
</script>
