<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ventas · ACEII</title>
<link rel="stylesheet" href="estilos.css">
<!-- Favicons -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B4DB1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A2540" media="(prefers-color-scheme: dark)">
<script src="comun.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<style>
  #total {
    font-size: 28px;
    color: var(--azul);
    font-weight: 700;
    margin: 12px 0;
    text-align: center;
    letter-spacing: -0.5px;
  }

  /* Contador carrito en header */
  .carrito-badge {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    color: #fff;
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    margin-left: 8px;
  }

  /* ===== Rápidos ===== */
  #zonaRapidos {
    max-width: 480px;
    margin: 12px auto 0;
    padding: 0;
  }
  #zonaRapidos .titulo-fila {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  #zonaRapidos .titulo-fila h4 {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--texto);
  }
  #zonaRapidos .titulo-fila button {
    padding: 6px 10px;
    margin: 0;
    font-size: 13px;
  }

  #botonesRapidos {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .btn-rapido {
    background: #fff;
    border: 2px solid var(--azul-suave);
    border-radius: var(--radio);
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s, border-color 0.15s;
    color: var(--texto);
    font-family: var(--fuente);
    min-height: 120px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  .btn-rapido:active {
    transform: scale(0.95);
    background: var(--azul-suave);
  }

  .btn-rapido .icono {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  .btn-rapido .icono svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .btn-rapido .icono img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 10px;
    display: block;
  }
  .btn-rapido .nom {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.15;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .btn-rapido .pre {
    font-size: 12px;
    color: var(--azul);
    font-weight: 700;
  }
  .btn-rapido.grupo {
    border-color: var(--naranja);
    background: #FFF8E8;
  }

  /* Toggle de rápidos */
  #btnToggleRapidos {
    background: var(--azul-suave);
    color: var(--azul);
    font-weight: 600;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 8px;
    border: none;
    transition: background 0.15s, color 0.15s;
  }
  #btnToggleRapidos:active {
    background: var(--azul-claro);
    color: #fff;
  }

  #botonesRapidos {
    animation: fadeInRapidos 0.2s ease-out;
  }
  @keyframes fadeInRapidos {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #panelVariantes {
    display: none;
    margin: 10px 0;
    padding: 12px;
    background: var(--superficie-2);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
  }
  #panelVariantes.abierto { display: block; }
  #panelVariantes .titulo-var {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-weight: 700;
    color: var(--texto);
  }
  #panelVariantes .titulo-var button {
    background: transparent;
    color: var(--texto-suave);
    font-size: 14px;
    padding: 4px 8px;
    margin: 0;
  }
  #listaVariantes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .btn-variante {
    background: #fff;
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 10px;
    text-align: left;
    cursor: pointer;
    font-family: var(--fuente);
    font-size: 13px;
    font-weight: 600;
    color: var(--texto);
    transition: transform 0.1s, background 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn-variante:active { transform: scale(0.95); }
  .btn-variante .icono-v {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .btn-variante .icono-v svg {
    width: 100%;
    height: 100%;
  }
  .btn-variante .icono-v img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
  }
  .btn-variante .texto-v {
    flex: 1;
    min-width: 0;
  }
  .btn-variante .nom-v { display: block; font-size: 13px; }
  .btn-variante .pre-v { display: block; font-size: 12px; color: var(--azul); font-weight: 700; margin-top: 2px; }

  /* Estado presionado (mantener para cobro rápido) */
  .btn-rapido.presionado,
  .btn-variante.presionado {
    background: var(--exito) !important;
    color: #fff !important;
    border-color: var(--exito) !important;
    transform: scale(1.05);
  }
  .btn-rapido.presionado .nom,
  .btn-rapido.presionado .pre,
  .btn-variante.presionado .nom-v,
  .btn-variante.presionado .pre-v {
    color: #fff !important;
  }


  /* ===== Buscador ===== */
  #resultados { max-height: 340px; overflow-y: auto; margin-top: 8px; }

  .resultado {
    padding: 14px 12px;
    border-bottom: 1px solid #E8ECF4;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .resultado:last-child { border-bottom: none; }
  .resultado:hover { background: var(--superficie-2); }
  .resultado.agotado { opacity: 0.5; cursor: not-allowed; }

  .resultado .info { flex: 1; min-width: 0; }
  .resultado .nombre {
    font-size: 15px;
    font-weight: 600;
    color: var(--texto);
    display: block;
    margin-bottom: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .resultado .meta {
    font-size: 12px;
    color: var(--texto-suave);
    display: block;
  }
  .resultado .meta .precio {
    color: var(--azul);
    font-weight: 700;
    font-size: 14px;
  }
  .resultado .stock {
    font-size: 12px;
    font-weight: 600;
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    margin-left: 4px;
  }
  .resultado .stock.stock-ok { background: #E0F7EC; color: var(--exito); }
  .resultado .stock.stock-bajo { background: #FFF4DC; color: var(--naranja); }
  .resultado .stock.stock-cero { background: #FFE5E5; color: var(--alerta); }

  .resultado .en-carrito {
    background: var(--azul);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 4px;
  }

  .sin-resultados {
    padding: 20px 12px;
    text-align: center;
    color: var(--texto-suave);
    font-size: 14px;
  }
  .sin-resultados button {
    margin-top: 10px;
    width: 100%;
  }

  /* ===== Carrito ===== */
  .item-carrito {
    border-bottom: 1px solid #E8ECF4;
    padding: 10px 0;
  }
  .item-carrito:last-child { border-bottom: none; }
  .item-fila {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .item-fila button {
    padding: 6px 12px;
    margin: 0;
    font-size: 14px;
    border-radius: 8px;
  }
  .item-fila .flecha {
    padding: 6px 10px;
    background: var(--azul-suave);
    color: var(--azul);
    font-weight: 700;
    min-width: 36px;
  }
  .item-detalle { display: none; padding: 8px 0 0 12px; }
  .item-detalle.abierto { display: block; }
  .unidad {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 14px;
    color: var(--texto-suave);
  }
  .unidad button {
    padding: 4px 10px;
    margin: 0;
    font-size: 13px;
    background: var(--superficie-2);
    border-radius: 8px;
  }

  /* ===== Panel cantidad ===== */
  #panelCantidad {
    margin-top: 10px;
    padding: 14px;
    background: var(--superficie-2);
    border-radius: var(--radio-sm);
    display: none;
  }
  #panelCantidad .acciones {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  #panelCantidad .acciones button {
    padding: 10px 16px;
    font-size: 18px;
    font-weight: 700;
    background: #fff;
    color: var(--azul);
    border-radius: 10px;
  }
  #panelCantidad input {
    width: 80px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    background: #fff;
  }

  /* ===== Botones de cobro ===== */
  .cobro-fila {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .cobro-fila button {
    flex: 1;
    margin: 0;
    padding: 18px 10px;
    font-size: 15px;
    font-weight: 700;
    border-radius: var(--radio);
    color: #fff;
    border: none;
  }
  #btnEfectivo { background: var(--exito); }
  #btnTransferencia { background: var(--azul); }
  .cobro-fila button:disabled { opacity: 0.4; }
  .cobro-fila button:active { transform: scale(0.98); }

  /* ===== Modal cámara ===== */
  #modalCam {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 100;
  }
  #modalCam.abierto { display: block; }
  #modalCam video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #modalCam .cerrar {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 10px 14px;
    background: var(--alerta);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    z-index: 2;
  }
  #modalCam .marco {
    position: absolute;
    left: 5%;
    top: 27.5%;
    width: 90%;
    height: 45%;
    border: 3px solid #00e676;
    border-radius: 10px;
    box-sizing: border-box;
    pointer-events: none;
  }
  #modalCam .marco.ok { border-color: #40c4ff; }
  #modalCam .info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
    background: rgba(0, 0, 0, 0.7);
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    color: #fff;
    font-size: 14px;
  }
  #modalCam #zoomBox {
    position: absolute;
    bottom: 80px;
    left: 20px;
    right: 20px;
    background: rgba(0, 0, 0, 0.6);
    padding: 8px;
    border-radius: 10px;
    display: none;
  }
  #modalCam #zoomBox label { color: #fff; font-size: 12px; display: block; margin-bottom: 4px; }
  #modalCam #btnReiniciarCam {
    position: absolute;
    bottom: 20px;
    left: 20px;
    padding: 10px 14px;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
  }

  #panelEscaneo {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    z-index: 3;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
  }
  #panelEscaneo .caja-conf {
    max-width: 480px;
    margin: 40px auto 0;
    background: #fff;
    border-radius: var(--radio);
    padding: 20px;
  }
  #panelEscaneo .label-chico {
    color: var(--texto-suave);
    font-size: 12px;
    margin-bottom: 4px;
  }
  #panelEscaneo #codigoDetectado {
    color: var(--azul);
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    word-break: break-all;
  }
  #panelEscaneo #nombreDetectado {
    color: var(--texto);
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  /* ===== Modal configuración rápidos ===== */
  #modalConfig {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
  }
  #modalConfig.abierto { display: block; }
  #modalConfig .contenido {
    max-width: 480px;
    margin: 20px auto;
    background: #fff;
    border-radius: 16px;
    padding: 20px;
  }

  /* ===== Modal cobro rápido (tap largo) ===== */
  #modalCobro {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 300;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
  }
  #modalCobro.abierto { display: block; }
  #modalCobro .contenido {
    max-width: 420px;
    margin: 40px auto 0;
    background: #fff;
    border-radius: var(--radio);
    padding: 22px;
    box-shadow: var(--sombra-fuerte);
  }
  #modalCobro .titulo {
    font-size: 18px;
    font-weight: 700;
    color: var(--texto);
    text-align: center;
    margin-bottom: 6px;
  }
  #modalCobro .prod {
    font-size: 14px;
    color: var(--texto-suave);
    text-align: center;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  #modalCobro .prod .icono-mc {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 10px;
    background: var(--superficie-2);
  }
  #modalCobro .prod .icono-mc svg {
    width: 100%;
    height: 100%;
  }
  #modalCobro .prod .icono-mc img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #modalCobro .total-box {
    background: var(--azul-suave);
    border-radius: var(--radio-sm);
    padding: 14px;
    text-align: center;
    margin-bottom: 16px;
  }
  #modalCobro .total-box .lbl {
    font-size: 12px;
    color: var(--texto-suave);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #modalCobro .total-box .val {
    font-size: 28px;
    font-weight: 700;
    color: var(--azul);
    letter-spacing: -0.5px;
  }
  #modalCobro .pago-fila {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  #modalCobro .pago-fila button {
    flex: 1;
    margin: 0;
    padding: 16px 10px;
    font-size: 15px;
    font-weight: 700;
    border-radius: var(--radio-sm);
    color: #fff;
    border: none;
  }
  #modalCobro #mcEfectivo { background: var(--exito); }
  #modalCobro #mcTransferencia { background: var(--azul); }
  #modalCobro .seccion-cambio {
    display: none;
    margin-bottom: 14px;
  }
  #modalCobro .seccion-cambio.visible { display: block; }
  #modalCobro .seccion-cambio label {
    font-size: 13px;
    color: var(--texto-suave);
    margin-bottom: 6px;
  }
  #modalCobro .cambio-fila {
    display: flex;
    gap: 6px;
  }
  #modalCobro .cambio-fila input {
    flex: 1;
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
  }
  #modalCobro .cambio-fila button {
    margin: 0;
    padding: 12px 14px;
    font-size: 13px;
    font-weight: 700;
    background: var(--superficie-2);
    color: var(--azul);
    border-radius: 8px;
  }
  #modalCobro .cambio-calc {
    font-size: 14px;
    color: var(--exito);
    font-weight: 700;
    text-align: center;
    margin-top: 8px;
    min-height: 20px;
  }
  #modalCobro .acciones {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  #modalCobro .acciones button {
    flex: 1;
    margin: 0;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    border-radius: var(--radio-sm);
  }
  #modalCobro #mcConfirmar {
    background: var(--azul);
    color: #fff;
  }
  #modalCobro #mcConfirmar:disabled { opacity: 0.4; }
  #modalCobro #mcCancelar {
    background: var(--superficie-2);
    color: var(--texto-suave);
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-contenido">
    <img src="logo_ACEII.png" alt="ACEII" class="app-header-logo">
    <div class="app-header-texto">
      <div class="app-header-titulo">Ventas <span class="carrito-badge" id="badgeCarrito" style="display:none;">🛒 0</span></div>
      <div class="app-header-sub">
        <a href="#" id="linkMenu" style="color:rgba(255,255,255,0.9); text-decoration:underline;">← Volver al menú</a>
      </div>
    </div>
  </div>
</header>

<div id="estado">Cargando...</div>

<div class="caja">
  <label>Buscar producto</label>
  <input type="text" id="buscar" placeholder="Escribe 2 letras o más..." autocomplete="off">
  <button class="main" id="btnCam" style="width:100%; margin-top:8px;">📷 Escanear con cámara</button>
  <div id="resultados"></div>

  <div id="panelCantidad">
    <div id="panelNombre" style="font-weight:700; margin-bottom:10px; color:var(--texto);"></div>
    <div class="acciones">
      <button id="cantMenos">−</button>
      <input type="number" id="cantidadVenta" value="1" min="1" step="1">
      <button id="cantMas">+</button>
      <span id="cantStock" style="color:var(--texto-suave); font-size:12px;"></span>
    </div>
    <button class="main" id="btnAgregarCantidad" style="width:100%;">Agregar al carrito</button>
    <button id="btnCancelarCantidad" style="width:100%; margin-top:6px;">Cancelar</button>
  </div>
</div>

<div class="caja">
  <div id="zonaRapidos">
    <div class="titulo-fila">
      <h4>⚡ Rápidos <small style="font-weight:400;color:var(--texto-claro);font-size:11px;">(mantén para cobrar)</small></h4>
      <div style="display:flex; gap:6px;">
        <button id="btnToggleRapidos" type="button">▼ Mostrar</button>
        <button id="btnConfigurar" type="button">⚙️</button>
      </div>
    </div>
    <div id="botonesRapidos" style="display:none;"></div>
  </div>

  <div id="panelVariantes">
    <div class="titulo-var">
      <span id="tituloVariantes">Elige una opción</span>
      <button id="btnCerrarVariantes" type="button">✕</button>
    </div>
    <div id="listaVariantes"></div>
  </div>
</div>

<div class="caja">
  <h4 style="margin:0 0 12px; font-size:15px; font-weight:700;">Carrito</h4>
  <div id="carrito" style="color:var(--texto-suave); font-size:14px;">(vacío)</div>
  <div id="total">Total: $0</div>

  <label>Observaciones (opcional)</label>
  <input type="text" id="obs" maxlength="200">

  <div class="cobro-fila">
    <button id="btnEfectivo" disabled>💵 EFECTIVO</button>
    <button id="btnTransferencia" disabled>📱 TRANSFERENCIA</button>
  </div>

  <button id="btnVaciar" style="width:100%; margin-top:10px;">🗑️ Vaciar carrito</button>
</div>

<!-- Modal de cámara -->
<div id="modalCam">
  <button class="cerrar" id="btnCerrarCam">Cerrar</button>
  <video id="video" playsinline muted autoplay></video>
  <div class="marco" id="marco"></div>
  <div class="info" id="infoCam">Apunta al código de barras</div>
  <div id="zoomBox">
    <label>Zoom</label>
    <input type="range" id="zoom" style="width:100%">

function norm_(s) {
  return String(s === null || s === undefined ? '' : s).trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function svgPorCategoria(p) {
  const n = norm_(p.nombre || '');
  const c = norm_(p.categoria || '');

  if (c.indexOf('empanada') >= 0 || n.indexOf('empanada') >= 0) return SVG_ICONOS.empanada;
  if (c.indexOf('combo') >= 0 || n.indexOf('combo') >= 0) return SVG_ICONOS.combo;
  if (n.indexOf('jugo') >= 0 || n.indexOf('hit') >= 0 || n.indexOf('malta') >= 0) return SVG_ICONOS.jugo;
  if (n.indexOf('agua') >= 0) return SVG_ICONOS.agua;
  if (n.indexOf('gaseosa') >= 0 || n.indexOf('coca') >= 0 || n.indexOf('pepsi') >= 0 || n.indexOf('cola') >= 0 || n.indexOf('sprite') >= 0 || n.indexOf('fanta') >= 0) return SVG_ICONOS.gaseosa;
  if (c.indexOf('bebida') >= 0) return SVG_ICONOS.gaseosa;
  if (c.indexOf('pasaboca') >= 0 || n.indexOf('papas') >= 0 || n.indexOf('snack') >= 0) return SVG_ICONOS.snack;
  if (c.indexOf('dulce') >= 0 || c.indexOf('galleta') >= 0 || c.indexOf('confiteria') >= 0) return SVG_ICONOS.dulce;
  if (c.indexOf('preparado') >= 0 || c.indexOf('instantanea') >= 0) return SVG_ICONOS.preparado;
  if (c.indexOf('lacteo') >= 0 || c.indexOf('avena') >= 0) return SVG_ICONOS.lacteo;

  return SVG_ICONOS.default;
}

function iconoParaProducto(p) {
  if (p && p.imagen_url) {
    return '<img src="' + p.imagen_url + '" alt="" loading="lazy">';
  }
  return svgPorCategoria(p || {});
}

function iconoParaGrupo(nombreCategoria) {
  // Para grupos usamos el SVG según el nombre de la categoría
  return svgPorCategoria({ nombre: '', categoria: nombreCategoria });
}

// =====================================================================
// Helper: detecta si fue un tap o un scroll
// =====================================================================
const TAP_THRESHOLD = 10;

function crearDetectorTap(elemento, onTap, onLongPress) {
  let startX = 0, startY = 0;
  let timer = null;
  let fueLargo = false;
  let touchActivo = false;
  let clickReciente = false;

  elemento.addEventListener('touchstart', function (e) {
    const touch = e.touches[0];
    startX = touch.clientX;
    startY = touch.clientY;
    touchActivo = true;
    fueLargo = false;

    if (onLongPress) {
      timer = setTimeout(function () {
        fueLargo = true;
        elemento.classList.add('presionado');
        if (navigator.vibrate) navigator.vibrate(50);
      }, 800);
    }
  }, { passive: true });

  elemento.addEventListener('touchmove', function (e) {
    const touch = e.touches[0];
    const dx = Math.abs(touch.clientX - startX);
    const dy = Math.abs(touch.clientY - startY);
    if (dx > TAP_THRESHOLD || dy > TAP_THRESHOLD) {
      clearTimeout(timer);
      fueLargo = false;
      touchActivo = false;
      elemento.classList.remove('presionado');
    }
  }, { passive: true });

  elemento.addEventListener('touchend', function (e) {
    clearTimeout(timer);
    elemento.classList.remove('presionado');

    if (!touchActivo) return;
    touchActivo = false;

    const touch = e.changedTouches[0];
    const dx = Math.abs(touch.clientX - startX);
    const dy = Math.abs(touch.clientY - startY);
    if (dx > TAP_THRESHOLD || dy > TAP_THRESHOLD) return;

    clickReciente = true;
    setTimeout(function () { clickReciente = false; }, 500);

    if (fueLargo && onLongPress) {
      onLongPress();
    } else {
      onTap();
    }
  });

  elemento.addEventListener('touchcancel', function () {
    clearTimeout(timer);
    touchActivo = false;
    fueLargo = false;
    elemento.classList.remove('presionado');
  });

  elemento.addEventListener('click', function () {
    if (clickReciente) return;
    onTap();
  });
}

// ---------- Arranque ----------
(async function () {
  const ok = await exigirTurnoCajaAbierto();
  if (!ok) return;
  await cargarProductos();
  cargarRapidosGuardados();
  cargarCarritoGuardado();
  pintarRapidos();
  pintarCarrito();
  pintarUltimoMedio();
})();

async function cargarProductos() {
  mostrar('Cargando productos...', 'aviso');
  try {
    const r = await jsonp({ accion: 'productos_venta' }, 25000);
    if (r && r.error === 'Token inválido') { borrarToken(); location.href = 'index.html'; return; }
    if (!r || !r.ok) throw new Error(r && r.error ? r.error : 'respuesta vacía');
    productos = r.items;
    mostrar('Listo para vender');
  } catch (err) {
    mostrar('No se pudieron cargar los productos: ' + err.message, 'error');
  }
}

function pintarUltimoMedio() {
  try {
    const m = localStorage.getItem('caf_ultimo_medio');
    if (m === 'Efectivo' || m === 'Transferencia') ultimoMedioPago = m;
  } catch (e) {}
}

// ---------- Buscador ----------
function pintarResultados() {
  const q = norm($('buscar').value);
  const cont = $('resultados');
  cont.innerHTML = '';
  $('panelCantidad').style.display = 'none';
  if (q.length < 2) return;

  let n = 0;
  const coincidencias = [];
  productos.forEach(function (p) {
    if (norm(p.id + ' ' + p.nombre).indexOf(q) < 0) return;
    coincidencias.push(p);
  });

  coincidencias.slice(0, 8).forEach(function (p) {
    n++;
    const d = document.createElement('div');
    d.className = 'resultado' + (p.stock <= 0 ? ' agotado' : '');

    let stockClase = 'stock-ok';
    if (p.stock <= 0) stockClase = 'stock-cero';
    else if (p.stock <= 5) stockClase = 'stock-bajo';

    const enCarrito = carrito.find(function (x) { return x.id === p.id; });
    const cantEnCarrito = enCarrito ? enCarrito.cantidad : 0;

    d.innerHTML =
      '<div class="info">' +
        '<span class="nombre">' + p.nombre + '</span>' +
        '<span class="meta">' +
          '<span class="precio">' + fmt(p.precio) + '</span>' +
          ' · ' + p.id +
        '</span>' +
      '</div>' +
      '<div style="text-align:right;">' +
        '<span class="stock ' + stockClase + '">' +
          (p.stock <= 0 ? 'Agotado' : p.stock + ' disp.') +
        '</span>' +
        (cantEnCarrito ? '<br><span class="en-carrito">' + cantEnCarrito + ' en carrito</span>' : '') +
      '</div>';

    if (p.stock > 0) {
      crearDetectorTap(d, function () { mostrarPanelCantidad(p); }, null);
    }
    cont.appendChild(d);
  });

  if (!n) {
    const d = document.createElement('div');
    d.className = 'sin-resultados';
    d.innerHTML =
      'No encontramos "' + $('buscar').value + '".<br>' +
      'Prueba con otra palabra o escanea el código.<br>' +
      '<button class="main" id="btnCamDesdeSinResultados">📷 Escanear con cámara</button>';
    cont.appendChild(d);
    const btn = document.getElementById('btnCamDesdeSinResultados');
    if (btn) {
      btn.addEventListener('click', function () {
        $('modalCam').classList.add('abierto');
        iniciarCamara();
      });
    }
  }
}

function mostrarPanelCantidad(p) {
  productoPendiente = p;
  const enCarrito = carrito.find(function (x) { return x.id === p.id; });
  const yaEnCarrito = enCarrito ? enCarrito.cantidad : 0;
  const maxPosible = p.stock - yaEnCarrito;
  $('panelNombre').textContent = p.nombre + ' — ' + fmt(p.precio);
  $('cantidadVenta').value = 1;
  $('cantidadVenta').max = maxPosible;
  $('cantStock').textContent = 'Disponible: ' + maxPosible;
  $('panelCantidad').style.display = 'block';
  $('cantidadVenta').focus();
}

$('cantMenos').addEventListener('click', function () {
  let v = Number($('cantidadVenta').value) || 1;
  if (v > 1) $('cantidadVenta').value = v - 1;
});
$('cantMas').addEventListener('click', function () {
  let v = Number($('cantidadVenta').value) || 1;
  const max = Number($('cantidadVenta').max) || 999;
  if (v < max) $('cantidadVenta').value = v + 1;
});
$('btnCancelarCantidad').addEventListener('click', function () {
  $('panelCantidad').style.display = 'none';
  productoPendiente = null;
});
$('btnAgregarCantidad').addEventListener('click', function () {
  if (!productoPendiente) return;
  const cant = Number($('cantidadVenta').value) || 0;
  if (cant <= 0) { mostrar('Cantidad inválida', 'error'); return; }
  const p = productoPendiente;
  agregarProductoAlCarrito(p, cant);
  $('panelCantidad').style.display = 'none';
  productoPendiente = null;
  $('buscar').value = '';
  $('resultados').innerHTML = '';
  $('buscar').focus();
});

$('buscar').addEventListener('input', pintarResultados);

// ---------- Rápidos ----------
function cargarRapidosGuardados() {
  try {
    const arr = JSON.parse(localStorage.getItem(RAPIDOS_KEY) || 'null');
    if (Array.isArray(arr) && arr.length > 0) {
      const validos = arr.filter(function (rid) {
        if (rid.startsWith('GRUPO_')) {
          const cat = rid.replace('GRUPO_', '');
          return productos.some(function (p) { return norm_(p.categoria) === norm_(cat); });
        }
        return productos.some(function (p) { return p.id === rid; });
      });
      if (validos.length > 0) {
        rapidos = validos;
        return;
      }
    }
  } catch (e) {}

  const defaults = [];
  const conteoCategorias = {};
  productos.forEach(function (p) {
    const cat = p.categoria || '';
    if (!cat) return;
    conteoCategorias[cat] = (conteoCategorias[cat] || 0) + 1;
  });

  ['Empanadas', 'Preparados', 'Combos'].forEach(function (cat) {
    if (conteoCategorias[cat] >= 2) defaults.push('GRUPO_' + cat);
  });

  ['chocoramo', 'gansito', 'jugo hit', 'agua pequeña'].forEach(function (nombre) {
    if (defaults.length >= 6) return;
    const p = productos.find(function (x) {
      return norm_(x.nombre).indexOf(nombre) >= 0 && defaults.indexOf(x.id) < 0;
    });
    if (p) defaults.push(p.id);
  });

  rapidos = defaults.slice(0, 6);
}

function guardarRapidos() {
  try { localStorage.setItem(RAPIDOS_KEY, JSON.stringify(rapidos)); } catch (e) {}
}

// =====================================================================
// Sistema de tap corto / tap largo
// =====================================================================
function crearBotonRapido(p, esGrupo, itemsGrupo) {
  const btn = document.createElement('button');
  btn.className = 'btn-rapido' + (esGrupo ? ' grupo' : '');

  if (esGrupo) {
    btn.innerHTML =
      '<span class="icono">' + iconoParaGrupo(p) + '</span>' +
      '<span class="nom">' + p + '</span>' +
      '<span class="pre">' + itemsGrupo.length + ' opciones</span>';
  } else {
    btn.innerHTML =
      '<span class="icono">' + iconoParaProducto(p) + '</span>' +
      '<span class="nom">' + p.nombre + '</span>' +
      '<span class="pre">' + fmt(p.precio) + '</span>';
  }

  const onTap = function () {
    if (esGrupo) {
      mostrarVariantes(p, itemsGrupo);
    } else {
      agregarProductoAlCarrito(p, 1);
    }
  };

  const onLongPress = function () {
    if (esGrupo) {
      mostrarVariantes(p, itemsGrupo);
    } else {
      if (navigator.vibrate) navigator.vibrate(80);
      abrirCobroRapido(p, 1);
    }
  };

  crearDetectorTap(btn, onTap, onLongPress);
  return btn;
}

function pintarRapidos() {
  const cont = $('botonesRapidos');
  cont.innerHTML = '';

  if (rapidos.length === 0) {
    cont.innerHTML = '<div style="grid-column: span 3; text-align:center; color:var(--texto-suave); font-size:13px; padding:20px;">Sin botones rápidos. Toca ⚙️ para configurarlos.</div>';
    return;
  }

  rapidos.forEach(function (rid) {
    if (rid.startsWith('GRUPO_')) {
      const nombreGrupo = rid.replace('GRUPO_', '');
      const itemsGrupo = productos.filter(function (p) {
        return norm_(p.categoria) === norm_(nombreGrupo);
      });
      if (itemsGrupo.length === 0) return;
      cont.appendChild(crearBotonRapido(nombreGrupo, true, itemsGrupo));
      return;
    }

    const p = productos.find(function (x) { return x.id === rid; });
    if (!p) return;
    cont.appendChild(crearBotonRapido(p, false, null));
  });
}

function mostrarVariantes(nombre, items) {
  $('tituloVariantes').textContent = nombre;
  const cont = $('listaVariantes');
  cont.innerHTML = '';

  items.forEach(function (p) {
    const btn = document.createElement('button');
    btn.className = 'btn-variante';
    btn.innerHTML =
      '<span class="icono-v">' + iconoParaProducto(p) + '</span>' +
      '<span class="texto-v">' +
        '<span class="nom-v">' + p.nombre + '</span>' +
        '<span class="pre-v">' + fmt(p.precio) + '</span>' +
      '</span>';

    const onTap = function () {
      agregarProductoAlCarrito(p, 1);
      $('panelVariantes').classList.remove('abierto');
    };

    const onLongPress = function () {
      if (navigator.vibrate) navigator.vibrate(80);
      $('panelVariantes').classList.remove('abierto');
      abrirCobroRapido(p, 1);
    };

    crearDetectorTap(btn, onTap, onLongPress);
    cont.appendChild(btn);
  });

  $('panelVariantes').classList.add('abierto');
  $('panelVariantes').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

});

// ---------- Agregar al carrito ----------
function agregarProductoAlCarrito(p, cant) {
  const enCarrito = carrito.find(function (x) { return x.id === p.id; });
  const yaEnCarrito = enCarrito ? enCarrito.cantidad : 0;
  if (yaEnCarrito + cant > p.stock) {
    mostrar('Solo hay ' + (p.stock - yaEnCarrito) + ' disponibles de ' + p.nombre, 'error');
    return;
  }
  if (enCarrito) {
    enCarrito.cantidad += cant;
  } else {
    carrito.push({ id: p.id, nombre: p.nombre, precio: p.precio, cantidad: cant, expandido: false, stock: p.stock });
  }
  if (navigator.vibrate) navigator.vibrate(40);
  pintarCarrito();
  guardarCarrito();
}

// ---------- Carrito ----------
function pintarCarrito() {
  const c = $('carrito');
  const badge = $('badgeCarrito');

  if (!carrito.length) {
    c.textContent = '(vacío)';
    c.style.color = 'var(--texto-suave)';
    $('total').textContent = 'Total: $0';
    $('btnEfectivo').disabled = true;
    $('btnTransferencia').disabled = true;
    badge.style.display = 'none';
    return;
  }
  c.innerHTML = '';
  c.style.color = 'var(--texto)';
  let total = 0;
  let totalItems = 0;
  carrito.forEach(function (it, i) {
    total += it.precio * it.cantidad;
    totalItems += it.cantidad;
    const cont = document.createElement('div');
    cont.className = 'item-carrito';

    const fila = document.createElement('div');
    fila.className = 'item-fila';

    const flecha = document.createElement('button');
    flecha.className = 'flecha';
    flecha.textContent = it.expandido ? '▼' : '▶';
    flecha.addEventListener('click', function () {
      it.expandido = !it.expandido;
      pintarCarrito();
    });

    const info = document.createElement('span');
    info.style.flex = '1';
    info.innerHTML = '<b>' + it.cantidad + '×</b> ' + it.nombre + '<br><small style="color:var(--texto-suave);">' + fmt(it.precio * it.cantidad) + '</small>';

    const quitar = document.createElement('button');
    quitar.textContent = '✕';
    quitar.style.background = '#FFE5E5';
    quitar.style.color = 'var(--alerta)';
    quitar.addEventListener('click', function () {
      carrito.splice(i, 1);
      pintarCarrito();
      guardarCarrito();
    });

    fila.appendChild(flecha);
    fila.appendChild(info);
    fila.appendChild(quitar);
    cont.appendChild(fila);

    if (it.expandido) {
      const det = document.createElement('div');
      det.className = 'item-detalle abierto';
      for (let u = 1; u <= it.cantidad; u++) {
        const fila2 = document.createElement('div');
        fila2.className = 'unidad';
        const etiqueta = document.createElement('span');
        etiqueta.textContent = 'Unidad ' + u;
        const menos = document.createElement('button');
        menos.textContent = '−';
        menos.addEventListener('click', function () {
          if (it.cantidad > 1) {
            it.cantidad--;
          } else {
            carrito.splice(i, 1);
          }
          pintarCarrito();
          guardarCarrito();
        });
        fila2.appendChild(etiqueta);
        fila2.appendChild(menos);
        det.appendChild(fila2);
      }
      cont.appendChild(det);
    }
    c.appendChild(cont);
  });
  $('total').textContent = 'Total: ' + fmt(total);
  $('btnEfectivo').disabled = false;
  $('btnTransferencia').disabled = false;
  badge.textContent = '🛒 ' + totalItems;
  badge.style.display = 'inline-block';
}

function guardarCarrito() {
  try { localStorage.setItem(CARRITO_KEY, JSON.stringify(carrito)); } catch (e) {}
}
function cargarCarritoGuardado() {
  try {
    const arr = JSON.parse(localStorage.getItem(CARRITO_KEY) || '[]');
    if (Array.isArray(arr)) carrito = arr;
  } catch (e) { carrito = []; }
}

$('btnVaciar').addEventListener('click', function () {
  if (carrito.length && !confirm('¿Vaciar el carrito?')) return;
  carrito = [];
  pintarCarrito();
  guardarCarrito();
});

// ---------- Cobro normal ----------
function nuevoIdVenta() {
  const d = new Date();
  const p = function (n) { return ('0' + n).slice(-2); };
  return 'VEN-' + String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
}

async function cobrar(medio, opts) {
  opts = opts || {};
  if (!carrito.length) return;
  const u = getUsuarioTurno();
  if (!u) { mostrar('No hay turno iniciado', 'error'); return; }

  let cambio = null;
  if (medio === 'Efectivo' && !opts.saltarCambio) {
    const total = carrito.reduce(function (s, it) { return s + it.precio * it.cantidad; }, 0);
    const resp = prompt('Cliente paga con efectivo.\nTotal: ' + fmt(total) + '\n\n¿Con cuánto paga? (deja vacío o escribe "exacto"):', '');
    if (resp === null) return;
    if (resp.trim() !== '' && norm_(resp.trim()) !== 'exacto') {
      const recibido = Number(resp.trim());
      if (!isNaN(recibido) && recibido >= total) {
        cambio = recibido - total;
      }
    }
  }

  const idVenta = nuevoIdVenta();
  $('btnEfectivo').disabled = true;
  $('btnTransferencia').disabled = true;
  mostrar('Guardando venta...', 'aviso');

  try {
    const r = await post({
      accion: 'venta',
      id_venta: idVenta,
      id_usuario: u.id,
      id_turno: (getTurnoActual() ? getTurnoActual().id : ''),
      medio_pago: medio,
      observaciones: $('obs').value.trim(),
      items: carrito.map(function (it) { return { id_producto: it.id, cantidad: it.cantidad }; })
    });
    if (r.ok) {
      let msj = '✓ ' + medio + ' · ' + r.lineas + ' línea(s)';
      if (cambio !== null) msj += ' · Cambio: ' + fmt(cambio);
      mostrar(msj, 'ok');
      if (navigator.vibrate) navigator.vibrate(200);
      if (cambio !== null && cambio > 0) alert('Cambio: ' + fmt(cambio));
      try { localStorage.setItem('caf_ultimo_medio', medio); } catch (e) {}
      ultimoMedioPago = medio;
      carrito = [];
      $('obs').value = '';
      pintarCarrito();
      guardarCarrito();
    } else if (r.error === 'Token inválido') {
      borrarToken(); location.href = 'index.html';
    } else {
      mostrar(r.error || 'Error desconocido', 'error');
      $('btnEfectivo').disabled = false;
      $('btnTransferencia').disabled = false;
    }
  } catch (err) {
    mostrar('Sin conexión. Revisa internet.', 'error');
    $('btnEfectivo').disabled = false;
    $('btnTransferencia').disabled = false;
  }
}

$('btnEfectivo').addEventListener('click', function () { cobrar('Efectivo'); });
$('btnTransferencia').addEventListener('click', function () { cobrar('Transferencia'); });

// ---------- Cobro rápido (tap largo) ----------
let mcProducto = null;
let mcCantidad = 1;
let mcMedio = null;
let mcTotal = 0;

function abrirCobroRapido(p, cant) {
  mcProducto = p;
  mcCantidad = cant;
  mcMedio = null;
  mcTotal = p.precio * cant;

  $('mcProducto').innerHTML =
    '<span class="icono-mc">' + iconoParaProducto(p) + '</span>' +
    '<span>' + cant + '× ' + p.nombre + '</span>';
  $('mcTotal').textContent = fmt(mcTotal);
  $('mcPago').value = '';
  $('mcCambioCalc').textContent = '';
  $('mcSeccionCambio').classList.remove('visible');
  $('mcConfirmar').disabled = true;
  $('mcConfirmar').textContent = 'Confirmar cobro';

  $('modalCobro').classList.add('abierto');
}

$('mcEfectivo').addEventListener('click', function () {
  mcMedio = 'Efectivo';
  $('mcEfectivo').style.background = 'var(--exito)';
  $('mcEfectivo').style.opacity = '1';
  $('mcTransferencia').style.opacity = '0.4';
  $('mcSeccionCambio').classList.add('visible');
  $('mcConfirmar').disabled = false;
  recalcularCambioMC();
});

$('mcTransferencia').addEventListener('click', function () {
  mcMedio = 'Transferencia';
  $('mcTransferencia').style.background = 'var(--azul)';
  $('mcTransferencia').style.opacity = '1';
  $('mcEfectivo').style.opacity = '0.4';
  $('mcSeccionCambio').classList.remove('visible');
  $('mcConfirmar').disabled = false;
  $('mcCambioCalc').textContent = '';
});

$('mcExacto').addEventListener('click', function () {
  $('mcPago').value = mcTotal;
  recalcularCambioMC();
});

$('mcPago').addEventListener('input', recalcularCambioMC);

function recalcularCambioMC() {
  const pago = Number($('mcPago').value) || 0;
  if (pago <= 0) {
    $('mcCambioCalc').textContent = '';
    return;
  }
  if (pago < mcTotal) {
    $('mcCambioCalc').style.color = 'var(--alerta)';
    $('mcCambioCalc').textContent = '⚠️ Falta ' + fmt(mcTotal - pago);
  } else {
    const cambio = pago - mcTotal;
    $('mcCambioCalc').style.color = 'var(--exito)';
    $('mcCambioCalc').textContent = 'Cambio: ' + fmt(cambio);
  }
}

$('mcCancelar').addEventListener('click', function () {
  $('modalCobro').classList.remove('abierto');
});

$('mcConfirmar').addEventListener('click', async function () {
  if (!mcProducto || !mcMedio) return;

  const idVenta = nuevoIdVenta();
  $('mcConfirmar').disabled = true;
  $('mcConfirmar').textContent = 'Guardando...';

  try {
    const r = await post({
      accion: 'venta',
      id_venta: idVenta,
      id_usuario: getUsuarioTurno().id,
      id_turno: (getTurnoActual() ? getTurnoActual().id : ''),
      medio_pago: mcMedio,
      observaciones: '',
      items: [{ id_producto: mcProducto.id, cantidad: mcCantidad }]
    });
    if (r.ok) {
      let msj = '✓ Cobrado ' + mcCantidad + '× ' + mcProducto.nombre + ' · ' + fmt(mcTotal);
      if (mcMedio === 'Efectivo' && Number($('mcPago').value) > 0) {
        const cambio = Number($('mcPago').value) - mcTotal;
        if (cambio > 0) msj += ' · Cambio: ' + fmt(cambio);
      }
      mostrar(msj, 'ok');
      if (navigator.vibrate) navigator.vibrate(200);
      try { localStorage.setItem('caf_ultimo_medio', mcMedio); } catch (e) {}
      const p = productos.find(function (x) { return x.id === mcProducto.id; });
      if (p) p.stock -= mcCantidad;
      $('modalCobro').classList.remove('abierto');
      mcProducto = null;
    } else if (r.error === 'Token inválido') {
      borrarToken(); location.href = 'index.html';
    } else {
      mostrar(r.error || 'Error desconocido', 'error');
      $('mcConfirmar').disabled = false;
      $('mcConfirmar').textContent = 'Confirmar cobro';
    }
  } catch (err) {
    mostrar('Sin conexión. Revisa internet.', 'error');
    $('mcConfirmar').disabled = false;
    $('mcConfirmar').textContent = 'Confirmar cobro';
  }
});

function pintarListaConfig() {
  const cont = $('listaConfig');
  const q = norm_($('buscarConfig').value);
  cont.innerHTML = '';

  const conteoCategorias = {};
  productos.forEach(function (p) {
    const cat = p.categoria || '';
    if (!cat) return;
    conteoCategorias[cat] = (conteoCategorias[cat] || 0) + 1;
  });

  Object.keys(conteoCategorias).forEach(function (cat) {
    if (conteoCategorias[cat] < 2) return;
    if (q && norm_(cat).indexOf(q) < 0) return;
    const grupoId = 'GRUPO_' + cat;
    const sel = seleccionConfig.indexOf(grupoId) >= 0;
    const d = document.createElement('div');
    d.style.cssText = 'padding:10px; border-bottom:1px solid #E8ECF4; cursor:pointer; display:flex; justify-content:space-between; align-items:center;' + (sel ? ' background:#E3ECFF;' : '');
    d.innerHTML = '<div><strong>📁 ' + cat + '</strong><br><small style="color:var(--texto-suave);">' + conteoCategorias[cat] + ' opciones</small></div>' + (sel ? '✓' : '○');
    d.addEventListener('click', function () {
      const idx = seleccionConfig.indexOf(grupoId);
      if (idx >= 0) seleccionConfig.splice(idx, 1);
      else if (seleccionConfig.length < 6) seleccionConfig.push(grupoId);
      else alert('Máximo 6 botones');
      pintarListaConfig();
    });
    cont.appendChild(d);
  });

  const filtrados = productos.filter(function (p) {
    if (q && norm_(p.id + ' ' + p.nombre).indexOf(q) < 0) return false;
    return true;
  }).sort(function (a, b) { return a.nombre.localeCompare(b.nombre); });

  filtrados.slice(0, 50).forEach(function (p) {
    const d = document.createElement('div');
    const sel = seleccionConfig.indexOf(p.id) >= 0;
    d.style.cssText = 'padding:10px; border-bottom:1px solid #E8ECF4; cursor:pointer; display:flex; justify-content:space-between; align-items:center;' + (sel ? ' background:#E3ECFF;' : '');
    d.innerHTML = '<div><strong>' + p.nombre + '</strong><br><small style="color:var(--texto-suave);">' + p.id + ' · ' + fmt(p.precio) + '</small></div>' + (sel ? '✓' : '○');
    d.addEventListener('click', function () {
      const idx = seleccionConfig.indexOf(p.id);
      if (idx >= 0) seleccionConfig.splice(idx, 1);
      else if (seleccionConfig.length < 6) seleccionConfig.push(p.id);
      else alert('Máximo 6 botones');
      pintarListaConfig();
    });
    cont.appendChild(d);
  });
}

function conTiempo(promesa, ms) {
  return new Promise(function (resolve, reject) {
    let terminado = false;
    const t = setTimeout(function () {
      if (terminado) return;
      terminado = true;
      reject(new Error('La cámara no respondió'));
    }, ms);
    promesa.then(function (v) {
      if (terminado) { v.getTracks().forEach(function (tr) { tr.stop(); }); return; }
      terminado = true;
      clearTimeout(t);
      resolve(v);
    }, function (e) {
      if (terminado) return;
      terminado = true;
      clearTimeout(t);
      reject(e);
    });
  });
}

function decodificarZxing() {
  if (typeof ZXing === 'undefined') return null;
  try {
    if (!lectorZxing) {
      const h = new Map();
      h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.CODE_128
      ]);
      h.set(ZXing.DecodeHintType.TRY_HARDER, true);
      lectorZxing = new ZXing.MultiFormatReader();
      lectorZxing.setHints(h);
    }
    const fuente = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
    return lectorZxing.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(fuente))).getText();
  } catch (e) { return null; }
}

async function procesarFrame() {
  ocupado = true;
  try {
    const video = $('video');
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) { ocupado = false; return; }
    const cw = Math.floor(vw * 0.9), ch = Math.floor(vh * 0.45);
    const sx = Math.floor((vw - cw) / 2), sy = Math.floor((vh - ch) / 2);
    const w = Math.min(cw, 960), h = Math.round(ch * w / cw);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    numFrame++;
    ctx.filter = (numFrame % 2 === 0) ? 'grayscale(1) contrast(1.5)' : 'none';
    ctx.drawImage(video, sx, sy, cw, ch, 0, 0, w, h);
    ctx.filter = 'none';

    let texto = null;
    if (detector) {
      try {
        const r = await detector.detect(canvas);
        if (r.length) texto = r[0].rawValue;
      } catch (e) { detector = null; }
    } else {
      texto = decodificarZxing();
    }

    if (texto && !pausaLectura) {
      const code = String(texto).trim();
      const p = productos.find(function (x) { return x.codigo === code; });
      if (p) {
        pausaLectura = true;
        productoEscaneado = p;
        if (navigator.vibrate) navigator.vibrate(80);
        $('codigoDetectado').textContent = code;
        $('nombreDetectado').textContent = p.nombre;
        const enCarrito = carrito.find(function (x) { return x.id === p.id; });
        const yaEnCarrito = enCarrito ? enCarrito.cantidad : 0;
        const maxPosible = p.stock - yaEnCarrito;
        $('escCantidad').value = 1;
        $('escCantidad').max = maxPosible;
        $('escStock').textContent = 'Disponible: ' + maxPosible;
        $('panelEscaneo').style.display = 'block';
        $('marco').className = 'marco ok';
      } else {
        $('infoCam').textContent = 'Código no reconocido: ' + code;
        pausaLectura = true;
        setTimeout(function () {
          pausaLectura = false;
          $('infoCam').textContent = 'Apunta al código de barras';
        }, 1500);
      }
    }
  } catch (e) {}
  ocupado = false;
}

function ciclo(ts) {
  requestAnimationFrame(ciclo);
  if (ocupado || ts - ultimoIntento < INTERVALO_MS) return;
  const video = $('video');
  if (!(video.readyState >= 2 && video.videoWidth)) return;
  ultimoIntento = ts;
  procesarFrame();
}

async function iniciarCamara() {
  if (stream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    mostrar('Este navegador no permite usar la cámara.', 'error');
    return;
  }
  const opciones = [
    { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
    { video: { facingMode: { ideal: 'environment' } }, audio: false },
    { video: true, audio: false }
  ];
  let ultimoError = null;
  for (let i = 0; i < opciones.length; i++) {
    try {
      stream = await conTiempo(navigator.mediaDevices.getUserMedia(opciones[i]), 10000);
      break;
    } catch (err) {
      ultimoError = err;
      if (err && err.name === 'NotAllowedError') break;
    }
  }
  if (!stream) {
    mostrar('No se pudo abrir la cámara: ' + (ultimoError && ultimoError.name ? ultimoError.name : 'Error'), 'error');
    $('modalCam').classList.remove('abierto');
    return;
  }
  const video = $('video');
  video.srcObject = stream;
  video.play().catch(function () {});
  const track = stream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) {
    track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
  }
  if (caps.zoom) {
    $('zoom').min = caps.zoom.min;
    $('zoom').max = caps.zoom.max;
    $('zoom').step = caps.zoom.step || 0.1;
    $('zoom').value = caps.zoom.min;
    $('zoomBox').style.display = 'block';
  } else {
    $('zoomBox').style.display = 'none';
  }
  if (!cicloActivo) { cicloActivo = true; requestAnimationFrame(ciclo); }
  if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {});
}

function detenerCamara() {
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
}

$('zoom').addEventListener('input', function () {
  if (stream) {
    const track = stream.getVideoTracks()[0];
    if (track) track.applyConstraints({ advanced: [{ zoom: Number($('zoom').value) }] }).catch(function () {});
  }
});

$('escMenos').addEventListener('click', function () {
  let v = Number($('escCantidad').value) || 1;
  if (v > 1) $('escCantidad').value = v - 1;
});
$('escMas').addEventListener('click', function () {
  let v = Number($('escCantidad').value) || 1;
  const max = Number($('escCantidad').max) || 999;
  if (v < max) $('escCantidad').value = v + 1;
});
$('escCancelar').addEventListener('click', function () {
  $('panelEscaneo').style.display = 'none';
  $('marco').className = 'marco';
  productoEscaneado = null;
  setTimeout(function () { pausaLectura = false; }, 800);
});
$('escAgregar').addEventListener('click', function () {
  if (!productoEscaneado) return;
  const cant = Number($('escCantidad').value) || 0;
  if (cant <= 0) { mostrar('Cantidad inválida', 'error'); return; }
  const p = productoEscaneado;
  agregarProductoAlCarrito(p, cant);
  $('panelEscaneo').style.display = 'none';
  $('marco').className = 'marco';
  productoEscaneado = null;
  setTimeout(function () { pausaLectura = false; }, 800);
});

// =====================================================================
// Toggle de botones rápidos (mostrar / ocultar)
// =====================================================================
const RAPIDOS_VISIBLES_KEY = 'caf_rapidos_visibles';

function aplicarEstadoRapidos(visible) {
  const botones = document.getElementById('botonesRapidos');
  const btn = document.getElementById('btnToggleRapidos');
  if (!botones || !btn) return;
  if (visible) {
    botones.style.display = 'grid';
    btn.textContent = '▲ Ocultar';
    btn.style.background = 'var(--azul)';
    btn.style.color = '#fff';
  } else {
    botones.style.display = 'none';
    btn.textContent = '▼ Mostrar';
    btn.style.background = 'var(--azul-suave)';
    btn.style.color = 'var(--azul)';
  }
  try { localStorage.setItem(RAPIDOS_VISIBLES_KEY, visible ? '1' : '0'); } catch (e) {}
}

document.getElementById('btnToggleRapidos').addEventListener('click', function () {
  const visible = document.getElementById('botonesRapidos').style.display === 'grid';
  aplicarEstadoRapidos(!visible);
  if (navigator.vibrate) navigator.vibrate(30);
});

(function () {
  let visible = false;
  try {
    visible = localStorage.getItem(RAPIDOS_VISIBLES_KEY) === '1';
  } catch (e) {}
  aplicarEstadoRapidos(visible);
})();

// ---------- Confirmar salida ----------
function hayCarrito() { return carrito && carrito.length > 0; }

$('linkMenu').addEventListener('click', function (e) {
  e.preventDefault();
  if (hayCarrito()) {
    if (!confirm('⚠️ Tienes productos en el carrito sin cobrar.\n\nSi sales, se perderán.\n\n¿Seguro quieres salir?')) return;
  }
  location.href = 'index.html';
});

window.addEventListener('beforeunload', function (e) {
  if (hayCarrito()) {
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});
</script>

  });
}
