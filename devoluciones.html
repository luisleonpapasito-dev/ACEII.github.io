<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devoluciones · ACEII</title>
<link rel="stylesheet" href="estilos.css">
<!-- Favicons -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B4DB1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A2540" media="(prefers-color-scheme: dark)">
<script src="comun.js"></script>
<style>
  #resultados, #resultadosNuevo { max-height: 320px; overflow-y: auto; margin-top: 6px; }

  .resultado {
    padding: 10px;
    border-bottom: 1px solid #E8ECF4;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .resultado:hover { background: var(--superficie-2); }
  .resultado:last-child { border-bottom: none; }

  .res-thumb {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    flex-shrink: 0;
    overflow: hidden;
    background: var(--superficie-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 20px;
    color: var(--azul);
  }
  .res-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .res-info { flex: 1; min-width: 0; }
  .res-info b {
    font-size: 14px;
    color: var(--texto);
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .res-info small {
    color: var(--texto-suave);
    display: block;
    font-size: 12px;
    margin-top: 2px;
  }
  .res-info .precio {
    color: var(--azul);
    font-weight: 700;
    font-size: 13px;
  }
  .res-info .inactivo {
    background: #FFE5E5;
    color: var(--alerta);
    font-size: 11px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 4px;
  }

  .venta-item {
    padding: 10px;
    border-bottom: 1px solid #E8ECF4;
    cursor: pointer;
    font-size: 13px;
  }
  .venta-item:hover { background: var(--superficie-2); }
  .bloque {
    margin-top: 12px;
    padding: 12px;
    background: var(--superficie-2);
    border-radius: var(--radio-sm);
  }
  .resumen {
    background: #fff;
    padding: 14px;
    border-radius: var(--radio-sm);
    margin-top: 12px;
    border: 1.5px solid var(--azul-suave);
  }
  .resumen .linea {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 14px;
    border: none;
  }
  .resumen .linea.total {
    font-weight: 700;
    color: var(--azul);
    font-size: 16px;
    border-top: 1px solid var(--azul-suave);
    margin-top: 6px;
    padding-top: 8px;
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-contenido">
    <img src="logo_ACEII.png" alt="ACEII" class="app-header-logo">
    <div class="app-header-texto">
      <div class="app-header-titulo">Devoluciones</div>
      <div class="app-header-sub">
        <a href="index.html" style="color:rgba(255,255,255,0.9); text-decoration:underline;">← Volver al menú</a>
      </div>
    </div>
  </div>
</header>

<div id="estado">Cargando...</div>

<div class="caja">
  <label>¿Qué producto se devuelve?</label>
  <input type="text" id="buscar" placeholder="Escribe 2 letras o más..." autocomplete="off">
  <div id="resultados"></div>

  <div id="panelProducto" class="bloque" style="display:none;">
    <div id="prodNombre" style="font-weight:700; margin-bottom:8px;"></div>
    <label>Cantidad a devolver</label>
    <input type="number" id="cantidadDevuelta" value="1" min="1" step="1">
  </div>
</div>

<div class="caja" id="panelDatos" style="display:none;">

  <label>Motivo</label>
  <select id="motivo">
    <option value="">Elige el motivo...</option>
    <option value="Cambio de producto">Cambio de producto</option>
    <option value="Producto en mal estado">Producto en mal estado</option>
    <option value="Cliente se arrepintió">Cliente se arrepintió</option>
    <option value="Error de venta">Error de venta</option>
    <option value="Otro">Otro</option>
  </select>

  <div id="bloqueSimple">
    <label>Medio de reembolso</label>
    <select id="medioSimple">
      <option value="Efectivo">Efectivo</option>
      <option value="Transferencia">Transferencia</option>
    </select>
  </div>

  <div id="bloqueCambio" style="display:none;">
    <label style="margin-top:12px;">¿Qué producto se lleva a cambio?</label>
    <input type="text" id="buscarNuevo" placeholder="Busca el producto nuevo..." autocomplete="off">
    <div id="resultadosNuevo"></div>
    <div id="panelNuevo" class="bloque" style="display:none;">
      <div id="nuevoNombre" style="font-weight:700; margin-bottom:8px;"></div>
      <label>Cantidad nueva</label>
      <input type="number" id="cantidadNueva" value="1" min="1" step="1">
    </div>

    <label style="margin-top:12px;">¿Cómo pagó el producto que devuelve?</label>
    <select id="medioDevolucion">
      <option value="Efectivo">Efectivo</option>
      <option value="Transferencia">Transferencia</option>
    </select>

    <label style="margin-top:12px;">¿Cómo paga el producto nuevo?</label>
    <select id="medioPagoNuevo">
      <option value="Efectivo">Efectivo</option>
      <option value="Transferencia">Transferencia</option>
    </select>
  </div>

  <label style="margin-top:12px;">¿Vincular a una venta original? (opcional)</label>
  <button id="btnBuscarVenta" style="width:100%;">Buscar venta reciente</button>
  <div id="listaVentas" style="display:none; max-height:200px; overflow-y:auto; background:#fff; border-radius:var(--radio-sm); margin-top:6px; padding:4px; border:1.5px solid #E8ECF4;"></div>
  <div id="ventaElegida" style="color:var(--azul); font-size:13px; margin-top:6px; font-weight:600;"></div>

  <label>Observaciones (opcional)</label>
  <input type="text" id="obs" maxlength="200">

  <div id="resumen" class="resumen" style="display:none;"></div>

  <button class="main" id="btnGuardar" style="width:100%; margin-top:12px;">Registrar</button>
</div>

<script>
exigirSesion();
pintarUsuarioTurno();

let productos = [];
let elegido = null;
let elegidoNuevo = null;
let idVentaOriginal = '';

(async function () {
  const ok = await exigirTurnoCajaAbierto();
  if (!ok) return;
  cargarProductos();
})();

async function cargarProductos() {
  mostrar('Cargando productos...', 'aviso');
  try {
    // 1) Traer productos_admin (incluye inactivos)
    const r = await jsonp({ accion: 'productos_admin' }, 25000);
    if (r && r.error === 'Token inválido') { borrarToken(); location.href = 'index.html'; return; }
    if (!r || !r.ok) throw new Error(r && r.error ? r.error : 'respuesta vacía');
    productos = r.items;

    // 2) Si productos_admin NO trae imagen_url, traer inventario y hacer merge
    const sinImagen = productos.filter(function (p) { return !p.imagen_url; });
    if (sinImagen.length > 0) {
      try {
        const rInv = await jsonp({ accion: 'inventario' }, 25000);
        if (rInv && rInv.ok) {
          const mapaImg = {};
          rInv.items.forEach(function (it) { mapaImg[it.id] = it.imagen_url || ''; });
          productos.forEach(function (p) {
            if (!p.imagen_url && mapaImg[p.id]) p.imagen_url = mapaImg[p.id];
          });
        }
      } catch (e) {
        // Si falla, seguimos sin imágenes en algunos
      }
    }

    mostrar('Busca el producto a devolver');
  } catch (err) {
    mostrar('No se pudieron cargar los productos: ' + err.message, 'error');
  }
}

// Colores de placeholder por categoría
function colorPorCategoria(cat) {
  const colores = {
    'Bebidas': '#E3ECFF',
    'Lácteos y avena': '#FFF4DC',
    'Dulces y confitería': '#FCE4EC',
    'Galletas y ponqués': '#EFE7FB',
    'Pasabocas salados': '#E0F7EC',
    'Preparados': '#FFE5E5',
    'Comida instantánea': '#D6F5FA',
    'Combos': '#EFE7FB',
    'Empanadas': '#FFF4DC',
    'Papelería e impresión': '#F0F4FF',
    'Higiene y salud': '#E0F7EC'
  };
  return colores[cat] || '#F0F4FF';
}

// Genera el HTML de la miniatura (imagen o inicial)
function thumbHTML(p) {
  if (p.imagen_url) {
    return '<div class="res-thumb" style="background:#fff;"><img src="' + p.imagen_url + '" alt="" loading="lazy"></div>';
  }
  const inicial = p.nombre ? p.nombre.charAt(0).toUpperCase() : '?';
  return '<div class="res-thumb" style="background:' + colorPorCategoria(p.categoria) + ';">' + inicial + '</div>';
}

function pintarResultados() {
  const q = norm($('buscar').value);
  const cont = $('resultados');
  cont.innerHTML = '';
  $('panelProducto').style.display = 'none';
  if (q.length < 2) return;
  let n = 0;
  productos.forEach(function (p) {
    if (n >= 6) return;
    if (norm(p.id + ' ' + p.nombre).indexOf(q) < 0) return;
    n++;
    const d = document.createElement('div');
    d.className = 'resultado';
    const etiquetaInactivo = (p.activo === 'No') ? ' <span class="inactivo">INACTIVO</span>' : '';
    d.innerHTML =
      thumbHTML(p) +
      '<div class="res-info">' +
        '<b>' + p.nombre + etiquetaInactivo + '</b>' +
        '<small><span class="precio">$' + p.precio.toLocaleString('es-CO') + '</span> · ' + p.id + '</small>' +
      '</div>';
    d.addEventListener('click', function () {
      elegido = p;
      $('prodNombre').textContent = p.nombre + ' — $' + p.precio.toLocaleString('es-CO');
      $('cantidadDevuelta').value = 1;
      $('panelProducto').style.display = 'block';
      $('panelDatos').style.display = 'block';
      $('resultados').innerHTML = '';
      $('buscar').value = '';
      actualizarResumen();
    });
    cont.appendChild(d);
  });
  if (!n) {
    const d = document.createElement('div');
    d.className = 'resultado';
    d.style.color = 'var(--texto-suave)';
    d.textContent = 'Sin resultados.';
    cont.appendChild(d);
  }
}

function pintarResultadosNuevo() {
  const q = norm($('buscarNuevo').value);
  const cont = $('resultadosNuevo');
  cont.innerHTML = '';
  $('panelNuevo').style.display = 'none';
  if (q.length < 2) return;
  let n = 0;
  productos.forEach(function (p) {
    if (n >= 6) return;
    if (p.activo === 'No') return;
    if (norm(p.id + ' ' + p.nombre).indexOf(q) < 0) return;
    n++;
    const d = document.createElement('div');
    d.className = 'resultado';
    d.innerHTML =
      thumbHTML(p) +
      '<div class="res-info">' +
        '<b>' + p.nombre + '</b>' +
        '<small><span class="precio">$' + p.precio.toLocaleString('es-CO') + '</span> · ' + p.id + ' · Stock: ' + p.stock + '</small>' +
      '</div>';
    d.addEventListener('click', function () {
      elegidoNuevo = p;
      $('nuevoNombre').textContent = p.nombre + ' — $' + p.precio.toLocaleString('es-CO');
      $('cantidadNueva').value = 1;
      $('panelNuevo').style.display = 'block';
      $('resultadosNuevo').innerHTML = '';
      $('buscarNuevo').value = '';
      actualizarResumen();
    });
    cont.appendChild(d);
  });
  if (!n) {
    const d = document.createElement('div');
    d.className = 'resultado';
    d.style.color = 'var(--texto-suave)';
    d.textContent = 'Sin resultados.';
    cont.appendChild(d);
  }
}

$('buscar').addEventListener('input', pintarResultados);
$('buscarNuevo').addEventListener('input', pintarResultadosNuevo);

$('motivo').addEventListener('change', function () {
  const esCambio = $('motivo').value === 'Cambio de producto';
  $('bloqueCambio').style.display = esCambio ? 'block' : 'none';
  $('bloqueSimple').style.display = esCambio ? 'none' : 'block';
  actualizarResumen();
});

function actualizarResumen() {
  if (!elegido || !$('motivo').value) { $('resumen').style.display = 'none'; return; }
  const cantDev = Number($('cantidadDevuelta').value) || 0;
  const totalDev = cantDev * elegido.precio;
  const esCambio = $('motivo').value === 'Cambio de producto';
  let html = '<div class="linea"><span>Devuelve: ' + cantDev + '× ' + elegido.nombre + '</span><span>$' + totalDev.toLocaleString('es-CO') + '</span></div>';
  let totalNuevo = 0;
  if (esCambio && elegidoNuevo) {
    const cantNue = Number($('cantidadNueva').value) || 0;
    totalNuevo = cantNue * elegidoNuevo.precio;
    html += '<div class="linea"><span>Lleva: ' + cantNue + '× ' + elegidoNuevo.nombre + '</span><span>$' + totalNuevo.toLocaleString('es-CO') + '</span></div>';
    const dif = totalNuevo - totalDev;
    const etiqueta = dif > 0 ? 'Cliente paga:' : (dif < 0 ? 'Se devuelve al cliente:' : 'Sin diferencia');
    const color = dif > 0 ? 'var(--alerta)' : (dif < 0 ? 'var(--exito)' : 'var(--texto-suave)');
    html += '<div class="linea total" style="color:' + color + '; border-color:' + color + ';"><span>' + etiqueta + '</span><span>$' + Math.abs(dif).toLocaleString('es-CO') + '</span></div>';
  }
  $('resumen').innerHTML = html;
  $('resumen').style.display = 'block';
}

$('cantidadDevuelta').addEventListener('input', actualizarResumen);
$('cantidadNueva').addEventListener('input', actualizarResumen);

$('btnBuscarVenta').addEventListener('click', async function () {
  mostrar('Buscando ventas recientes...', 'aviso');
  try {
    const r = await jsonp({ accion: 'ventas_recientes' }, 20000);
    if (!r || !r.ok) throw new Error('Error al cargar ventas');
    const cont = $('listaVentas');
    cont.innerHTML = '';
    cont.style.display = 'block';
    if (!r.items.length) { cont.textContent = '(no hay ventas recientes)'; return; }
    r.items.forEach(function (v) {
      const d = document.createElement('div');
      d.className = 'venta-item';
      d.textContent = v.fecha + ' · ' + v.id_producto + ' × ' + v.cantidad + ' · ' + v.vendedor;
      d.addEventListener('click', function () {
        idVentaOriginal = v.id_venta;
        $('ventaElegida').textContent = 'Venta vinculada: ' + v.id_venta;
        $('listaVentas').style.display = 'none';
      });
      cont.appendChild(d);
    });
  } catch (err) {
    mostrar('Error: ' + err.message, 'error');
  }
});

$('btnGuardar').addEventListener('click', async function () {
  if (!elegido) { mostrar('Elige un producto', 'error'); return; }
  const cantDev = Number($('cantidadDevuelta').value);
  if (!cantDev || cantDev <= 0) { mostrar('Cantidad a devolver inválida', 'error'); return; }
  if (!$('motivo').value) { mostrar('Elige el motivo', 'error'); return; }

  const u = getUsuarioTurno();
  const t = getTurnoActual();
  if (!u) { mostrar('No hay turno de usuario', 'error'); return; }
  if (!t) { mostrar('No hay turno de caja abierto', 'error'); return; }

  const esCambio = $('motivo').value === 'Cambio de producto';

  if (esCambio) {
    if (!elegidoNuevo) { mostrar('Elige el producto nuevo', 'error'); return; }
    const cantNue = Number($('cantidadNueva').value);
    if (!cantNue || cantNue <= 0) { mostrar('Cantidad nueva inválida', 'error'); return; }

    $('btnGuardar').disabled = true;
    mostrar('Registrando cambio...', 'aviso');
    try {
      const r = await post({
        accion: 'cambio_producto',
        id_usuario: u.id,
        id_turno: t.id,
        id_venta_original: idVentaOriginal,
        id_producto_devuelto: elegido.id,
        cantidad_devuelta: cantDev,
        id_producto_nuevo: elegidoNuevo.id,
        cantidad_nueva: cantNue,
        medio_devolucion: $('medioDevolucion').value,
        medio_pago_nuevo: $('medioPagoNuevo').value,
        observaciones: $('obs').value.trim()
      });
      if (r.ok) {
        const dif = r.diferencia;
        let msj = 'Cambio registrado ✓ ' + r.id_devolucion + ' / ' + r.id_venta;
        if (dif > 0) msj += ' · Cliente paga $' + dif.toLocaleString('es-CO');
        else if (dif < 0) msj += ' · Devuelve al cliente $' + Math.abs(dif).toLocaleString('es-CO');
        else msj += ' · Sin diferencia';
        mostrar(msj, 'ok');
        if (navigator.vibrate) navigator.vibrate(200);
        limpiarTodo();
      } else if (r.error === 'Token inválido') {
        borrarToken(); location.href = 'index.html';
      } else {
        mostrar(r.error || 'Error desconocido', 'error');
      }
    } catch (err) {
      mostrar('Sin conexión. Revisa internet.', 'error');
    } finally {
      $('btnGuardar').disabled = false;
    }
  } else {
    $('btnGuardar').disabled = true;
    mostrar('Registrando devolución...', 'aviso');
    try {
      const r = await post({
        accion: 'devolucion',
        id_usuario: u.id,
        id_turno: t.id,
        id_venta_original: idVentaOriginal,
        id_producto: elegido.id,
        cantidad: cantDev,
        motivo: $('motivo').value,
        observaciones: $('obs').value.trim(),
        medio_reembolso: $('medioSimple').value
      });
      if (r.ok) {
        mostrar('Devolución registrada ✓ ' + r.id_devolucion + ' · ' + r.producto + ' × ' + r.cantidad + ' = $' + r.total.toLocaleString('es-CO'), 'ok');
        if (navigator.vibrate) navigator.vibrate(200);
        limpiarTodo();
      } else if (r.error === 'Token inválido') {
        borrarToken(); location.href = 'index.html';
      } else {
        mostrar(r.error || 'Error desconocido', 'error');
      }
    } catch (err) {
      mostrar('Sin conexión. Revisa internet.', 'error');
    } finally {
      $('btnGuardar').disabled = false;
    }
  }
});

function limpiarTodo() {
  elegido = null; elegidoNuevo = null; idVentaOriginal = '';
  $('ventaElegida').textContent = '';
  $('listaVentas').style.display = 'none';
  $('panelProducto').style.display = 'none';
  $('panelNuevo').style.display = 'none';
  $('panelDatos').style.display = 'none';
  $('bloqueCambio').style.display = 'none';
  $('bloqueSimple').style.display = 'block';
  $('resumen').style.display = 'none';
  $('obs').value = '';
  $('motivo').value = '';
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function (e) {
      console.warn('SW no registrado:', e);
    });
  });
}
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function (e) {
      console.warn('SW no registrado:', e);
    });
  });
}
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function (e) {
      console.warn('SW no registrado:', e);
    });
  });
}
</script>
</body>
</html>
