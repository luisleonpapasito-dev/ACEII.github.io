<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historial de Caja · ACEII</title>
<link rel="stylesheet" href="estilos.css">
<!-- Favicons -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B4DB1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A2540" media="(prefers-color-scheme: dark)">
<script src="comun.js"></script>
<style>


/* Variables para que el nav.js y la app funcionen bien */
:root {
  --ac-texto: #0F1B3D;
  --ac-texto-suave: #5B6785;
  --ac-borde: #E3E9F4;
  --ac-flecha: #2563EB;
  --ac-flecha-bg: rgba(37, 99, 235, 0.10);
  --superficie: #FFFFFF;
  --bottom-nav-height: 84px;
}
html.tema-oscuro {
  --ac-texto: #F1F5FF;
  --ac-texto-suave: #9AA8CC;
  --ac-borde: #223156;
  --ac-flecha: #7DB1FF;
  --ac-flecha-bg: rgba(125, 177, 255, 0.14);
  --superficie: #121D3A;
}

/* Margen inferior para que la barra no tape el último elemento */
body {
  padding-bottom: calc(var(--bottom-nav-height) + 20px + env(safe-area-inset-bottom)) !important;
}
  .turno {
    background: var(--superficie);
    border-radius: var(--radio);
    padding: 14px;
    margin: 10px auto;
    max-width: 480px;
    box-shadow: var(--sombra);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .turno:active { transform: scale(0.98); }
  .turno .fila {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 3px 0;
  }
  .turno .id {
    color: var(--azul);
    font-weight: 700;
    font-size: 13px;
    word-break: break-all;
  }
  .turno .resp { color: var(--texto); font-weight: 600; }
  .turno .estado-abierto { color: var(--aviso); font-weight: 700; }
  .turno .estado-cerrado { color: var(--exito); font-weight: 700; }
  .turno .dif-ok { color: var(--exito); font-weight: 700; }
  .turno .dif-mal { color: var(--alerta); font-weight: 700; }
  .turno .fecha { color: var(--texto-claro); font-size: 12px; }
  .turno .saldo { color: var(--texto-suave); font-size: 13px; }

  .detalle {
    background: var(--superficie);
    border-radius: var(--radio-sm);
    padding: 12px;
    margin: -6px auto 10px;
    max-width: 480px;
    font-size: 13px;
    box-shadow: var(--sombra);
    border-left: 3px solid var(--azul);
  }
  .detalle .row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid #F0F4FF;
  }
  .detalle .row:last-child { border-bottom: none; }

  .filtros {
    display: flex;
    gap: 6px;
    margin: 8px 0;
    flex-wrap: wrap;
  }
  .filtros button {
    flex: 1;
    min-width: 60px;
    padding: 8px;
    font-size: 13px;
    margin: 0;
    background: var(--superficie-2);
    color: var(--texto-suave);
    border: 2px solid transparent;
    font-weight: 600;
  }
  .filtros button.on {
    background: var(--azul);
    color: #fff;
    border-color: var(--azul-claro);
  }

  .btn-forzar {
    background: var(--alerta);
    padding: 8px 12px;
    font-size: 13px;
    margin-top: 8px;
    border-radius: 8px;
    color: #fff;
    border: none;
    font-weight: 600;
  }

  /* ===== NUEVO: Botón "Ver ventas" ===== */
  .btn-ver-ventas {
    background: var(--azul-suave);
    color: var(--azul);
    padding: 8px 12px;
    font-size: 13px;
    margin-top: 8px;
    border-radius: 8px;
    border: none;
    font-weight: 600;
    width: 100%;
  }
  .btn-ver-ventas:active { background: var(--azul-claro); color: #fff; }

  /* ===== NUEVO: Modal de ventas ===== */
  #modalVentas {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    z-index: 200;
    padding: 16px;
    box-sizing: border-box;
    overflow-y: auto;
  }
  #modalVentas.abierto { display: block; }
  #modalVentas .contenido {
    max-width: 480px;
    margin: 20px auto;
    background: var(--superficie);
    border-radius: var(--radio);
    padding: 18px;
    box-shadow: var(--sombra-fuerte);
  }
  #modalVentas .cabecera {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
  }
  #modalVentas .titulo {
    font-size: 16px;
    font-weight: 700;
    color: var(--texto);
    flex: 1;
  }
  #modalVentas .btn-cerrar {
    padding: 6px 12px;
    margin: 0;
    border-radius: 8px;
    font-weight: 700;
  }

  .venta-item {
    background: var(--superficie-2);
    border-radius: var(--radio-sm);
    margin: 8px 0;
    overflow: hidden;
  }
  .venta-cabecera {
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .venta-cabecera:active { background: var(--azul-suave); }
  .venta-cabecera .flecha {
    color: var(--azul);
    font-weight: 700;
    font-size: 12px;
    width: 14px;
    text-align: center;
  }
  .venta-cabecera .hora {
    color: var(--texto-suave);
    font-size: 12px;
    width: 50px;
  }
  .venta-cabecera .id-v {
    color: var(--texto-claro);
    font-size: 11px;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .venta-cabecera .total {
    font-weight: 700;
    color: var(--azul);
    font-size: 14px;
  }
  .venta-cabecera .medio {
    font-size: 11px;
    color: var(--texto-suave);
    margin-left: 4px;
  }

  .venta-lineas {
    display: none;
    padding: 6px 12px 10px;
    background: var(--superficie);
    border-top: 1px solid #E8ECF4;
  }
  .venta-lineas.abierto { display: block; }
  .venta-lineas .linea-prod {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 13px;
    color: var(--texto-suave);
  }
  .venta-lineas .linea-prod .nom {
    color: var(--texto);
    flex: 1;
    padding-right: 8px;
  }
  .venta-lineas .linea-prod .cant {
    color: var(--texto-claro);
    margin-right: 8px;
    font-size: 12px;
  }

  .totales {
    background: var(--azul-suave);
    border-radius: var(--radio-sm);
    padding: 12px;
    margin-top: 14px;
  }
  .totales .fila-t {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 14px;
  }
  .totales .fila-t.total {
    border-top: 1px solid var(--azul-claro);
    margin-top: 6px;
    padding-top: 8px;
    font-weight: 700;
    color: var(--azul);
    font-size: 16px;
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-contenido">
    <img src="logo_ACEII.png" alt="ACEII" class="app-header-logo">
    <div class="app-header-texto">
      <div class="app-header-titulo">Historial de caja</div>
      <div class="app-header-sub">
        <a href="index.html" style="color:rgba(255,255,255,0.9); text-decoration:underline;">← Volver al menú</a>
      </div>
    </div>
  </div>
</header>

<div id="estado">Cargando...</div>

<div class="caja">
  <label>Filtrar por</label>
  <div class="filtros">
    <button id="fHoy" class="on">Hoy</button>
    <button id="fAyer">Ayer</button>
    <button id="fSemana">7 días</button>
    <button id="fMes">30 días</button>
    <button id="fTodo">Todo</button>
  </div>
  <button class="main" id="btnActualizar" style="width:100%;">Actualizar</button>
</div>

<div id="listaTurnos"></div>

<!-- ===== NUEVO: Modal de ventas del turno ===== -->
<div id="modalVentas">
  <div class="contenido">
    <div class="cabecera">
      <div class="titulo" id="tituloModal">Ventas del turno</div>
      <button class="btn-cerrar" id="btnCerrarModal">✕</button>
    </div>
    <div id="cuerpoModal" style="color:var(--texto-suave); font-size:13px;">Cargando...</div>
  </div>
</div>

<script>
exigirSesion();
pintarUsuarioTurno();

let filtro = 'hoy';

function fmtFechaCorta(d) {
  const y = d.getFullYear();
  const m = ('0' + (d.getMonth() + 1)).slice(-2);
  const dia = ('0' + d.getDate()).slice(-2);
  return y + '-' + m + '-' + dia;
}

function rangoFechas() {
  const hoy = new Date();
  const hasta = fmtFechaCorta(hoy) + ' 23:59:59';

  if (filtro === 'hoy') {
    return { desde: fmtFechaCorta(hoy) + ' 00:00:00', hasta: hasta };
  }
  if (filtro === 'ayer') {
    const ayer = new Date(hoy);
    ayer.setDate(ayer.getDate() - 1);
    const dia = fmtFechaCorta(ayer);
    return { desde: dia + ' 00:00:00', hasta: dia + ' 23:59:59' };
  }
  if (filtro === 'semana') {
    const hace7 = new Date(hoy);
    hace7.setDate(hace7.getDate() - 6);
    return { desde: fmtFechaCorta(hace7) + ' 00:00:00', hasta: hasta };
  }
  if (filtro === 'mes') {
    const hace30 = new Date(hoy);
    hace30.setDate(hace30.getDate() - 29);
    return { desde: fmtFechaCorta(hace30) + ' 00:00:00', hasta: hasta };
  }
  return { desde: '', hasta: '' };
}

function fmt(n) { return '$' + Number(n || 0).toLocaleString('es-CO'); }

async function cargar() {
  mostrar('Cargando historial...', 'aviso');
  const rango = rangoFechas();
  try {
    const r = await jsonp({ accion: 'historial_turnos', desde: rango.desde, hasta: rango.hasta }, 30000);
    if (!r || !r.ok) throw new Error(r && r.error ? r.error : 'Error');
    pintar(r.items);
    mostrar(r.items.length + ' turno(s) encontrado(s)', 'ok');
  } catch (err) {
    mostrar('Error: ' + err.message, 'error');
  }
}

function pintar(items) {
  const cont = $('listaTurnos');
  cont.innerHTML = '';
  if (!items.length) {
    cont.innerHTML = '<div class="caja" style="text-align:center; color:var(--texto-suave);">(no hay turnos en este rango)</div>';
    return;
  }
  items.forEach(function (t) {
    const d = document.createElement('div');
    d.className = 'turno';
    const dif = Number(t.diferencia || 0);
    const difClase = dif === 0 ? 'dif-ok' : 'dif-mal';
    const difTexto = dif === 0 ? 'Cuadró ✓' : (dif > 0 ? '+' + fmt(dif) : fmt(dif));
    const estadoClase = t.estado === 'Abierto' ? 'estado-abierto' : 'estado-cerrado';
    d.innerHTML =
      '<div class="fila"><span class="id">' + t.id_turno + '</span><span class="' + estadoClase + '">' + t.estado + '</span></div>' +
      '<div class="fila"><span class="resp">' + t.responsable + '</span><span class="fecha">' + t.fecha_apertura + '</span></div>' +
      '<div class="fila"><span class="saldo">Esperado: ' + fmt(t.saldo_esperado) + '</span><span class="saldo">Real: ' + fmt(t.saldo_real) + '</span></div>' +
      '<div class="fila"><span class="saldo">Diferencia:</span><span class="' + difClase + '">' + difTexto + '</span></div>';

    if (t.estado === 'Abierto') {
      const btnForzar = document.createElement('button');
      btnForzar.className = 'btn-forzar';
      btnForzar.textContent = 'Forzar cierre';
      btnForzar.addEventListener('click', function (ev) {
        ev.stopPropagation();
        forzarCierre(t.id_turno, t.responsable);
      });
      d.appendChild(btnForzar);
    }

    // ===== NUEVO: Botón "Ver ventas" =====
    const btnVentas = document.createElement('button');
    btnVentas.className = 'btn-ver-ventas';
    btnVentas.textContent = '📋 Ver ventas del turno';
    btnVentas.addEventListener('click', function (ev) {
      ev.stopPropagation();
      abrirModalVentas(t.id_turno, t.responsable, t.fecha_apertura);
    });
    d.appendChild(btnVentas);

    d.addEventListener('click', function () {
      mostrarDetalle(t.id_turno, d);
    });
    cont.appendChild(d);
  });
}

async function forzarCierre(idTurno, responsable) {
  if (!confirm('Vas a forzar el cierre del turno ' + idTurno + ' de ' + responsable + '.\n\nEsta acción NO se puede deshacer. ¿Continuar?')) return;
  const saldoRealStr = prompt('Escribe el efectivo REAL que hay en caja ahora:');
  if (saldoRealStr === null) return;
  const saldoReal = Number(saldoRealStr);
  if (isNaN(saldoReal) || saldoReal < 0) { alert('Valor inválido'); return; }
  const u = getUsuarioTurno();
  const obs = 'CIERRE FORZADO por ' + (u ? u.nombre : '') + '. ' + (prompt('Observación (opcional):') || '');
  mostrar('Cerrando turno...', 'aviso');
  try {
    const r = await post({
      accion: 'cerrar_turno',
      id_usuario: u.id,
      id_turno: idTurno,
      saldo_real: saldoReal,
      observaciones: obs
    });
    if (r.ok) {
      let msj = 'Turno cerrado ✓\nEsperado: ' + fmt(r.saldo_esperado) + '\nReal: ' + fmt(r.saldo_real);
      if (r.diferencia !== 0) msj += '\nDIFERENCIA: ' + (r.diferencia > 0 ? '+' : '') + fmt(r.diferencia);
      alert(msj);
      cargar();
    } else {
      alert('Error: ' + (r.error || 'desconocido'));
    }
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

async function mostrarDetalle(idTurno, nodo) {
  const sig = nodo.nextSibling;
  if (sig && sig.classList && sig.classList.contains('detalle')) {
    sig.remove();
    return;
  }
  document.querySelectorAll('.detalle').forEach(function (d) { d.remove(); });

  const d = document.createElement('div');
  d.className = 'detalle';
  d.textContent = 'Cargando movimientos...';
  nodo.parentNode.insertBefore(d, nodo.nextSibling);
  try {
    const r = await jsonp({ accion: 'movimientos_turno', id_turno: idTurno }, 30000);
    if (!r || !r.ok) { d.textContent = 'Error al cargar movimientos'; return; }
    if (!r.items.length) { d.textContent = '(sin movimientos)'; return; }
    let html = '<strong style="color:var(--azul);">Movimientos del turno:</strong>';
    r.items.forEach(function (m) {
      const signo = m.tipo === 'Ingreso' ? '+' : '-';
      const color = m.tipo === 'Ingreso' ? 'var(--exito)' : 'var(--alerta)';
      html += '<div class="row"><span>' + m.fecha_hora + ' · ' + m.categoria + (m.descripcion ? ' (' + m.descripcion + ')' : '') + '</span><span style="color:' + color + ';font-weight:700;">' + signo + fmt(m.monto) + '</span></div>';
    });
    d.innerHTML = html;
  } catch (err) {
    d.textContent = 'Error: ' + err.message;
  }
}

// =====================================================================
// NUEVO: Modal de ventas del turno (con desglose plegable)
// =====================================================================
async function abrirModalVentas(idTurno, responsable, fecha) {
  $('tituloModal').textContent = 'Ventas · ' + idTurno;
  $('cuerpoModal').innerHTML = 'Cargando...';
  $('modalVentas').classList.add('abierto');

  try {
    const r = await jsonp({ accion: 'ventas_del_turno', id_turno: idTurno }, 30000);
    if (!r || !r.ok) {
      $('cuerpoModal').innerHTML = '<div style="color:var(--alerta);">Error: ' + (r && r.error ? r.error : 'desconocido') + '</div>';
      return;
    }
    if (!r.items.length) {
      $('cuerpoModal').innerHTML = '<div style="text-align:center; padding:20px; color:var(--texto-suave);">No hay ventas registradas en este turno.</div>';
      return;
    }

    let html = '';
    r.items.forEach(function (v, idx) {
      const hora = (v.fecha || '').split(' ')[1] || '';
      const horaCorta = hora.substring(0, 5);
      html +=
        '<div class="venta-item">' +
          '<div class="venta-cabecera" data-idx="' + idx + '">' +
            '<span class="flecha">▶</span>' +
            '<span class="hora">' + horaCorta + '</span>' +
            '<span class="id-v">' + v.id_venta + '</span>' +
            '<span class="total">' + fmt(v.total) + '</span>' +
            '<span class="medio">' + (v.medio_pago === 'Efectivo' ? '💵' : '📱') + '</span>' +
          '</div>' +
          '<div class="venta-lineas" data-lineas="' + idx + '">' +
            v.lineas.map(function (l) {
              return '<div class="linea-prod">' +
                '<span class="nom">' + l.producto + '</span>' +
                '<span class="cant">' + l.cantidad + '× $' + l.precio.toLocaleString('es-CO') + '</span>' +
                '<span style="font-weight:600;color:var(--texto);">$' + l.subtotal.toLocaleString('es-CO') + '</span>' +
              '</div>';
            }).join('') +
          '</div>' +
        '</div>';
    });

    html +=
      '<div class="totales">' +
        '<div class="fila-t"><span>💵 Efectivo</span><span style="font-weight:700;">' + fmt(r.total_efectivo) + '</span></div>' +
        '<div class="fila-t"><span>📱 Transferencia</span><span style="font-weight:700;">' + fmt(r.total_transferencia) + '</span></div>' +
        '<div class="fila-t total"><span>TOTAL</span><span>' + fmt(r.total_general) + '</span></div>' +
      '</div>';

    $('cuerpoModal').innerHTML = html;

    // Listeners para plegar/desplegar
    $('cuerpoModal').querySelectorAll('.venta-cabecera').forEach(function (cab) {
      cab.addEventListener('click', function () {
        const idx = cab.getAttribute('data-idx');
        const lineas = $('cuerpoModal').querySelector('[data-lineas="' + idx + '"]');
        const flecha = cab.querySelector('.flecha');
        if (lineas.classList.contains('abierto')) {
          lineas.classList.remove('abierto');
          flecha.textContent = '▶';
        } else {
          lineas.classList.add('abierto');
          flecha.textContent = '▼';
        }
      });
    });
  } catch (err) {
    $('cuerpoModal').innerHTML = '<div style="color:var(--alerta);">Error: ' + err.message + '</div>';
  }
}

$('btnCerrarModal').addEventListener('click', function () {
  $('modalVentas').classList.remove('abierto');
});

// Cerrar modal al tocar el fondo
$('modalVentas').addEventListener('click', function (e) {
  if (e.target === $('modalVentas')) $('modalVentas').classList.remove('abierto');
});

function marcarActivo(btn) {
  ['fHoy', 'fAyer', 'fSemana', 'fMes', 'fTodo'].forEach(function (id) {
    const el = $(id);
    if (el) el.className = '';
  });
  btn.className = 'on';
}

$('fHoy').addEventListener('click', function () { filtro = 'hoy'; marcarActivo(this); cargar(); });
$('fAyer').addEventListener('click', function () { filtro = 'ayer'; marcarActivo(this); cargar(); });
$('fSemana').addEventListener('click', function () { filtro = 'semana'; marcarActivo(this); cargar(); });
$('fMes').addEventListener('click', function () { filtro = 'mes'; marcarActivo(this); cargar(); });
$('fTodo').addEventListener('click', function () { filtro = 'todo'; marcarActivo(this); cargar(); });
$('btnActualizar').addEventListener('click', cargar);

cargar();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function (e) {
      console.warn('SW no registrado:', e);
    });
  });
}
</script>
</body>
</html>
