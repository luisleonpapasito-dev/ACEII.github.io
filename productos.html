<style>
  #listaProductos {
    max-height: 500px;
    overflow-y: auto;
    margin-top: 8px;
  }
  .prod-item {
    padding: 10px;
    border-bottom: 1px solid #E8ECF4;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .prod-item:hover { background: var(--superficie-2); }
  .prod-item:last-child { border-bottom: none; }
  .prod-item.inactivo { opacity: 0.55; }

  .prod-thumb {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    flex-shrink: 0;
    overflow: hidden;
    background: var(--superficie-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 22px;
    color: var(--azul);
  }
  .prod-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .prod-info { flex: 1; min-width: 0; }
  .prod-info .fila {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .prod-info .nombre {
    font-size: 15px;
    font-weight: 600;
    color: var(--texto);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .prod-info .meta {
    font-size: 12px;
    color: var(--texto-suave);
    margin-top: 2px;
  }
  .prod-info .precio {
    color: var(--azul);
    font-weight: 700;
    font-size: 14px;
  }
  .prod-info .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 4px;
  }
  .badge-activo { background: #E0F7EC; color: var(--exito); }
  .badge-inactivo { background: #FFE5E5; color: var(--alerta); }
  .badge-modo { background: var(--azul-suave); color: var(--azul); }

  .form-grupo {
    margin-top: 12px;
  }
  .form-grupo label {
    font-weight: 600;
    color: var(--texto);
    font-size: 13px;
    margin-top: 10px;
  }
  .form-grupo input,
  .form-grupo select,
  .form-grupo textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    margin-top: 4px;
    box-sizing: border-box;
  }
  .aviso-id {
    background: var(--azul-suave);
    color: var(--azul);
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    margin: 10px 0;
    text-align: center;
    font-weight: 700;
  }

  .codigo-fila {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 4px;
  }
  .codigo-fila input {
    flex: 1;
    margin: 0;
  }
  .codigo-fila button {
    margin: 0;
    padding: 10px 14px;
    white-space: nowrap;
    background: var(--azul);
    color: #fff;
    font-weight: 600;
    border-radius: 8px;
  }

  /* Bloque de imagen */
  .imagen-bloque {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-top: 6px;
    background: var(--superficie-2);
    padding: 10px;
    border-radius: 10px;
  }
  .imagen-preview {
    width: 80px;
    height: 80px;
    border-radius: 10px;
    flex-shrink: 0;
    overflow: hidden;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--texto-claro);
    font-size: 12px;
    text-align: center;
    border: 2px solid #E8ECF4;
  }
  .imagen-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .imagen-acciones {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .imagen-acciones button {
    margin: 0;
    padding: 8px 12px;
    font-size: 13px;
    border-radius: 8px;
  }

  /* Modal de cámara */
  #modalCam {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 100;
  }
  #modalCam.abierto { display: block; }
  #modalCam video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #modalCam .cerrar {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 10px 14px;
    background: var(--alerta);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    z-index: 2;
  }
  #modalCam .marco {
    position: absolute;
    left: 5%;
    top: 27.5%;
    width: 90%;
    height: 45%;
    border: 3px solid #00e676;
    border-radius: 10px;
    box-sizing: border-box;
    pointer-events: none;
  }
  #modalCam .marco.ok { border-color: #40c4ff; }
  #modalCam .info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
    background: rgba(0, 0, 0, 0.7);
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    color: #fff;
    font-size: 14px;
  }

    .pills-fila {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 0 8px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .pills-fila::-webkit-scrollbar { display: none; }
  .pill-cat {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 20px;
    background: var(--superficie-2);
    color: var(--texto-suave);
    font-weight: 600;
    font-size: 13px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    user-select: none;
    -webkit-user-select: none;
  }
  .pill-cat:active { transform: scale(0.96); }
  .pill-cat.activa {
    background: var(--azul);
    color: #fff;
    border-color: var(--azul-claro);
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
  }

      #panelFiltros .pills-fila {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    overflow: visible;
    padding: 0 0 4px;
  }
  #panelFiltros .pills-fila {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    overflow: visible;
    padding: 0 0 4px;
  }
  #panelFiltros .pill-cat {
    background: var(--superficie);
    border: 2px solid var(--azul-borde);
    padding: 8px 12px;
    min-height: 48px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    text-align: left;
    white-space: normal;
    line-height: 1.2;
  }
  #panelFiltros .pill-cat .pill-icon {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #panelFiltros .pill-cat .pill-icon svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  #panelFiltros .pill-cat.activa {
    background: var(--azul);
    color: #fff;
    border-color: var(--azul-claro);
  }
  #panelFiltros .pill-cat:first-child { grid-column: 1 / -1; }

  .filtros-opciones {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
    padding-top: 12px;
    border-top: 1px solid var(--azul-borde);
  }
  .filtros-opciones label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    padding: 10px;
    background: var(--superficie);
    border-radius: 12px;
    font-size: 14px;
  }
  #btnLimpiarFiltros {
    width: 100%;
    margin-top: 12px;
    background: var(--superficie);
    color: var(--azul);
    border: 2px solid var(--azul-borde);
    font-weight: 700;
  }


    .codigo-fila button svg { width: 24px; height: 24px; display: block; }
</style>
</head>

<script>
exigirSesion();
pintarUsuarioTurno();

let productos = [];
let categorias = [];
let proveedores = [];
let modos = [];
let modoForm = 'crear';
let productoEditando = null;
let imagenUrlActual = '';
let filtroCat = '';
let filtroImg = '';
function norm_(s) {
  return String(s === null || s === undefined ? '' : s).trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

// Seguridad: evitar inyección de HTML en la lista
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

(async function () {
  await cargarTodo();
})();

async function cargarTodo() {
  mostrar('Cargando datos...', 'aviso');
  try {
    const [rProd, rCat, rProv, rModos] = await Promise.all([
      jsonp({ accion: 'productos_admin' }, 25000),
      jsonp({ accion: 'categorias' }, 15000),
      jsonp({ accion: 'proveedores' }, 15000),
      jsonp({ accion: 'modos_registro' }, 15000)
    ]);
    if (rProd && rProd.error === 'Token inválido') { borrarToken(); location.href = 'index.html'; return; }
    if (!rProd || !rProd.ok) throw new Error('Error al cargar productos');
    productos = rProd.items;
    categorias = (rCat && rCat.ok) ? rCat.items : [];
    proveedores = (rProv && rProv.ok) ? rProv.items : [];
    modos = (rModos && rModos.ok) ? rModos.items : [];

    llenarSelectsForm();

  contCat.innerHTML = '';
  crearPill(contCat, 'Todas', filtroCat === '', function () { filtroCat = ''; }, ICONOS_PILL.todas);
  categorias.forEach(function (c) {
    const n = (typeof c === 'string') ? c : (c.nombre || '');
    if (!n) return;
    crearPill(contCat, n, filtroCat === n, function () {
      filtroCat = (filtroCat === n) ? '' : n;
    }, iconoPillAnimado(n));
  });

function pintarLista() {
  actualizarBadgeFiltros();
  const q = norm($('buscar').value);
  const soloActivos = $('soloActivos').checked;
  const cont = $('listaProductos');
  cont.innerHTML = '';

  let items = productos.slice();

  if (soloActivos) items = items.filter(function (p) { return p.activo !== 'No'; });

  if (q) {
    items = items.filter(function (p) {
      return norm(p.id + ' ' + p.nombre + ' ' + p.codigo + ' ' + p.categoria).indexOf(q) >= 0;
    });
  }

  if (filtroCat) {
    items = items.filter(function (p) { return p.categoria === filtroCat; });
  }

  if ($('soloSinImagen').checked) {
    items = items.filter(function (p) { return !p.imagen_url; });
  }

  items.sort(function (a, b) { return a.nombre.localeCompare(b.nombre); });

  if (!items.length) {
    cont.innerHTML = '<div style="padding:20px; text-align:center; color:var(--texto-suave);">No se encontraron productos con esos filtros.</div>';
    return;
  }

  items.forEach(function (p) {
    const d = document.createElement('div');
    d.className = 'prod-item' + (p.activo === 'No' ? ' inactivo' : '');

    let thumbHTML = '';
    if (p.imagen_url) {
      thumbHTML = '<img src="' + esc(p.imagen_url) + '" alt="" loading="lazy">';
    } else {
      const inicial = p.nombre ? p.nombre.charAt(0).toUpperCase() : '?';
      thumbHTML = '<span style="color:var(--azul);">' + esc(inicial) + '</span>';
    }

    d.innerHTML =
      '<div class="prod-thumb" style="background:' + (p.imagen_url ? '#fff' : colorPorCategoria(p.categoria)) + ';">' + thumbHTML + '</div>' +
      '<div class="prod-info">' +
        '<div class="fila">' +
          '<span class="nombre">' + esc(p.nombre) + '</span>' +
          '<span class="precio">$' + p.precio.toLocaleString('es-CO') + '</span>' +
        '</div>' +
        '<div class="meta">' +
          esc(p.id) + ' · ' + esc(p.categoria) +
          ' <span class="badge badge-modo">' + esc(p.modo) + '</span>' +
          ' <span class="badge ' + (p.activo === 'No' ? 'badge-inactivo' : 'badge-activo') + '">' +
            (p.activo === 'No' ? 'INACTIVO' : 'Activo') +
          '</span>' +
        '</div>' +
        '<div class="meta">' + (p.proveedor ? esc(p.proveedor) : '(sin proveedor)') + (p.codigo ? ' · ' + esc(p.codigo) : '') + '</div>' +
      '</div>';

    d.addEventListener('click', function () { abrirEditar(p); });
    cont.appendChild(d);
  });
}

function convertirUrlImagen_(url) {
  let m = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return 'https://lh3.googleusercontent.com/d/' + m[1];
  m = url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
  if (m) return 'https://lh3.googleusercontent.com/d/' + m[1];
  m = url.match(/drive\.google\.com\/uc\?.*id=([a-zA-Z0-9_-]+)/);
  if (m) return 'https://lh3.googleusercontent.com/d/' + m[1];
  return url;
}

function verificarUrlImagen(url) {
  const img = new Image();
  img.onload = function () {
    mostrar('URL cargada ✓', 'ok');
  };
  img.onerror = function () {
    mostrar('⚠️ La imagen no cargó. Verifica que sea un link directo o sube la foto.', 'error');
  };
  img.src = url;
}

function comprimirImagen(archivo, maxAncho, calidad, callback) {
  const reader = new FileReader();
  reader.onload = function (ev) {
    const img = new Image();
    img.onload = function () {
      let w = img.width;
      let h = img.height;
      if (w > maxAncho) {
        h = Math.round(h * maxAncho / w);
        w = maxAncho;
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', calidad);
      const base64 = dataUrl.split(',')[1];
      callback(base64, 'image/jpeg');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(archivo);
}

// ESCÁNER DE CÓDIGO DE BARRAS
// =====================================================================
let lectorZxing = null;
let stream = null;
let cicloActivo = false;
let ocupado = false;
let ultimoIntento = 0;
let numFrame = 0;
let detector = null;
let pausaLectura = false;
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const INTERVALO_MS = 40;
const FORMATOS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'];

if ('BarcodeDetector' in window) {
  BarcodeDetector.getSupportedFormats().then(function (f) {
    const ok = FORMATOS.filter(function (x) { return f.indexOf(x) >= 0; });
    if (ok.length) detector = new BarcodeDetector({ formats: ok });
  }).catch(function () {});
}

$('btnEscanearCodigo').addEventListener('click', async function () {
  $('modalCam').classList.add('abierto');
  await iniciarCamara();
});

$('btnCerrarCam').addEventListener('click', function () {
  $('modalCam').classList.remove('abierto');
  detenerCamara();
  cicloActivo = false;
  pausaLectura = false;

function decodificarZxing() {
  if (typeof ZXing === 'undefined') return null;
  try {
    if (!lectorZxing) {
      const h = new Map();
      h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.CODE_128
      ]);
      h.set(ZXing.DecodeHintType.TRY_HARDER, true);
      lectorZxing = new ZXing.MultiFormatReader();
      lectorZxing.setHints(h);
    }
    const fuente = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
    return lectorZxing.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(fuente))).getText();
  } catch (e) { return null; }
}

async function procesarFrame() {
  ocupado = true;
  try {
    const video = $('video');
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) { ocupado = false; return; }
    const cw = Math.floor(vw * 0.9), ch = Math.floor(vh * 0.45);
    const sx = Math.floor((vw - cw) / 2), sy = Math.floor((vh - ch) / 2);
    const w = Math.min(cw, 960), h = Math.round(ch * w / cw);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    numFrame++;
    ctx.filter = (numFrame % 2 === 0) ? 'grayscale(1) contrast(1.5)' : 'none';
    ctx.drawImage(video, sx, sy, cw, ch, 0, 0, w, h);
    ctx.filter = 'none';

    let texto = null;
    if (detector) {
      try {
        const r = await detector.detect(canvas);
        if (r.length) texto = r[0].rawValue;
      } catch (e) { detector = null; }
    } else {
      texto = decodificarZxing();
    }

    if (texto && !pausaLectura) {
      const code = String(texto).trim();
      if (navigator.vibrate) navigator.vibrate(80);
      $('fCodigo').value = code;
      $('infoCam').textContent = '✓ Código detectado: ' + code;
      $('marco').className = 'marco ok';

      pausaLectura = true;
      setTimeout(function () {
        $('modalCam').classList.remove('abierto');
        detenerCamara();
        cicloActivo = false;
        pausaLectura = false;
        $('marco').className = 'marco';
        $('infoCam').textContent = 'Apunta al código de barras';
        mostrar('Código capturado ✓', 'ok');
      }, 700);
    }
  } catch (e) {}
  ocupado = false;
}

function ciclo(ts) {
  requestAnimationFrame(ciclo);
  if (ocupado || pausaLectura || ts - ultimoIntento < INTERVALO_MS) return;
  const video = $('video');
  if (!(video.readyState >= 2 && video.videoWidth)) return;
  ultimoIntento = ts;
  procesarFrame();
}

async function iniciarCamara() {
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('Este navegador no permite usar la cámara.');
    $('modalCam').classList.remove('abierto');
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    const video = $('video');
    video.srcObject = stream;
    video.play().catch(function () {});
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) {
      track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
    }
    if (!cicloActivo) { cicloActivo = true; requestAnimationFrame(ciclo); }
  } catch (err) {
    alert('No se pudo abrir la cámara: ' + (err.name || 'Error'));
    $('modalCam').classList.remove('abierto');
  }
}

function detenerCamara() {
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
}

const COLA_IA_KEY = 'caf_ia_cola_imagenes';
let procesoIAActivo = false; // Variable global para controlar el ciclo

// Esta función se encarga de pintar el botón según el estado actual
function actualizarBotonIA() {
  const btn = $('btnAutoImagenes');
  if (!btn) return;
  
  let cola = [];

        const svgVarita = `

l="#E0F2FE" opacity="0.9" /><circle cx="568" cy="170" r="8" fill="#E0F2FE" opacity="0.9" /><g stroke="#2E3A59" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="#2E3A59"><path d="M 480,155 L 535,75 L 580,155 Z" /><path d="M 430,155 L 475,95 L 520,155 Z" /><path d="M 425,155 L 585,155" /></g><circle cx="495" cy="70" r="11" fill="#2E3A59" /></g></svg>
  `;

  if (procesoIAActivo) {
    btn.disabled = true;
    btn.innerHTML = '⏳';
    btn.style.background = '#E5E7EB'; 
  } else if (cola.length > 0) {
    btn.disabled = false;
    btn.innerHTML = '▶️';
    btn.style.background = '#FEF3C7'; 
  } else {
    btn.disabled = false;
    btn.innerHTML = svgVarita;
    btn.style.background = '';
  }
}
// Función que procesa la cola (la hacemos async para poder pausarla)
async function procesarColaIA() {
  if (procesoIAActivo) return;
  procesoIAActivo = true;
  actualizarBotonIA();

  let cola = [];
  try { cola = JSON.parse(localStorage.getItem(COLA_IA_KEY) || '[]'); } catch(e) {}
  
  let exitos = 0;
  let errores = 0;

  // Mientras haya productos en la cola
  while (cola.length > 0) {
    const p = cola[0]; // Tomamos el primero de la fila
    
    try {
      const r = await post({ accion: 'autocompletar_imagenes', id: p.id, nombre: p.nombre });
      
      if (r.ok) {
        exitos++;
        mostrar(`✅ Imagen añadida: ${p.nombre}`, 'ok');
      } else if (r.cuota || r.fatal) {
        // Si se acaba la cuota o falla la API, detenemos todo
        procesoIAActivo = false;
        actualizarBotonIA();
        mostrar('⚠️ Se detuvo por cuota o error fatal: ' + r.error, 'error');
        return;
      } else {
        errores++;
      }
    } catch (e) {
      errores++;
    }

    // Quitamos el producto de la cola y lo guardamos en el navegador
    cola.shift();
    localStorage.setItem(COLA_IA_KEY, JSON.stringify(cola));
    
    // Actualizamos el botón para que el usuario vea el progreso
    actualizarBotonIA();

    // Pausa obligatoria de 1.5s para no saturar la API
    await new Promise(r => setTimeout(r, 1500));
  }

  // Cuando la cola queda vacía
  procesoIAActivo = false;
  localStorage.removeItem(COLA_IA_KEY); // Limpiamos la memoria
  actualizarBotonIA();
  mostrar(`✨ Proceso terminado. Éxitos: ${exitos}, Errores: ${errores}`, 'ok');
  
  // Recargamos la lista para ver todas las fotos nuevas
  await cargarTodo();
}

  let cola = [];
  try { cola = JSON.parse(localStorage.getItem(COLA_IA_KEY) || '[]'); } catch(e) {}
  
  // Si no hay cola guardada, creamos una nueva
  if (cola.length === 0) {
    let sinImagen = productos.filter(p => !p.imagen_url && p.activo !== 'No');
    sinImagen = sinImagen.slice(0, 20); // Pon el límite que quieras aquí
    
    if (sinImagen.length === 0) {
      mostrar('Todos los productos activos ya tienen imagen ✨', 'aviso');
      return;
    }

    if (!confirm(`Se buscarán imágenes para ${sinImagen.length} productos sin foto.\n\nEsto puede tardar unos minutos y consumirá tus créditos de SerpApi. ¿Continuar?`)) return;
    
    // Llenamos la cola con los productos
    cola = sinImagen.map(p => ({ id: p.id, nombre: p.nombre }));
    localStorage.setItem(COLA_IA_KEY, JSON.stringify(cola));
  } else {
    // Si ya había una cola guardada, preguntamos si desea continuar
    if (!confirm(`Hay una búsqueda en pausa con ${cola.length} productos pendientes.\n\n¿Deseas continuar desde donde se quedó?`)) return;
  }

  // Arrancamos el proceso (o continuamos)
  procesarColaIA();
});

// Al cargar la página, si hay una cola pendiente, mostramos el botón para continuar
document.addEventListener('DOMContentLoaded', function() {
  actualizarBotonIA();
  
  // Si había una cola pendiente y la app se cerró de golpe, preguntamos si quiere reanudar
  let cola = [];
  try { cola = JSON.parse(localStorage.getItem(COLA_IA_KEY) || '[]'); } catch(e) {}
  if (cola.length > 0 && !procesoIAActivo) {
    // Pequeño retraso para que carguen los productos primero
    setTimeout(() => {
      if (confirm(`Se encontró una búsqueda de imágenes inconclusa (${cola.length} pendientes).\n\n¿Deseas reanudarla ahora?`)) {
        procesarColaIA();
      }
    }, 1500);
  }
}); 
  
</script>
